<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM Muzybar</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CRM Robots">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bgCard:#111;--border:#222;--text:#f0f0f0;--textMuted:#666;--textSub:#888;
  --accent:#f97316;--accentDim:#7c2d12;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden}
#app{display:none;flex-direction:column;height:100vh;height:100dvh}

/* HEADER */
.m-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
  background:var(--bgCard);border-bottom:1px solid var(--border);
  flex-shrink:0
}
.m-logo{height:28px}
.m-header-right{display:flex;align-items:center;gap:10px}
.m-sync{font-size:11px;color:var(--textMuted)}
.m-backup-btn{background:transparent;border:1px solid #333;color:#777;padding:4px 8px;border-radius:5px;font-size:11px;cursor:pointer}

/* CONTENT AREA */
.m-content{flex:1;overflow-y:auto;padding:0 0 8px;-webkit-overflow-scrolling:touch}

/* SECTION HEADER */
.m-section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 10px;
}
.m-section-title{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.5px}
.m-section-count{font-size:13px;color:var(--textMuted);margin-left:6px;font-weight:400}
.m-add-btn{
  background:transparent;border:1px solid #444;color:#999;
  padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;
  white-space:nowrap
}

/* FILTER BAR */
.m-filter-bar{
  padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.m-filter-bar::-webkit-scrollbar{display:none}
.m-pill{
  background:#161616;border:1px solid #2a2a2a;color:var(--textMuted);
  padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;
  flex-shrink:0
}
.m-pill.active{background:#1a1a1a;border-color:#f97316;color:#f97316}
.m-search{
  background:#161616;border:1px solid #2a2a2a;color:var(--text);
  padding:8px 12px;border-radius:8px;font-size:14px;width:100%;
  margin:0 16px 10px;width:calc(100% - 32px);display:block;outline:none
}

/* LIST */
.m-list{padding:0 16px}
.m-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer
}
.m-item:last-child{border-bottom:none}
.m-item:active{background:#111;margin:0 -16px;padding:12px 16px;border-radius:8px}
.m-item-body{flex:1;min-width:0}
.m-item-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-item-sub{font-size:12px;color:var(--textSub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-item-right{flex-shrink:0;text-align:right}
.m-item-value{font-size:13px;color:#f97316;font-weight:600;font-variant-numeric:tabular-nums}

/* BADGES */
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.04em;vertical-align:middle}

/* MARK BUTTON (tareas) */
.mark-btn{
  width:28px;height:28px;border-radius:50%;border:2px solid #333;
  background:transparent;color:#666;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.mark-btn.done{border-color:#22c55e;color:#22c55e;background:#052e16}

/* PRIO GROUP */
.m-prio-label{
  font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;
  padding:14px 16px 6px;display:flex;align-items:center;gap:6px
}

/* EMPTY */
.m-empty{padding:32px 16px;text-align:center;color:var(--textMuted);font-size:14px}

/* BOTTOM NAV */
.m-nav{
  display:flex;background:var(--bgCard);border-top:1px solid var(--border);
  padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0
}
.m-nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 2px;background:transparent;border:none;color:var(--textMuted);
  font-size:10px;gap:3px;cursor:pointer;
}
.m-nav-btn.active{color:var(--accent)}
.m-nav-icon{font-size:20px;line-height:1}

/* DETAIL PANEL (slide up) */
.m-detail{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.m-detail.open{opacity:1;pointer-events:all}
.m-detail-sheet{
  background:var(--bgCard);border-radius:16px 16px 0 0;
  max-height:85vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s ease;
  padding-bottom:max(16px,env(safe-area-inset-bottom))
}
.m-detail.open .m-detail-sheet{transform:translateY(0)}
.m-detail-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 16px 0;
}
.m-detail-title{font-size:18px;font-weight:700;flex:1}
.m-detail-close{background:transparent;border:none;color:var(--textMuted);font-size:20px;cursor:pointer;padding:0 0 0 12px}
.m-detail-body{padding:12px 16px}
.m-detail-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.m-detail-row:last-child{border-bottom:none}
.m-detail-label{color:var(--textMuted);flex-shrink:0;margin-right:12px}
.m-detail-value{text-align:right;flex:1;word-break:break-word}
.m-detail-actions{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.m-detail-btn{
  flex:1;min-width:80px;padding:9px 12px;border-radius:7px;font-size:13px;
  font-weight:600;cursor:pointer;border:1px solid #333;background:#161616;color:#ccc;
  text-align:center
}
.m-detail-btn.danger{border-color:#7f1d1d;color:#ef4444;background:#1a0a0a}
.m-detail-btn.primary{border-color:#f97316;color:#f97316;background:#1a0a00}

/* MODAL (add form) */
.m-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.m-modal-overlay.open{opacity:1;pointer-events:all}
.m-modal{
  background:var(--bgCard);border-radius:16px 16px 0 0;width:100%;
  max-height:90vh;overflow-y:auto;
  padding:20px 16px max(20px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s ease
}
.m-modal-overlay.open .m-modal{transform:translateY(0)}
.m-modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.m-field{margin-bottom:12px}
.m-field label{font-size:12px;color:var(--textMuted);display:block;margin-bottom:4px}
.m-field input,.m-field select,.m-field textarea{
  width:100%;background:#161616;border:1px solid #2a2a2a;color:var(--text);
  padding:10px 12px;border-radius:7px;font-size:14px;outline:none;
  -webkit-appearance:none;appearance:none
}
.m-field textarea{resize:vertical;min-height:70px}
.m-modal-actions{display:flex;gap:8px;margin-top:4px}
.m-btn-cancel{flex:1;padding:11px;border-radius:7px;border:1px solid #333;background:transparent;color:#888;font-size:14px;cursor:pointer}
.m-btn-save{flex:2;padding:11px;border-radius:7px;border:none;background:#f97316;color:#000;font-size:14px;font-weight:700;cursor:pointer}

/* TOAST */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1a1a1a;border:1px solid #333;color:#ccc;
  padding:9px 18px;border-radius:8px;font-size:13px;
  opacity:0;transition:all .2s;z-index:999;white-space:nowrap;pointer-events:none
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;background:#0a0a0a;z-index:999;
  display:none;align-items:center;justify-content:center
}
.m-login-box{
  background:#111;border:1px solid #222;border-radius:14px;
  padding:36px 24px;width:320px;text-align:center
}
.m-login-logo{font-size:32px;margin-bottom:8px}
.m-login-title{color:#f97316;font-weight:800;font-size:20px;margin-bottom:28px}
.m-login-input{
  width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;
  padding:12px 14px;border-radius:8px;font-size:15px;margin-bottom:10px;
  outline:none;-webkit-appearance:none
}
.m-login-err{color:#fca5a5;font-size:12px;min-height:18px;margin-bottom:10px}
.m-login-btn{
  width:100%;background:#f97316;color:#000;border:none;
  padding:13px;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer
}
</style>
<script>
function doLogin(){
  var email = document.getElementById('l-email');
  var pass  = document.getElementById('l-pass');
  var err   = document.getElementById('l-err');
  if(!email || !pass){ alert('Error: campos no encontrados'); return; }
  err.textContent = '';
  if(typeof firebase === 'undefined'){ err.textContent = 'Firebase no cargado'; return; }
  firebase.auth().signInWithEmailAndPassword(email.value.trim(), pass.value)
    .catch(function(e){ err.textContent = 'Email o contraseña incorrectos'; });
}
</script>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:flex">
  <div class="m-login-box">
    <div class="m-login-logo">🤖</div>
    <div class="m-login-title">CRM Robots</div>
    <input id="l-email" class="m-login-input" type="email" placeholder="Email" autocomplete="email">
    <input id="l-pass" class="m-login-input" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div id="l-err" class="m-login-err"></div>
    <button class="m-login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

function normalizeDate(d){
  if(!d||d==='')return '';
  const s=String(d).trim();
  // Already yyyy-MM-dd
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // Try parsing any date string
  const parsed=new Date(s);
  if(!isNaN(parsed.getTime())){
    const y=parsed.getFullYear();
    const mo=String(parsed.getMonth()+1).padStart(2,'0');
    const day=String(parsed.getDate()).padStart(2,'0');
    return y+'-'+mo+'-'+day;
  }
  return '';
}

async function loadAll(){
  setSyncStatus('⟳ Conectando...');
  document.getElementById('content').innerHTML='<div style="color:#888;padding:32px;font-size:13px">Conectando con Firebase...</div>';
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas','ventas'];
    setSyncStatus('⟳ Cargando datos...');
    const results=await Promise.all(ents.map(e=>db.collection(e).doc('data').get()));
    ents.forEach((e,i)=>{
      const doc=results[i];
      state[e]=doc.exists?(doc.data().items||[]):[];
      if(e==='proyectos')state[e]=state[e].map(p=>({
        ...p,
        valor:Number(p.valor)||0,
        demo:isDemo(p)?'true':'false',
        fechaDemo:p.fechaDemo?normalizeDate(p.fechaDemo):''
      }));
    });
    if(state.distribuidores.length===0&&state.proyectos.length===0){
      state=JSON.parse(JSON.stringify(SEED));
      await Promise.all(Object.keys(SEED).map(e=>
        db.collection(e).doc('data').set({items:state[e]})
      ));
      showToast('Primera carga — datos iniciales');
    }
    setSyncStatus('● Sync');render();
  }catch(err){
    setSyncStatus('✕ Error: '+err.message);
    document.getElementById('content').innerHTML='<div style="color:#ef4444;padding:32px;font-size:14px"><b>Error al cargar:</b> '+err.message+'<br><br><small style="color:#888">'+err.stack+'</small></div>';
  }
}
async function saveE(e){
  setSyncStatus('⟳');
  const data=state[e]||[];
  try{
    await db.collection(e).doc('data').set({items:data});
    setSyncStatus('● Sync');
    showToast('✓ Guardado ('+data.length+')');
  }catch(err){
    setSyncStatus('✕ Error');
    console.error('saveE failed:',e,err);
  }
}

      </div>`).join('')}

}

// ── Proyectos ──
function rProyectos(){
  const opts=['Activo','Pendiente','Inactivo','Ganado','Perdido'];
  const f=state.proyectos.filter(p=>{
    if(!matchEstados(p.estado))return false;
    if(filters.distIds&&filters.distIds.size>0){const pIds=getDistIds(p);if(![...filters.distIds].some(id=>pIds.includes(id)))return false;}
    if(filters.search){const s=filters.search.toLowerCase();if(!p.nombre?.toLowerCase().includes(s)&&!dNoms(p).toLowerCase().includes(s))return false;}
    return true;
  });
  const tot=f.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const estadoCount={};
  ['Activo','Pendiente','Inactivo','Ganado','Perdido'].forEach(e=>{estadoCount[e]=state.proyectos.filter(p=>p.estado===e).length;});
  const statsColors={'Activo':'#86efac','Pendiente':'#fbbf24','Inactivo':'#666','Ganado':'#86efac','Perdido':'#fca5a5'};
  const statsBg={'Activo':'#0a2010','Pendiente':'#1a1000','Inactivo':'#1a1a1a','Ganado':'#0a2010','Perdido':'#200808'};
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Proyectos <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${state.proyectos.length}</span></h1><div class="topbar-right">${tot>0?`<span style="font-size:11px;color:var(--textMuted);font-family:'DM Mono',monospace">${tot.toLocaleString('es-ES')}K€</span>`:''}<button class="btn-primary" id="btn-new">+ Nuevo</button></div></div>
  <div class="estado-stats" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    ${['Activo','Pendiente','Inactivo','Ganado','Perdido'].map(e=>`<div style="background:${statsBg[e]};border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer" onclick="filters.estados.size===1&&filters.estados.has('${e}')?filters.estados.clear():(() =>{filters.estados.clear();filters.estados.add('${e}');})();renderList()">
      <span style="font-size:16px;font-weight:700;font-family:'DM Mono',monospace;color:${statsColors[e]}">${estadoCount[e]}</span>
      <span style="font-size:10px;color:${statsColors[e]};opacity:.8">${e}</span>
    </div>`).join('')}
  </div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar proyecto o distribuidor..." value="${filters.search}">
${(()=>{
  const activeDistIds=filters.distIds||new Set();
  const label=activeDistIds.size>0?[...activeDistIds].map(id=>{const d=state.distribuidores.find(x=>x.id===id);return d?d.nombre:id;}).join(', ').slice(0,30):'Distribuidor';
  const hasActive=activeDistIds.size>0;
  return `<div class="ms-wrap" id="ms-dist-wrap">
    <div class="ms-trigger${hasActive?' has-active':''}" onclick="toggleMs('dist-wrap')">${label}</div>
    <div class="ms-dropdown" id="msd-dist-wrap" style="max-height:220px;overflow-y:auto">
      ${state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(d=>`<div class="ms-option${activeDistIds.has(d.id)?' selected':''}" onclick="toggleDistFilter('${d.id}')">
        <div class="ms-check">${activeDistIds.has(d.id)?'✓':''}</div>${d.nombre}
      </div>`).join('')}
      <div class="ms-clear" onclick="filters.distIds=new Set();renderList()">Limpiar filtro</div>
    </div>
  </div>`;
})()}
    ${msDropdown('proy-estado',opts,filters.estados,'Estado')}
  </div>
  <div class="list">${f.length?f.map(p=>{
    const sub=p.facilityId?getFacilityName(p.facilityId):dNoms(p);
    return`<div class="list-item${selectedItem?.id===p.id?' selected':''}" data-id="${p.id}" data-type="proyecto"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap"><span class="item-name">${p.nombre}</span>${bdg(p.estado)}${isDemo(p)?`<span style="font-size:10px;background:#042f2e;color:#2dd4bf;padding:2px 6px;border-radius:3px;font-weight:600">DEMO</span>`:''}</div><div class="item-sub">${sub}${p.modelo?' · '+p.modelo:''}</div></div><div style="display:flex;align-items:center;gap:6px">${p.valor>0?`<span class="item-value">${fv(p.valor)}</span>`:''}<button class="demo-btn${isDemo(p)?' active':''}" data-demo-toggle="${p.id}">${isDemo(p)?'🎯 Demo':'Demo'}</button></div></div>`;
  }).join(''):'<div class="empty">No hay proyectos</div>'}</div>`;
}

function rFacil(){

// ── Tareas ──
function rTareas(){
  const opts=['Pendiente','En curso','Hecha'];
  const f=state.tareas.filter(t=>{
    if(!matchEstados(t.estado||'Pendiente'))return false;
    if(filters.search&&!t.titulo?.toLowerCase().includes(filters.search.toLowerCase()))return false;
    if(filters.distId&&t.vinculoDistId!==filters.distId)return false;
    return true;
  });
  const _sinPrio=f.filter(t=>!t.prioridad||!['Alta','Media','Baja'].includes(t.prioridad));
  const gs=['Alta','Media','Baja'].map(p=>({p,items:f.filter(t=>t.prioridad===p)})).filter(g=>g.items.length);
  if(_sinPrio.length)gs.push({p:'Sin prioridad',items:_sinPrio});
  const tarPend=state.tareas.filter(t=>t.estado!=='Hecha').length;
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Tareas <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${tarPend} pend.</span></h1><button class="btn-primary" id="btn-new">+ Nueva tarea</button></div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar..." value="${filters.search}">
    ${msDropdown('tar-estado',opts,filters.estados,'Estado')}
  </div>
  ${gs.map(g=>`<div class="prio-group"><div class="prio-header">${bdg(g.p)} <span>(${g.items.length})</span></div><div class="list">
    ${g.items.map(t=>{
      const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
      const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
      const sub=[vp?vp.nombre:'',vd?vd.nombre:''].filter(Boolean).join(' · ');
      return`<div class="list-item${selectedItem?.id===t.id?' selected':''}" data-id="${t.id}" data-type="tarea"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;flex-wrap:wrap"><span class="item-name" style="${t.estado==='Hecha'?'text-decoration:line-through;color:var(--textMuted)':''}">${t.titulo}</span>${bdg(t.tipo||'')}${bdg(t.estado)}</div><div class="item-sub">${sub}${sub&&t.fecha?' · ':''}${t.fecha||''}</div></div><button class="mark-btn${t.estado==='Hecha'?' done':''}" data-toggle="${t.id}">${t.estado==='Hecha'?'✓ Hecha':'Marcar'}</button></div>`;
    }).join('')}
  </div></div>`).join('')}
  ${f.length===0?'<div class="empty">No hay tareas</div>':''}`;
}

// ── Detail panel ──
function openDetail(item,type){
  selectedItem=item;selectedType=type;
  document.getElementById('detail-panel').innerHTML=rDetail(item,type);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
  bindDL();
}
function closeDetail(){selectedItem=null;selectedType=null;document.getElementById('detail-panel').classList.remove('open');document.getElementById('main').classList.remove('panel-open');}

function rDetail(item,type){
  const rows=pairs=>pairs.filter(([,v])=>v).map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  let h=`<div class="detail-header"><div><div class="detail-type">${type}</div><div class="detail-title">${item.nombre||item.empresa||item.titulo||''}</div></div><button class="close-btn" id="btn-close-detail">×</button></div>`;
  if(type==='proyecto'){
    const _demo=isDemo(item);
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">${bdg(item.estado)}<button class="demo-btn${_demo?' active':''}" data-demo-toggle="${item.id}">${_demo?'🎯 Demo activa':'Demo'}</button></div>`;
    if(_demo&&item.fechaDemo)h+=`<div style="font-size:11px;color:#2dd4bf;margin-bottom:10px">📅 Demo: ${item.fechaDemo}</div>`;
    h+=rows([['Distribuidores',dNoms(item)],['Facility',item.facilityId?getFacilityName(item.facilityId):''],['Modelo',item.modelo],['Valor est.',fv(item.valor)],['Prox. contacto',item.fecha]]);
    if(item.notas){const nid='notes-'+Math.random().toString(36).slice(2);window['_n'+nid]=item.notas;h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" onclick="openNotesModal(window['_n${nid}'])" title="Expandir notas">⤢</button></div>`;}
    const tars=state.tareas.filter(t=>t.vinculoProjId===item.id);
    h+=`<div class="detail-section"><span>Tareas (${tars.length})</span><button class="btn-secondary btn-sm" id="btn-add-tarea-proj">+ Nueva tarea</button></div>`;
    if(tars.length){h+=tars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${t.titulo}</div><div class="mini-card-sub">${t.fecha||''}</div></div>${bdg(t.estado)}</div>`).join('');}
    else{h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin tareas vinculadas</div>`;}
  }
  if(type==='distribuidor'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Activo')}</div>`;
    h+=rows([['Provincia/Zona',item.provincia]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    const projs=state.proyectos.filter(p=>getDistIds(p).includes(item.id));
    if(projs.length){h+=`<div class="detail-section"><span>Proyectos (${projs.length})</span></div>`;h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');}
  }
  if(type==='lead'){
    h+=`<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap">${bdg(item.estado||'Nuevo')}${item.prioridad?bdg(item.prioridad):''}${item.tipo?bdg(item.tipo):''}</div>`;
    h+=rows([['Contacto',item.contacto],['Teléfono',item.tel],['Email',item.email],['Zona',item.zona],['Origen',item.origen],['Próx. contacto',item.fechaProxContacto],['Comercial',item.comercialId?(state.comerciales||[]).find(c=>c.id===item.comercialId)?.nombre||item.comercialId:''],['Distribuidor',item.distribuidorId?dNomById(item.distribuidorId):'']]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    const leadTars=state.tareas.filter(t=>t.vinculoLeadId===item.id);
    h+=`<div class="detail-section"><span>Tareas (${leadTars.length})</span><button class="btn-secondary btn-sm" id="btn-add-tarea-lead">+ Nueva</button></div>`;
    if(leadTars.length)h+=leadTars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div class="mini-card-name">${t.titulo}</div>${bdg(t.estado)}</div>`).join('');
    h+=`<div class="detail-section" style="margin-top:16px"><span>Convertir</span></div>`;
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn-secondary" onclick="convertLeadToDist('${item.id}')">→ Distribuidor</button>
      <button class="btn-primary" onclick="convertLeadToProyecto('${item.id}')">→ Proyecto</button>
    </div>`;
  }
  if(type==='facility'){
    h+=rows([['Zona/Provincia',item.zona]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    // Contactos
    const conts=state.contactos.filter(c=>c.facilityId===item.id);
    h+=`<div class="detail-section"><span>Contactos</span><button class="btn-secondary btn-sm" id="btn-add-contacto">+ Añadir</button></div>`;
    if(conts.length)h+=conts.map(c=>`<div class="mini-card clickable" data-contacto-id="${c.id}" title="Doble clic para editar"><div class="mini-card-name">${c.nombre}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}</div></div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin contactos</div>`;
    // Proyectos
    const projs=state.proyectos.filter(p=>p.facilityId===item.id);
    h+=`<div class="detail-section"><span>Proyectos</span><button class="btn-secondary btn-sm" id="btn-add-proyecto-facility">+ Añadir</button></div>`;
    if(projs.length)h+=projs.map(p=>`<div class="mini-card clickable" data-proj-id="${p.id}" style="display:flex;justify-content:space-between;align-items:center" title="Doble clic para editar"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}${p.valor>0?' · '+fv(p.valor):''}</div></div>${bdg(p.estado)}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin proyectos</div>`;
  }
  if(type==='tarea'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.tipo||'')}${bdg(item.prioridad)}${bdg(item.estado)}</div>`;
    const vp=state.proyectos.find(x=>x.id===item.vinculoProjId);
    const vd=state.distribuidores.find(x=>x.id===item.vinculoDistId);
    if(vp)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vp.nombre}</div><div class="mini-card-sub">Proyecto</div></div>`;
    if(vd)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vd.nombre}</div><div class="mini-card-sub">Distribuidor</div></div>`;
    h+=rows([['Fecha límite',item.fecha]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
  }
  h+=`<div class="detail-actions"><button class="btn-primary" id="btn-edit-detail">Editar</button><button class="btn-danger" id="btn-del-detail">Eliminar</button></div>`;
  return h;
}

function distSearchWidget(selected=[]){
  const sel=Array.isArray(selected)?selected:String(selected).split(',').map(s=>s.trim()).filter(Boolean);
  const opts=state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return`<div class="dist-search-wrap">
    <input class="dist-search-input" placeholder="Buscar distribuidor..." oninput="filterDistOpts(this.value)">
    <div class="dist-options" id="dist-opts-list">
      ${opts.map(d=>`<div class="dist-opt${sel.includes(d.id)?' checked':''}" data-dist-id="${d.id}" onclick="toggleDistOpt(this)"><div class="dc">${sel.includes(d.id)?'✓':''}</div>${d.nombre}</div>`).join('')}
    </div>
  </div>`;
}
function filterDistOpts(q){
  document.querySelectorAll('#dist-opts-list .dist-opt').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}
function toggleDistOpt(el){
  el.classList.toggle('checked');
  const dc=el.querySelector('.dc');
  dc.textContent=el.classList.contains('checked')?'✓':'';
}

function rModal(type,item,presets={}){
  const v={...presets,...(item||{})};
  const titles={lead:'Lead',proyecto:'Proyecto',distribuidor:'Distribuidor',facility:'Facility',tarea:'Tarea',contacto:'Contacto'};
  const title=(item?'Editar ':'Nuevo ')+titles[type];
  let fields='';

  if(type==='lead') fields=`<div class="form-grid">
    <div class="form-full form-group"><label class="form-label">Empresa <span>*</span></label><input class="form-input" name="empresa" value="${v.empresa||''}"></div>

// ── Bind listeners ──
function bindL(){
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';render();await saveE('tareas');}
    });
  });
  const bn=document.getElementById('btn-new');
  if(bn)bn.addEventListener('click',()=>{const tm={leads:'lead',proyectos:'proyecto',distribuidores:'distribuidor',facilities:'facility',tareas:'tarea'};openModal(tm[currentView]||'tarea');});
  const fs=document.getElementById('f-search');
  if(fs){
    fs.addEventListener('input',e=>{
      filters.search=e.target.value;
      renderList(); // only re-render the list, not the whole page
    });
    // prevent cursor loss on re-render
    fs.addEventListener('keydown',e=>e.stopPropagation());
  }
  const fd=document.getElementById('f-dist');
  if(fd)fd.addEventListener('change',e=>{filters.distId=e.target.value;renderList();});
  // Demo toggle buttons (in list and detail)
  document.querySelectorAll('[data-demo-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const p=state.proyectos.find(x=>x.id===btn.dataset.demoToggle);
      if(p){
        p.demo=isDemo(p)?'false':'true';
        render();
        if(selectedItem?.id===p.id){openDetail(p,'proyecto');render();}
        await saveE('proyectos');
      }
    });
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:'',distIds:new Set()};closeDetail();render();
    });
  });
}

function bindML(type){
  document.getElementById('btn-close-modal')?.addEventListener('click',closeModal);
  document.getElementById('btn-cancel-modal')?.addEventListener('click',closeModal);
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const data={};
    new FormData(form).forEach((v,k)=>data[k]=v);
    // multi distribuidor from search widget
    if(type==='proyecto'){
      const checked=[...form.querySelectorAll('.dist-opt.checked')].map(c=>c.dataset.distId);
      data.distribuidorIds=checked.join(',');
      data.valor=Number(data.valor)||0;
      // handle demo checkbox
      const chkDemo=form.querySelector('[name="demo"]');
      data.demo=chkDemo?String(chkDemo.checked):'false';
    }
    const km={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[type];if(!key)return;
    if(editingItem){
      Object.assign(editingItem,data);
      state[key]=state[key].map(x=>x.id===editingItem.id?editingItem:x);
      if(selectedItem?.id===editingItem.id)selectedItem=editingItem;
    } else {
      const px={lead:'L',proyecto:'P',distribuidor:'D',facility:'F',tarea:'T',contacto:'C'};
      data.id=genId(px[type]||'X');
      if(!data.fecha)data.fecha=today();
      state[key].push(data);
    }
    const facId=data.facilityId||editingItem?.facilityId;
    closeModal();
    if((type==='contacto'||type==='proyecto')&&facId){
      const fac=state.facilities.find(f=>f.id===facId);
      if(fac){openDetail(fac,'facility');}
    } else {
      closeDetail();
    }
    render();
    await saveE(key);
  });
}


// ── Calendario ──
function rCalendario(){
  const now=new Date();
  const y=window._calYear||now.getFullYear();
  const m=window._calMonth!==undefined?window._calMonth:now.getMonth();
  window._calYear=y;window._calMonth=m;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  // Monday-based offset
  let startOffset=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  // Build events map: key = 'YYYY-MM-DD'
  const events={};
  const addEvent=(dateStr,label,type)=>{
    if(!dateStr)return;
    const d=dateStr.slice(0,10);
    if(!events[d])events[d]=[];
    events[d].push({label,type});
  };
  state.proyectos.forEach(p=>{
    const _demoFlag=isDemo(p);
    if(_demoFlag&&p.fechaDemo)addEvent(p.fechaDemo,'🎯 '+p.nombre,'demo');
    if(p.fecha)addEvent(p.fecha,'◈ '+p.nombre,'proyecto');
  });
  state.tareas.forEach(t=>{const tf=normalizeDate(t.fecha);if(tf&&t.estado!=='Hecha')addEvent(tf,'✓ '+t.titulo,'tarea');});
  state.leads.forEach(l=>{if(l.fechaProxContacto)addEvent(l.fechaProxContacto,'◎ '+l.empresa,'lead');});

  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    const isCurrentMonth=dayNum>=1&&dayNum<=lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateStr=date.toISOString().slice(0,10);
    const isToday=dateStr===new Date().toISOString().slice(0,10);
    const dayEvents=events[dateStr]||[];
    cells+=`<div class="cal-day${!isCurrentMonth?' other-month':''}${isToday?' today':''}">
      <div class="cal-day-num">${isCurrentMonth?dayNum:''}</div>
      ${dayEvents.slice(0,3).map(e=>`<div class="cal-event ${e.type}" title="${e.label}">${e.label}</div>`).join('')}
      ${dayEvents.length>3?`<div style="font-size:9px;color:var(--textMuted)">+${dayEvents.length-3} más</div>`:''}
    </div>`;
  }

  return`<div class="topbar"><h1 style="text-transform:uppercase">Calendario</h1></div>
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="cal-title">${monthNames[m]} ${y}</span>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
    <span style="font-size:11px;color:#2dd4bf">🎯 Demo</span>
    <span style="font-size:11px;color:#93c5fd">◈ Proyecto (próx. contacto)</span>
    <span style="font-size:11px;color:#fbbf24">✓ Tarea</span>
    <span style="font-size:11px;color:#c4b5fd">◎ Lead</span>
  </div>`;
}

function changeMonth(dir){
  let m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  let y=window._calYear||new Date().getFullYear();
  m+=dir;
  if(m<0){m=11;y--;}
  if(m>11){m=0;y++;}
  window._calMonth=m;window._calYear=y;
  render();
}

// ── Mini calendar for dashboard ──
function rCalMini(){
  return buildCal(window._calYear||new Date().getFullYear(), window._calMonth!==undefined?window._calMonth:new Date().getMonth(), true);
}

function buildCal(y,m,mini=false){
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dows=['L','M','X','J','V','S','D'];
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startOffset=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  const events={};
  const addEvent=(dateStr,label,type)=>{
    if(!dateStr)return;
    const d=dateStr.slice(0,10);
    if(!events[d])events[d]=[];
    events[d].push({label,type});
  };
  state.proyectos.forEach(p=>{
    const _df=isDemo(p);
    if(_df&&p.fechaDemo)addEvent(normalizeDate(p.fechaDemo),'🎯 '+p.nombre,'demo');
    if(p.fecha)addEvent(normalizeDate(p.fecha),'◈ '+p.nombre,'proyecto');
  });
  state.tareas.forEach(t=>{if(t.fecha&&t.estado!=='Hecha')addEvent(t.fecha,'✓ '+t.titulo,'tarea');});
  state.leads.forEach(l=>{if(l.fechaProxContacto)addEvent(l.fechaProxContacto,'◎ '+(l.empresa||'Lead'),'lead');});

  const cellH = mini ? '70px' : '90px';
  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    const isCurrentMonth=dayNum>=1&&dayNum<=lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateStr=date.toISOString().slice(0,10);
    const isToday=dateStr===new Date().toISOString().slice(0,10);
    const dayEvents=events[dateStr]||[];
    const maxShow = mini ? 2 : 3;
    cells+=`<div style="height:${cellH};padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;background:${isToday?'var(--accentSoft)':'transparent'}">
      <div style="font-size:10px;color:${isCurrentMonth?(isToday?'var(--accent)':'var(--textSub)'):'var(--textMuted)'};${isToday?'font-weight:600':''}margin-bottom:2px">${isCurrentMonth?dayNum:''}</div>
      ${dayEvents.slice(0,maxShow).map(e=>`<div class="cal-event ${e.type}" title="${e.label}">${e.label}</div>`).join('')}
      ${dayEvents.length>maxShow?`<div style="font-size:9px;color:var(--textMuted)">+${dayEvents.length-maxShow}</div>`:''}
    </div>`;
  }

  const navId = mini ? 'mini' : 'modal';
  return`<div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1,'${navId}')">‹</button>
      <span class="cal-title">${monthNames[m]} ${y}</span>
      <div style="display:flex;gap:6px">

      ${dows.map(d=>`<div style="text-align:center;padding:6px 2px;font-size:10px;color:var(--textMuted);text-transform:uppercase;border-right:1px solid var(--border);border-bottom:1px solid var(--border)">${d}</div>`).join('')}

      <span style="font-size:10px;color:#fbbf24">✓ Tarea</span>
      <span style="font-size:10px;color:#c4b5fd">◎ Lead</span>
    </div>
  </div>`;
}

function goToday(ctx='mini'){
  window._calMonth=new Date().getMonth();
  window._calYear=new Date().getFullYear();
  if(ctx==='mini'){
    const el=document.getElementById('cal-mini');
    if(el)el.innerHTML=rCalMini();
  } else {
    const el=document.getElementById('cal-modal-content');
    if(el)el.innerHTML=buildCal(window._calYear,window._calMonth,false);
  }
}

function changeMonth(dir, ctx='mini'){
  let m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  let y=window._calYear||new Date().getFullYear();
  m+=dir; if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  window._calMonth=m; window._calYear=y;
  if(ctx==='mini'){
    const el=document.getElementById('cal-mini');
    if(el)el.innerHTML=rCalMini();
  } else {
    const el=document.getElementById('cal-modal-content');
    if(el)el.innerHTML=buildCal(y,m,false);
  }
}

function openCalModal(){
  const y=window._calYear||new Date().getFullYear();
  const m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='cal-modal-overlay';
  ov.innerHTML=`<div style="background:var(--bgCard);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;max-height:92vh;overflow:auto;padding:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-size:15px;font-weight:600">Calendario</span>
      <button class="close-btn" onclick="document.getElementById('cal-modal-overlay').remove()">×</button>
    </div>
    <div id="cal-modal-content">${buildCal(y,m,false)}</div>
  </div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

// ── TAREAS ──
function rTareas(){
  const all=state.tareas||[];
  const f=all.filter(t=>t.estado!=='Hecha');
  const groups=[['Alta',f.filter(t=>t.prioridad==='Alta')],['Media',f.filter(t=>t.prioridad==='Media')],['Baja',f.filter(t=>t.prioridad==='Baja')],['—',f.filter(t=>!t.prioridad)]];
  const pendCount=f.length;

  let html=`<div class="m-section-header">
    <div><span class="m-section-title">Tareas</span><span class="m-section-count">${pendCount} pend.</span></div>
    <button class="m-add-btn" onclick="openAddModal('tarea')">+ Tarea</button>
  </div>`;

  const hasItems=groups.some(([,items])=>items.length>0);
  if(!hasItems){ html+='<div class="m-empty">Sin tareas pendientes 🎉</div>'; return html; }

  groups.forEach(([prio,items])=>{
    if(!items.length)return;
    html+=`<div class="m-prio-label">${bdg(prio)} (${items.length})</div><div class="m-list">`;
    items.forEach(t=>{
      const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
      const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
      const vinculo=vp?vp.nombre:(vd?vd.nombre:'');
      html+=`<div class="m-item" data-id="${t.id}" data-type="tarea">
        <div class="m-item-body">
          <div class="m-item-title">${t.titulo}</div>
          ${vinculo?`<div class="m-item-sub">${vinculo}</div>`:''}
        </div>
        <button class="mark-btn" data-toggle="${t.id}" onclick="event.stopPropagation()">○</button>
      </div>`;
    });
    html+='</div>';
  });

  // Also show done tasks collapsed
  const done=all.filter(t=>t.estado==='Hecha');
  if(done.length){
    html+=`<div class="m-prio-label" style="color:#444">${bdg('Hecha')} (${done.length})</div><div class="m-list">`;
    done.forEach(t=>{
      const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
      const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
      const vinculo=vp?vp.nombre:(vd?vd.nombre:'');
      html+=`<div class="m-item" data-id="${t.id}" data-type="tarea" style="opacity:.4">
        <div class="m-item-body">
          <div class="m-item-title" style="text-decoration:line-through">${t.titulo}</div>
          ${vinculo?`<div class="m-item-sub">${vinculo}</div>`:''}
        </div>
        <button class="mark-btn done" data-toggle="${t.id}" onclick="event.stopPropagation()">✓</button>
      </div>`;
    });
    html+='</div>';
  }
  return html;
}

// ── PROYECTOS ──
function rProyectos(){
  let f=state.proyectos||[];
  if(filters.search) f=f.filter(p=>(p.nombre+p.notas).toLowerCase().includes(filters.search.toLowerCase()));
  const tot=f.reduce((a,p)=>a+(Number(p.valor)||0),0);

  let html=`<div class="m-section-header">
    <div><span class="m-section-title">Proyectos</span><span class="m-section-count">${f.length}</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      ${tot>0?`<span style="font-size:11px;color:#f97316;font-family:monospace">${tot}K€</span>`:''}

    </div>
  </div>
  <input class="m-search" type="search" placeholder="Buscar..." value="${filters.search||''}" oninput="filters.search=this.value;render()">`;

  // Estado filter pills
  const estados=['Activo','Pendiente','Ganado','Perdido','Inactivo'];
  html+=`<div class="m-filter-bar">
    <div class="m-pill${!filters.estados.size?' active':''}" onclick="filters.estados.clear();render()">Todos</div>
    ${estados.map(e=>`<div class="m-pill${filters.estados.has(e)?' active':''}" onclick="toggleFilter('${e}');render()">${e}</div>`).join('')}
  </div>`;

  let display=f;
  if(filters.estados.size) display=f.filter(p=>filters.estados.has(p.estado));

  if(!display.length){ html+='<div class="m-empty">Sin proyectos</div>'; return html; }
  html+='<div class="m-list">';
  display.forEach(p=>{
    const demo=isDemo(p);
    html+=`<div class="m-item" data-id="${p.id}" data-type="proyecto">
      <div class="m-item-body">
        <div class="m-item-title">${p.nombre}${demo?' <span class="badge" style="background:#042f2e;color:#2dd4bf">DEMO</span>':''}</div>

        ${p.valor>0?`<div class="m-item-value">${fv(p.valor)}</div>`:''}

      <button class="m-btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-btn-save" onclick="saveProyecto()">Guardar</button>
    </div>`;
  } else if(type==='distribuidor'){
    html=`<div class="m-modal-title">Nuevo distribuidor</div>
    <div class="m-field"><label>Nombre *</label><input id="f-nombre" placeholder="Nombre"></div>
    <div class="m-field"><label>Provincia</label><input id="f-prov" placeholder="Provincia / Zona"></div>
    <div class="m-field"><label>Estado</label>
      <select id="f-estado"><option>Activo</option><option>Negociando</option><option>Inactivo</option></select></div>
    <div class="m-field"><label>Notas</label><textarea id="f-notas" rows="2"></textarea></div>
    <div class="m-modal-actions">
      <button class="m-btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-btn-save" onclick="saveDistribuidor()">Guardar</button>
    </div>`;
  } else if(type==='facility'){
    html=`<div class="m-modal-title">Nueva facility</div>
    <div class="m-field"><label>Nombre *</label><input id="f-nombre" placeholder="Nombre"></div>
    <div class="m-field"><label>Zona</label><input id="f-zona" placeholder="Zona / Ciudad"></div>
    <div class="m-field"><label>Notas</label><textarea id="f-notas" rows="2"></textarea></div>
    <div class="m-modal-actions">
      <button class="m-btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-btn-save" onclick="saveFacility()">Guardar</button>
    </div>`;
  }

  modal.innerHTML=html;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>modal.querySelector('input')?.focus(), 300);
}

function closeModal(e){
  if(e && e.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}

// ── BACKUP ──
function getDriveToken(){
  return new Promise((resolve,reject)=>{
    if(driveToken){resolve(driveToken);return;}
    const client=google.accounts.oauth2.initTokenClient({
      client_id:DRIVE_CLIENT_ID,
      scope:DRIVE_SCOPE,
      callback:(resp)=>{
        if(resp.error){reject(new Error(resp.error));return;}
        driveToken=resp.access_token;
        resolve(driveToken);
      }
    });
    client.requestAccessToken();
  });
}

async function doBackup(){
  const btn=document.querySelector('button[onclick="doBackup()"]');
  if(btn){btn.textContent='⏳ Guardando...';btn.disabled=true;}
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas','ventas'];
    const backup={};
    ents.forEach(e=>{backup[e]=state[e]||[];});
    backup._fecha=new Date().toISOString();
    const jsonStr=JSON.stringify(backup,null,2);
    const token=await getDriveToken();
    const fecha=new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    const filename='CRM_Firebase_backup_'+fecha+'.json';
    const metadata={name:filename,mimeType:'application/json',parents:[BACKUP_FOLDER_ID]};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
    form.append('file',new Blob([jsonStr],{type:'application/json'}));
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{Authorization:'Bearer '+token},
      body:form
    });
    if(!res.ok)throw new Error('Drive error: '+res.status);
    showToast('✅ Backup guardado en Drive');
  }catch(e){
    driveToken=null;
    showToast('❌ Error: '+e.message);
  }finally{
    if(btn){btn.textContent='💾 Backup Drive';btn.disabled=false;}
  }
}
