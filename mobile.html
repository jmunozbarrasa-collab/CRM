<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Muzybar CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#0a0a0a;--bgCard:#111;--bgSurface:#161616;--border:#222;--text:#f0f0f0;--textMuted:#666;--accent:#b5c832;--accentSoft:rgba(181,200,50,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;overflow:hidden}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;gap:14px}
.l-logo{font-family:Barlow,sans-serif;font-size:32px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.l-input{width:100%;padding:14px 16px;background:var(--bgCard);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:Outfit,sans-serif;font-size:15px;outline:none}
.l-input:focus{border-color:var(--accent)}
.l-btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:10px;color:#1a1a00;font-family:Barlow,sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
#l-err{font-size:12px;color:#ef4444;text-align:center;min-height:16px}

/* APP SHELL */
#app{display:none;flex-direction:column;height:100%;max-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.logo-btn{font-family:Barlow,sans-serif;font-size:17px;font-weight:800;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;letter-spacing:.02em;flex-shrink:0}
.topbar-title{font-family:Barlow,sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;flex:1}
.topbar-right{font-size:11px;color:var(--textMuted)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 72px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bgCard);border-top:1px solid var(--border);display:flex;z-index:100;height:56px;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--textMuted);font-size:9px;font-family:Outfit,sans-serif;border:none;background:transparent;cursor:pointer;padding:6px 4px}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* CARDS */
.card{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.card-title{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:13px}
.kpi-lbl{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kpi-val{font-size:25px;font-weight:800;font-family:Barlow,sans-serif;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--textMuted);margin-top:3px}

/* SEARCH & FILTERS */
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:11px 14px 11px 34px;background:var(--bgSurface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:Outfit,sans-serif;font-size:14px;outline:none}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--textMuted);pointer-events:none;font-size:14px}
.filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--textMuted);font-size:12px;font-family:Outfit,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fbtn.active{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}

/* LIST ITEMS */
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.item-name{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:11px;color:var(--textMuted);margin-top:2px}

/* TASK */
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;-webkit-appearance:none}
.task-check.done{background:var(--accent);border-color:var(--accent);color:#1a1a00}
.prio-alta{font-size:10px;padding:1px 6px;border-radius:20px;background:rgba(239,68,68,.12);color:#f87171}
.prio-baja{font-size:10px;padding:1px 6px;border-radius:20px;background:rgba(100,100,100,.12);color:#888}

/* BADGES */
.bdg{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}

/* DETAIL OVERLAY */
#detail-overlay{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;background:var(--bg)}
#detail-overlay.open{display:flex}
.detail-topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{background:transparent;border:none;color:var(--textMuted);font-size:24px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.detail-title-txt{font-family:Barlow,sans-serif;font-size:17px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.dl{margin-bottom:14px}
.dl-lbl{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.dl-val{font-size:14px;color:var(--text);word-break:break-word}

/* TAREA MODAL */
#tarea-modal{display:none;position:fixed;inset:0;z-index:300;flex-direction:column;background:var(--bg)}
#tarea-modal.open{display:flex}
.modal-topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-family:Barlow,sans-serif;font-size:17px;font-weight:700;flex:1}
#tarea-form{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-lbl{font-size:11px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em}
.form-input{background:var(--bgSurface);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-family:Outfit,sans-serif;font-size:14px;outline:none;width:100%}
.form-input:focus{border-color:var(--accent)}
.form-select{background:var(--bgSurface);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-family:Outfit,sans-serif;font-size:14px;outline:none;width:100%;-webkit-appearance:none}
.modal-actions{padding:14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.btn-primary{flex:1;padding:14px;background:var(--accent);border:none;border-radius:10px;color:#1a1a00;font-family:Barlow,sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.btn-ghost{padding:14px 16px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--textMuted);font-family:Outfit,sans-serif;font-size:14px;cursor:pointer}

.empty{text-align:center;padding:40px;color:var(--textMuted);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="l-logo">MUZYBAR</div>
  <p style="color:var(--textMuted);font-size:13px;margin-bottom:8px">CRM Robotics</p>
  <input class="l-input" id="l-email" type="email" placeholder="Email" autocomplete="email">
  <input class="l-input" id="l-pass" type="password" placeholder="Contraseña">
  <button class="l-btn" onclick="doLogin()">Entrar</button>
  <div id="l-err"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <button class="logo-btn" onclick="setView('dash')">MUZYBAR</button>
    <div class="topbar-title" id="topbar-title">Tareas</div>
    <div class="topbar-right" id="topbar-user"></div>
  </div>
  <div id="content"><div class="empty">Cargando...</div></div>
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-tareas" onclick="setView('tareas')">
      <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Tareas
    </button>
    <button class="nav-btn" id="nav-proyectos" onclick="setView('proyectos')">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Proyectos
    </button>
    <button class="nav-btn" id="nav-facilities" onclick="setView('facilities')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Facilities
    </button>
    <button class="nav-btn" id="nav-distribuidores" onclick="setView('distribuidores')">
      <svg viewBox="0 0 24 24"><circle cx="17" cy="5" r="3"/><circle cx="7" cy="12" r="3"/><circle cx="17" cy="19" r="3"/><line x1="14.24" y1="6.9" x2="9.76" y2="10.1"/><line x1="14.24" y1="17.1" x2="9.76" y2="13.9"/></svg>
      Dist.
    </button>
  </nav>
</div>

<!-- DETAIL OVERLAY -->
<div id="detail-overlay">
  <div class="detail-topbar">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="detail-title-txt" id="detail-title"></div>
  </div>
  <div id="detail-body"></div>
</div>

<!-- TAREA MODAL -->
<div id="tarea-modal">
  <div class="modal-topbar">
    <button class="back-btn" onclick="closeTareaModal()">←</button>
    <div class="modal-title" id="tarea-modal-title">Nueva tarea</div>
  </div>
  <div id="tarea-form">
    <div class="form-group">
      <label class="form-lbl">Título</label>
      <input class="form-input" id="tf-titulo" placeholder="Descripción de la tarea">
    </div>
    <div class="form-group">
      <label class="form-lbl">Columna</label>
      <select class="form-select" id="tf-columna">
        <option value="deberes">Deberes</option>
        <option value="ventas">Ventas</option>
        <option value="proyectos">Proyectos</option>
        <option value="seguimiento">Seguimiento</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-lbl">Prioridad</label>
      <select class="form-select" id="tf-prioridad">
        <option value="Alta">Alta</option>
        <option value="Baja">Baja</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-lbl">Fecha</label>
      <input class="form-input" id="tf-fecha" type="date">
    </div>
    <div class="form-group">
      <label class="form-lbl">Notas</label>
      <textarea class="form-input" id="tf-notas" rows="3" style="resize:none"></textarea>
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeTareaModal()">Cancelar</button>
    <button class="btn-primary" onclick="saveTareaModal()">Guardar</button>
  </div>
</div>

<script>
// ── Firebase ──
const firebaseConfig={apiKey:"AIzaSyBEPM13AhI_XbeXtOWPlqTzoGHPRB1B_3U",authDomain:"crm-robots.firebaseapp.com",projectId:"crm-robots",storageBucket:"crm-robots.firebasestorage.app",messagingSenderId:"666099253234",appId:"1:666099253234:web:9a68ec577115961b86356b"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

// ── Constants ──
var EXCEL_2026=[{dist:'INTEC ROBOTS',TOTAL:19,CC1:4,SH1:8,T300:2,'Bella Pro':1,'Pudu 2':4},{dist:'INFORPOR',TOTAL:18,CC1:6,SH1:5,MT1:3,Bella:2,'Bella Pro Negro':2},{dist:'ELYPHARMA',TOTAL:12,CC1:5,SH1:4,MT1:1,'MT1 Vac':1,'Pudu 2':1},{dist:'MUÑOZ BOSCH',TOTAL:7,CC1:2,SH1:3,'MT1 Vac':1,'Bella Pro Negro':1},{dist:'SILIONS',TOTAL:5,'CC1 Negro':1,SH1:2,MT1:2},{dist:'PROCESAP',TOTAL:5,CC1:1,SH1:3,'Bella Pro Negro':1},{dist:'LUEID ROBOTICS',TOTAL:4,SH1:2,'Bella Pro':2},{dist:'NOVA HA',TOTAL:4,SH1:4},{dist:'LBOT',TOTAL:3,CC1:1,SH1:1,'MT1 Max':1},{dist:'INFORANTUNES',TOTAL:3,Bella:2,Ketty:1},{dist:'DANADRA',TOTAL:2,MT1:1,Bella:1},{dist:'7DISTRIBUCIONS',TOTAL:2,SH1:1,Bella:1},{dist:'EROBOTS',TOTAL:1,Bella:1},{dist:'RC SYSTEMS',TOTAL:1,SH1:1},{dist:'ATROX SOLUTIONS',TOTAL:1,CC1:1},{dist:'ROBOTS NATION',TOTAL:1,'MT1 Vac':1},{dist:'CASHKEEPER',TOTAL:1,SH1:1}];
var OBJ_IMPORTE_MIN=1500000;
var BDG_MAP={Activo:['rgba(134,239,172,.1)','#86efac'],Negociando:['rgba(147,197,253,.1)','#93c5fd'],'Se Raja':['rgba(252,165,165,.1)','#fca5a5'],Inactivo:['rgba(100,100,100,.1)','#666'],Frío:['rgba(100,100,100,.1)','#888'],Activa:['rgba(134,239,172,.1)','#86efac'],Ganado:['rgba(45,212,191,.1)','#2dd4bf'],Perdido:['rgba(248,113,113,.1)','#f87171'],Pendiente:['rgba(250,204,21,.1)','#facc15'],Alta:['rgba(239,68,68,.12)','#f87171'],Baja:['rgba(100,100,100,.1)','#888']};

// ── State ──
var state={tareas:[],pedidos:[],ventas:{},proyectos:[],facilities:[],distribuidores:[],contactos:[]};
var currentView='tareas';
var searches={tareas:'',proyectos:'',facilities:'',distribuidores:''};
var tareaFilter='pendientes';
var proyectoFilter='todos';
var editingTareaId=null;

// ── Helpers ──
function bdg(l){if(!l)return'';var m=BDG_MAP[l]||['rgba(100,100,100,.1)','#888'];return '<span class="bdg" style="background:'+m[0]+';color:'+m[1]+'">'+l+'</span>';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function genId(p){return p+(Date.now().toString(36)+Math.random().toString(36).slice(2,6)).toUpperCase();}

// ── Auth ──
function doLogin(){
  var err=document.getElementById('l-err'); err.textContent='';
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;
  if(!email||!pass){err.textContent='Completa los campos';return;}
  auth.signInWithEmailAndPassword(email,pass).catch(function(){err.textContent='Credenciales incorrectas';});
}
document.getElementById('l-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('topbar-user').textContent=user.email.split('@')[0];
    loadAll();
  } else {
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

// ── Load (same structure as desktop) ──
async function loadAll(){
  try{
    var ents=['tareas','pedidos','ventas','proyectos','facilities','distribuidores','contactos'];
    var results=await Promise.all(ents.map(function(e){return db.collection(e).doc('data').get();}));
    ents.forEach(function(e,i){
      var doc=results[i];
      if(e==='ventas') state.ventas=doc.exists?(doc.data()||{}):{};
      else state[e]=doc.exists?(doc.data().items||[]):[];
    });
    if(state.ventas&&state.ventas.importeOverride2026) window._imp26=state.ventas.importeOverride2026*1000;
    render();
  } catch(err){
    document.getElementById('content').innerHTML='<div style="color:#ef4444;padding:24px;font-size:13px">Error: '+esc(err.message)+'</div>';
  }
}

async function _saveTareas(){ await db.collection('tareas').doc('data').set({items:state.tareas}); }

// ── Navigation ──
function setView(v){
  currentView=v;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var nb=document.getElementById('nav-'+v);
  if(nb) nb.classList.add('active');
  var titles={dash:'Dashboard',tareas:'Tareas',proyectos:'Proyectos',facilities:'Facilities',distribuidores:'Distribuidores'};
  document.getElementById('topbar-title').textContent=titles[v]||v;
  render();
}
function render(){
  var c=document.getElementById('content');
  if(currentView==='dash') c.innerHTML=rDash();
  else if(currentView==='tareas') c.innerHTML=rTareas();
  else if(currentView==='proyectos') c.innerHTML=rProyectos();
  else if(currentView==='facilities') c.innerHTML=rFacilities();
  else if(currentView==='distribuidores') c.innerHTML=rDistribuidores();
}

// ── DASHBOARD ──
function rDash(){
  var pend=(state.tareas||[]).filter(function(t){return t.estado!=='Hecha';}).length;
  var alta=(state.tareas||[]).filter(function(t){return t.prioridad==='Alta'&&t.estado!=='Hecha';}).length;
  var stk=(state.ventas&&state.ventas.stock)||{};
  var totalStock=Object.values(stk).reduce(function(s,v){return s+(Number(v)||0);},0);
  var pedidosEC=(state.pedidos||[]).filter(function(p){return p.estado==='En tránsito';});
  var totalEC=pedidosEC.reduce(function(s,p){return s+(p.items||[]).filter(function(i){return i.tipo!=='pieza';}).reduce(function(ss,i){return ss+(parseInt(i.uds)||0);},0);},0);
  var robots26=EXCEL_2026.reduce(function(s,d){return s+d.TOTAL;},0);
  var imp26=window._imp26||(state.ventas&&state.ventas.importes&&state.ventas.importes.ventas)||437000;
  var pctImp=Math.round(imp26/OBJ_IMPORTE_MIN*100);
  var hotProj=(state.proyectos||[]).filter(function(p){return p.hot&&p.estado!=='Ganado'&&p.estado!=='Perdido';}).length;
  var urgentes=(state.tareas||[]).filter(function(t){return t.prioridad==='Alta'&&t.estado!=='Hecha';}).slice(0,4);

  var h='<div class="kpi-grid">'
    +'<div class="kpi" onclick="setView(\'tareas\')" style="cursor:pointer"><div class="kpi-lbl">Tareas pend.</div><div class="kpi-val">'+pend+'</div><div class="kpi-sub" style="color:'+(alta?'#f87171':'var(--textMuted)')+'">'+alta+' urgentes</div></div>'
    +'<div class="kpi" onclick="setView(\'proyectos\')" style="cursor:pointer"><div class="kpi-lbl">Proyectos 🔥</div><div class="kpi-val" style="color:#ef4444">'+hotProj+'</div><div class="kpi-sub">HOT activos</div></div>'
    +'<div class="kpi"><div class="kpi-lbl">Stock robots</div><div class="kpi-val">'+totalStock+'</div><div class="kpi-sub" style="color:#60a5fa">'+(totalEC?'+'+totalEC+' camino':'—')+'</div></div>'
    +'<div class="kpi"><div class="kpi-lbl">Importe 2026</div><div class="kpi-val" style="font-size:20px">'+Math.round(imp26/1000)+'K€</div><div class="kpi-sub">'+pctImp+'% obj.</div></div>'
    +'</div>';

  h+='<div class="card"><div class="card-title">Objetivo importe 2026</div>'
    +'<div style="height:8px;background:var(--bgSurface);border-radius:4px;overflow:hidden;margin-bottom:5px">'
    +'<div style="height:100%;width:'+Math.min(pctImp,100)+'%;background:var(--accent);border-radius:4px"></div></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--textMuted)">'
    +'<span style="color:var(--accent);font-weight:600">'+pctImp+'% — '+Math.round(imp26/1000)+'K€</span><span>Obj. mín. 1.500K€</span></div></div>';

  if(urgentes.length){
    h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="card-title" style="margin:0">Urgentes</div><button onclick="openTareaModal(null)" style="font-size:11px;padding:4px 10px;border:1px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);cursor:pointer">+ Nueva</button></div>';
    urgentes.forEach(function(t){
      h+='<div class="list-item">'
        +'<button class="task-check" onclick="toggleTarea(\''+t.id+'\')"></button>'
        +'<div style="flex:1;min-width:0"><div class="item-name">'+esc(t.titulo)+'</div>'
        +'<div class="item-sub">'+esc(t.columna||'')+(t.fecha?' · '+t.fecha:'')+'</div></div></div>';
    });
    h+='</div>';
  }
  return h;
}

// ── TAREAS ──
function rTareas(){
  var COLS=['deberes','ventas','proyectos','seguimiento'];
  var tareas=state.tareas||[];
  var q=(searches.tareas||'').toLowerCase();
  var pend=tareas.filter(function(t){return t.estado!=='Hecha';}).length;

  var filtered=tareas.filter(function(t){
    if(q&&!(t.titulo||'').toLowerCase().includes(q)) return false;
    if(tareaFilter==='pendientes') return t.estado!=='Hecha';
    if(tareaFilter==='alta') return t.prioridad==='Alta'&&t.estado!=='Hecha';
    if(tareaFilter==='hechas') return t.estado==='Hecha';
    return true;
  });

  var h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +'<span style="font-size:11px;color:var(--textMuted)">'+pend+' sin cerrar</span>'
    +'<button onclick="openTareaModal(null)" style="font-size:12px;padding:6px 14px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer;font-family:Outfit,sans-serif">+ Nueva tarea</button>'
    +'</div>'
    +'<div class="search-wrap"><span class="search-icon">⌕</span>'
    +'<input class="search-input" placeholder="Buscar..." value="'+esc(searches.tareas||'')+'" oninput="searches.tareas=this.value;render()"></div>'
    +'<div class="filters">'
    +'<button class="fbtn'+(tareaFilter==='pendientes'?' active':'')+'" onclick="tareaFilter=\'pendientes\';render()">Pendientes</button>'
    +'<button class="fbtn'+(tareaFilter==='alta'?' active':'')+'" onclick="tareaFilter=\'alta\';render()">Urgentes</button>'
    +'<button class="fbtn'+(tareaFilter==='todas'?' active':'')+'" onclick="tareaFilter=\'todas\';render()">Todas</button>'
    +'<button class="fbtn'+(tareaFilter==='hechas'?' active':'')+'" onclick="tareaFilter=\'hechas\';render()">Hechas</button>'
    +'</div>';

  if(!filtered.length) return h+'<div class="empty">No hay tareas</div>';

  var grouped={};
  COLS.forEach(function(c){grouped[c]=[];});
  filtered.forEach(function(t){
    var col=(t.columna||'proyectos').toLowerCase();
    if(!grouped[col]) grouped[col]=[];
    grouped[col].push(t);
  });

  COLS.forEach(function(col){
    var items=grouped[col]||[];
    if(!items.length) return;
    items.sort(function(a,b){return (a.prioridad==='Alta'?0:1)-(b.prioridad==='Alta'?0:1);});
    h+='<div style="font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px">'+col+' ('+items.length+')</div>'
      +'<div class="card" style="padding:0 14px">';
    items.forEach(function(t){
      var done=t.estado==='Hecha';
      h+='<div class="list-item">'
        +'<button class="task-check'+(done?' done':'')+'" onclick="toggleTarea(\''+t.id+'\')">'+(done?'✓':'')+'</button>'
        +'<div style="flex:1;min-width:0;cursor:pointer" onclick="openTareaModal(\''+t.id+'\')"><div class="item-name" style="'+(done?'text-decoration:line-through;color:var(--textMuted)':'')+'">'+esc(t.titulo)+'</div>'
        +'<div style="display:flex;align-items:center;gap:5px;margin-top:2px">'
        +(t.prioridad==='Alta'?'<span class="prio-alta">Alta</span>':'<span class="prio-baja">Baja</span>')
        +(t.fecha?'<span style="font-size:10px;color:var(--textMuted)">'+t.fecha+'</span>':'')
        +'</div></div>'
        +'<button onclick="openTareaModal(\''+t.id+'\')" style="background:transparent;border:none;color:var(--textMuted);font-size:18px;cursor:pointer;padding:4px">›</button>'
        +'</div>';
    });
    h+='</div>';
  });
  return h;
}

async function toggleTarea(id){
  var t=(state.tareas||[]).find(function(x){return x.id===id;});
  if(!t) return;
  t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';
  render();
  await _saveTareas();
}

// ── TAREA MODAL ──
function openTareaModal(id){
  editingTareaId=id;
  var t=id?(state.tareas||[]).find(function(x){return x.id===id;}):null;
  document.getElementById('tarea-modal-title').textContent=t?'Editar tarea':'Nueva tarea';
  document.getElementById('tf-titulo').value=t?esc(t.titulo||''):'';
  document.getElementById('tf-columna').value=t?(t.columna||'deberes'):'deberes';
  document.getElementById('tf-prioridad').value=t?(t.prioridad||'Baja'):'Baja';
  document.getElementById('tf-fecha').value=t?(t.fecha||''):'';
  document.getElementById('tf-notas').value=t?(t.notas||t.descripcion||''):'';
  document.getElementById('tarea-modal').classList.add('open');
}
function closeTareaModal(){
  document.getElementById('tarea-modal').classList.remove('open');
  editingTareaId=null;
}
async function saveTareaModal(){
  var titulo=document.getElementById('tf-titulo').value.trim();
  if(!titulo) return;
  if(editingTareaId){
    var t=(state.tareas||[]).find(function(x){return x.id===editingTareaId;});
    if(t){
      t.titulo=titulo;
      t.columna=document.getElementById('tf-columna').value;
      t.prioridad=document.getElementById('tf-prioridad').value;
      t.fecha=document.getElementById('tf-fecha').value;
      t.notas=document.getElementById('tf-notas').value;
    }
  } else {
    state.tareas.push({
      id:genId('T'),titulo:titulo,
      columna:document.getElementById('tf-columna').value,
      prioridad:document.getElementById('tf-prioridad').value,
      fecha:document.getElementById('tf-fecha').value,
      notas:document.getElementById('tf-notas').value,
      estado:'Pendiente'
    });
  }
  closeTareaModal();
  render();
  await _saveTareas();
}

// ── PROYECTOS ──
function rProyectos(){
  var projs=state.proyectos||[];
  var q=(searches.proyectos||'').toLowerCase();
  var ESTADOS=['Frío','Activo','Pendiente','Ganado','Perdido'];
  var ECOLS={Frío:'#60a5fa',Activo:'#86efac',Pendiente:'#facc15',Ganado:'#2dd4bf',Perdido:'#f87171'};

  var stats=[
    {k:'todos',   l:'Todos',    v:projs.length},
    {k:'hot',     l:'🔥 HOT',   v:projs.filter(function(p){return p.hot&&p.estado!=='Ganado'&&p.estado!=='Perdido';}).length},
    {k:'Activo',  l:'Activos',  v:projs.filter(function(p){return p.estado==='Activo';}).length},
    {k:'Pendiente',l:'Pend.',   v:projs.filter(function(p){return p.estado==='Pendiente';}).length},
    {k:'Ganado',  l:'Ganados',  v:projs.filter(function(p){return p.estado==='Ganado';}).length},
  ];

  var filtered=projs.filter(function(p){
    if(q&&!(p.nombre||'').toLowerCase().includes(q)) return false;
    if(proyectoFilter==='hot') return p.hot&&p.estado!=='Ganado'&&p.estado!=='Perdido';
    if(proyectoFilter!=='todos') return p.estado===proyectoFilter;
    return true;
  });

  filtered.sort(function(a,b){return (b.hot?1:0)-(a.hot?1:0);});

  var h='<div class="search-wrap"><span class="search-icon">⌕</span>'
    +'<input class="search-input" placeholder="Buscar proyecto..." value="'+esc(searches.proyectos||'')+'" oninput="searches.proyectos=this.value;render()"></div>'
    +'<div class="filters">';
  stats.forEach(function(s){
    h+='<button class="fbtn'+(proyectoFilter===s.k?' active':'')+'" onclick="proyectoFilter=\''+s.k+'\';render()">'+s.l+' ('+s.v+')</button>';
  });
  h+='</div>';

  if(!filtered.length) return h+'<div class="empty">No hay proyectos</div>';

  // Group by estado
  var grouped={};
  ESTADOS.forEach(function(e){grouped[e]=[];});
  filtered.forEach(function(p){if(!grouped[p.estado]) grouped[p.estado]=[];grouped[p.estado].push(p);});

  ESTADOS.forEach(function(estado){
    var items=grouped[estado]||[];
    if(!items.length) return;
    var col=ECOLS[estado]||'#888';
    h+='<div style="font-size:10px;color:'+col+';text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;display:flex;align-items:center;gap:5px">'
      +'<span style="width:6px;height:6px;border-radius:50%;background:'+col+';display:inline-block"></span>'+estado+' ('+items.length+')</div>'
      +'<div class="card" style="padding:0 14px">';
    items.forEach(function(p){
      var dists=(state.distribuidores||[]).filter(function(d){return p.distribuidorIds&&p.distribuidorIds.indexOf(d.id)>=0;}).map(function(d){return d.nombre;}).join(', ');
      var fac=(state.facilities||[]).find(function(f){return f.id===p.facilityId;});
      h+='<div class="list-item" onclick="openDetail(\'proyecto\',\''+p.id+'\')"><div style="flex:1;min-width:0">'
        +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'
        +(p.hot?'<span style="font-size:11px">🔥</span>':'')
        +'<span class="item-name">'+esc(p.nombre)+'</span>'
        +(p.valor?'<span style="font-size:11px;color:#f97316;flex-shrink:0">'+p.valor+'K€</span>':'')
        +'</div>'
        +'<div class="item-sub">'+(fac?esc(fac.nombre)+' · ':'')+esc(dists)+'</div>'
        +'</div>'
        +'<span style="color:var(--textMuted);font-size:18px;flex-shrink:0">›</span></div>';
    });
    h+='</div>';
  });
  return h;
}

// ── FACILITIES ──
function rFacilities(){
  var q=(searches.facilities||'').toLowerCase();
  var items=(state.facilities||[]).filter(function(x){return !q||((x.nombre||'').toLowerCase().includes(q));});

  var h='<div style="font-size:11px;color:var(--textMuted);margin-bottom:10px">'+items.length+' facilities</div>'
    +'<div class="search-wrap"><span class="search-icon">⌕</span>'
    +'<input class="search-input" placeholder="Buscar facility..." value="'+esc(searches.facilities||'')+'" oninput="searches.facilities=this.value;render()"></div>';

  if(!items.length) return h+'<div class="empty">No hay facilities</div>';
  h+='<div class="card" style="padding:0 14px">';
  items.forEach(function(x){
    var nc=(state.contactos||[]).filter(function(c){return c.facilityId===x.id;}).length;
    var np=(state.proyectos||[]).filter(function(p){return p.facilityId===x.id;}).length;
    h+='<div class="list-item" onclick="openDetail(\'facility\',\''+x.id+'\')"><div style="flex:1;min-width:0">'
      +'<div class="item-name">'+esc(x.nombre)+'</div>'
      +'<div class="item-sub">'+(x.zona||x.provincia||'')+(nc?' · '+nc+' contactos':'')+(np?' · '+np+' proyectos':'')+'</div>'
      +'</div>'+(x.estado?bdg(x.estado):'')
      +'<span style="color:var(--textMuted);font-size:18px;margin-left:6px">›</span></div>';
  });
  h+='</div>';
  return h;
}

// ── DISTRIBUIDORES ──
function rDistribuidores(){
  var q=(searches.distribuidores||'').toLowerCase();
  var items=(state.distribuidores||[]).filter(function(d){return !q||((d.nombre||'').toLowerCase().includes(q));});

  var h='<div style="font-size:11px;color:var(--textMuted);margin-bottom:10px">'+(state.distribuidores||[]).length+' distribuidores</div>'
    +'<div class="search-wrap"><span class="search-icon">⌕</span>'
    +'<input class="search-input" placeholder="Buscar distribuidor..." value="'+esc(searches.distribuidores||'')+'" oninput="searches.distribuidores=this.value;render()"></div>';

  if(!items.length) return h+'<div class="empty">No hay distribuidores</div>';
  h+='<div class="card" style="padding:0 14px">';
  items.forEach(function(d){
    var np=(state.proyectos||[]).filter(function(p){return p.distribuidorIds&&p.distribuidorIds.indexOf(d.id)>=0;}).length;
    var d26=EXCEL_2026.find(function(x){return x.dist===d.nombre;});
    h+='<div class="list-item" onclick="openDetail(\'distribuidor\',\''+d.id+'\')"><div style="flex:1;min-width:0">'
      +'<div class="item-name">'+esc(d.nombre)+'</div>'
      +'<div class="item-sub">'+(d.provincia||'')+(np?' · '+np+' proyectos':'')+(d26?' · '+d26.TOTAL+' rob. 2026':'')+'</div>'
      +'</div>'+bdg(d.estado||'Activo')
      +'<span style="color:var(--textMuted);font-size:18px;margin-left:6px">›</span></div>';
  });
  h+='</div>';
  return h;
}

// ── DETAIL PANEL ──
function openDetail(type,id){
  var item=null;
  if(type==='facility') item=(state.facilities||[]).find(function(x){return x.id===id;});
  if(type==='distribuidor') item=(state.distribuidores||[]).find(function(x){return x.id===id;});
  if(type==='proyecto') item=(state.proyectos||[]).find(function(x){return x.id===id;});
  if(!item) return;
  document.getElementById('detail-title').textContent=item.nombre||'Detalle';
  document.getElementById('detail-body').innerHTML=buildDetail(type,item);
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail(){ document.getElementById('detail-overlay').classList.remove('open'); }

function row(l,v){ if(!v) return ''; return '<div class="dl"><div class="dl-lbl">'+l+'</div><div class="dl-val">'+v+'</div></div>'; }

function buildDetail(type,item){
  var h='';
  if(type==='proyecto'){
    var fac=(state.facilities||[]).find(function(f){return f.id===item.facilityId;});
    var dists=(state.distribuidores||[]).filter(function(d){return item.distribuidorIds&&item.distribuidorIds.indexOf(d.id)>=0;});
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'+bdg(item.estado||'')+(item.hot?'<span class="bdg" style="background:rgba(239,68,68,.12);color:#ef4444">🔥 HOT</span>':'')+'</div>';
    h+=row('Facility',fac?esc(fac.nombre):'');
    h+=row('Distribuidores',dists.map(function(d){return esc(d.nombre);}).join(', '));
    if(item.valor) h+=row('Valor',item.valor+'K€');
    if(item.modelo) h+=row('Modelo',esc(item.modelo));
    if(item.robots) h+=row('Robots',item.robots);
    if(item.fechaPrev) h+=row('Fecha prevista',item.fechaPrev);
    // Tareas vinculadas
    var tareas=(state.tareas||[]).filter(function(t){return t.vinculoProjId===item.id;});
    if(tareas.length){
      h+='<div class="dl-lbl" style="margin-bottom:6px">Tareas ('+tareas.length+')</div>';
      tareas.forEach(function(t){
        h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">'
          +'<span style="font-size:13px;color:var(--text);'+(t.estado==='Hecha'?'text-decoration:line-through;color:var(--textMuted)':'')+'">'+esc(t.titulo)+'</span>'
          +bdg(t.estado||'')+'</div>';
      });
    }
    if(item.notas) h+=row('Notas','<span style="white-space:pre-wrap;color:var(--textMuted)">'+esc(item.notas)+'</span>');
  }

  if(type==='facility'){
    if(item.estado) h+='<div style="margin-bottom:14px">'+bdg(item.estado)+'</div>';
    h+=row('Zona',esc(item.zona||item.provincia||''));
    h+=row('Dirección',esc(item.direccion||''));
    if(item.web) h+=row('Web','<a href="'+item.web+'" style="color:var(--accent)">'+esc(item.web)+'</a>');
    var contactos=(state.contactos||[]).filter(function(c){return c.facilityId===item.id;});
    if(contactos.length){
      h+='<div class="dl-lbl" style="margin-bottom:6px">Contactos ('+contactos.length+')</div>';
      contactos.forEach(function(c){
        h+='<div style="padding:8px 0;border-bottom:1px solid var(--border)">'
          +'<div style="font-size:14px;color:var(--text)">'+esc(c.nombre||'')+'</div>'
          +'<div style="font-size:11px;color:var(--textMuted)">'+(c.cargo||'')+(c.email?' · <a href="mailto:'+c.email+'" style="color:var(--accent)">'+c.email+'</a>':'')+'</div></div>';
      });
    }
    var projs=(state.proyectos||[]).filter(function(p){return p.facilityId===item.id;});
    if(projs.length){
      h+='<div class="dl-lbl" style="margin:14px 0 6px">Proyectos ('+projs.length+')</div>';
      projs.forEach(function(p){
        h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="closeDetail();openDetail(\'proyecto\',\''+p.id+'\')"><span style="font-size:13px;color:var(--text)">'+esc(p.nombre||'')+'</span>'+bdg(p.estado||'')+'</div>';
      });
    }
    if(item.notas) h+=row('Notas','<span style="white-space:pre-wrap;color:var(--textMuted)">'+esc(item.notas)+'</span>');
  }

  if(type==='distribuidor'){
    if(item.estado) h+='<div style="margin-bottom:14px">'+bdg(item.estado||'Activo')+'</div>';
    h+=row('Provincia',esc(item.provincia||''));
    if(item.email) h+=row('Email','<a href="mailto:'+item.email+'" style="color:var(--accent)">'+esc(item.email)+'</a>');
    if(item.telefono) h+=row('Teléfono','<a href="tel:'+item.telefono+'" style="color:var(--accent)">'+item.telefono+'</a>');
    var d26=EXCEL_2026.find(function(x){return x.dist===item.nombre;});
    if(d26&&d26.TOTAL>0){
      h+='<div class="dl-lbl" style="margin-bottom:6px">Ventas 2026 — '+d26.TOTAL+' robots</div>';
      var mods=Object.keys(d26).filter(function(k){return k!=='dist'&&k!=='TOTAL'&&d26[k]>0;}).sort(function(a,b){return d26[b]-d26[a];});
      mods.forEach(function(m){
        h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">'
          +'<span style="font-size:13px;color:var(--text)">'+m+'</span>'
          +'<span style="font-size:13px;font-weight:700;color:var(--accent)">'+d26[m]+'</span></div>';
      });
    }
    var projs=(state.proyectos||[]).filter(function(p){return p.distribuidorIds&&p.distribuidorIds.indexOf(item.id)>=0;});
    if(projs.length){
      h+='<div class="dl-lbl" style="margin:14px 0 6px">Proyectos ('+projs.length+')</div>';
      projs.forEach(function(p){
        h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="closeDetail();openDetail(\'proyecto\',\''+p.id+'\')"><span style="font-size:13px;color:var(--text)">'+esc(p.nombre||'')+'</span>'+bdg(p.estado||'')+'</div>';
      });
    }
    if(item.notas) h+=row('Notas','<span style="white-space:pre-wrap;color:var(--textMuted)">'+esc(item.notas)+'</span>');
  }
  return h||'<div class="empty">Sin datos</div>';
}
</script>
