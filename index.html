<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Robots</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bgCard:#111;--bgSurface:#181818;--bgHover:#1e1e1e;
  --border:#242424;--borderHover:#333;
  --accent:#3b82f6;--accentSoft:#0f2040;
  --success:#22c55e;--successSoft:#0a2010;
  --warning:#f59e0b;--warningSoft:#1a1000;
  --danger:#ef4444;--dangerSoft:#200808;
  --purple:#a78bfa;--purpleSoft:#1a0f30;
  --teal:#2dd4bf;
  --text:#f0f0f0;--textMuted:#4a4a4a;--textSub:#888;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
input,select,textarea,button{font-family:'DM Sans',sans-serif}

.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--bgCard);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100}
.main{flex:1;margin-left:200px;overflow:auto;transition:margin-right .2s}
.main.panel-open{margin-right:380px}
.content{max-width:1000px;margin:0 auto;padding:28px 24px}

.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--text);text-transform:uppercase}
.sidebar-sub{font-size:10px;color:var(--textMuted);margin-top:2px}
.sidebar-nav{padding:6px 0;flex:1}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 16px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--textMuted);font-size:12px;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bgSurface);color:var(--textSub)}
.nav-btn.active{background:var(--bgSurface);color:var(--text);border-left-color:var(--accent)}
.nav-icon{font-size:13px;width:16px;text-align:center}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:18px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn-primary{background:var(--accent);border:none;border-radius:5px;padding:7px 16px;color:#fff;cursor:pointer;font-size:12px;font-weight:500;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.btn-secondary:hover{border-color:var(--borderHover);color:var(--textSub)}
.btn-danger{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--danger);cursor:pointer;font-size:12px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.stat-card{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.stat-sub{font-size:10px;color:var(--textMuted);margin-top:4px}

/* Pills */
.pills-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:8px}
.pill:hover{opacity:.8}
.pill-num{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.pill-label{font-size:11px;opacity:.8}

/* Filters */
.filter-bar{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-size:12px;flex:1 1 140px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--accent)}

/* Multi-checkbox filter */
.filter-checks{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.filter-check-label{display:flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:11px;color:var(--textSub);transition:all .15s;user-select:none;white-space:nowrap}
.filter-check-label:hover{border-color:var(--borderHover);color:var(--text)}
.filter-check-label.active{border-color:var(--accent);background:var(--accentSoft);color:#93c5fd}
.filter-check-label input{display:none}
.filter-check-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}

/* List */
.list{display:flex;flex-direction:column;gap:4px}
.list-item{background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.list-item:hover{border-color:var(--borderHover);background:var(--bgHover)}
.list-item.selected{background:var(--bgSurface);border-color:var(--accent)}
.item-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:11px;color:var(--textMuted);margin-top:2px}
.item-value{font-size:12px;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap}

/* Badge */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}

/* Prio groups */
.prio-group{margin-bottom:18px}
.prio-header{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bgCard);border-left:1px solid var(--border);z-index:200;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .2s}
.detail-panel.open{transform:translateX(0)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.detail-title{font-size:15px;font-weight:600;color:var(--text);margin-top:3px;line-height:1.3}
.detail-type{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em}
.close-btn{background:none;border:none;color:var(--textMuted);cursor:pointer;font-size:20px;line-height:1;padding:0;flex-shrink:0}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.detail-key{font-size:11px;color:var(--textMuted);flex-shrink:0}
.detail-val{font-size:11px;color:var(--textSub);max-width:220px;text-align:right;word-break:break-word}
.detail-notes{font-size:12px;color:#c4b5fd;margin-top:10px;line-height:1.7;padding:12px;background:#1a0f30;border:1px solid #2e1065;border-radius:6px}
.detail-section{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-top:16px;margin-bottom:7px}
.detail-actions{display:flex;gap:6px;margin-top:18px}
.detail-actions .btn-primary{flex:1;text-align:center}
.mini-card{padding:7px 9px;background:var(--bgSurface);border-radius:5px;margin-bottom:5px}
.mini-card-name{font-size:12px;color:var(--text);font-weight:500}
.mini-card-sub{font-size:10px;color:var(--textMuted);margin-top:2px}

/* Modal — bigger */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600;color:var(--text)}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.form-full{grid-column:1/-1}
.form-half{grid-column:span 2}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:10px;color:var(--textMuted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.form-label span{color:var(--danger)}
.form-input{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-notes{width:100%;background:#0d0820;border:1px solid #2e1065;border-radius:5px;padding:10px 12px;color:#c4b5fd;font-size:13px;outline:none;resize:vertical;line-height:1.6;transition:border-color .15s}
.form-notes:focus{border-color:#a78bfa}
.form-notes::placeholder{color:#4a3a70}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Multi-select distribuidor */
.dist-checkboxes{display:flex;flex-wrap:wrap;gap:5px;padding:8px;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;max-height:120px;overflow-y:auto}
.dist-check-item{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;color:var(--textSub);transition:all .15s;user-select:none}
.dist-check-item:hover{border-color:var(--borderHover);color:var(--text)}
.dist-check-item.checked{border-color:var(--accent);background:var(--accentSoft);color:#93c5fd}
.dist-check-item input{display:none}

/* Dashboard panels */
.dash-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-panel{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px}
.dash-panel-title{font-size:10px;font-weight:500;color:var(--textMuted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--textMuted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:9px 18px;font-size:12px;color:var(--text);z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px;color:var(--textMuted);font-size:12px}
.mark-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--textMuted);cursor:pointer;font-size:10px;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.mark-btn.done{background:var(--successSoft);border-color:var(--success);color:var(--success)}

@media(max-width:768px){
  .sidebar{width:52px}
  .sidebar-logo,.sidebar-sub,.nav-label,.sidebar-footer div{display:none}
  .nav-btn{padding:10px;justify-content:center}
  .main{margin-left:52px}
  .main.panel-open{margin-right:0}
  .detail-panel{width:100%;top:auto;height:75vh}
  .dash-panels{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>

// ── API ──
async function apiFetch(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u.toString());return r.json();}
async function apiPost(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(b),headers:{'Content-Type':'application/json'}});return r.json();}

async function loadAll(){
  setSyncStatus('⟳');
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas'];
    const res=await Promise.all(ents.map(e=>apiFetch({action:'read',entity:e})));
    let hasData=false;
    ents.forEach((e,i)=>{
      state[e]=res[i].data||[];
      // coerce valor to number
      if(e==='proyectos') state[e]=state[e].map(p=>({...p,valor:Number(p.valor)||0}));
      if(state[e].length>0)hasData=true;
    });
    if(!hasData){
      state={...JSON.parse(JSON.stringify(SEED))};
      await Promise.all(Object.keys(SEED).map(e=>apiPost({action:'write',entity:e,data:state[e]})));
      showToast('Datos cargados del Excel');
    }
    setSyncStatus('● Sync');render();
  }catch(err){
    state=JSON.parse(JSON.stringify(SEED));
    render();setSyncStatus('✕');showToast('Sin conexión — datos locales');
  }
}

async function saveE(e){
  setSyncStatus('⟳');
  try{await apiPost({action:'write',entity:e,data:state[e]});setSyncStatus('● Sync');showToast('Guardado');}
  catch(err){setSyncStatus('✕');}
}

function setSyncStatus(m){document.getElementById('sync-status').textContent=m;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function genId(p){return p+Date.now().toString(36).toUpperCase().slice(-6);}

// distribuidorIds can be comma-separated string or array
function getDistIds(p){
  if(!p.distribuidorIds)return[];
  if(Array.isArray(p.distribuidorIds))return p.distribuidorIds.filter(Boolean);
  return String(p.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean);
}
function dNoms(p){
  return getDistIds(p).map(id=>{const d=state.distribuidores.find(x=>x.id===id);return d?d.nombre:id;}).join(', ')||'—';
}
function fv(v){const n=Number(v)||0;return n>0?n.toLocaleString('es-ES')+'K€':'';}

// ── Multi-state filter bar ──
function filterChecks(options, activeSet, onChange){
  return`<div class="filter-checks">${options.map(o=>{
    const active=activeSet.has(o);
    return`<label class="filter-check-label${active?' active':''}">
      <input type="checkbox"${active?' checked':''} data-estado="${o}" onchange="${onChange}(this)">
      <span class="filter-check-dot"></span>${o}
    </label>`;
  }).join('')}</div>`;
}

function toggleEstado(el){
  const e=el.dataset.estado;
  if(el.checked)filters.estados.add(e);else filters.estados.delete(e);
  render();
}

function matchEstados(itemEstado){
  if(filters.estados.size===0)return true;
  return filters.estados.has(itemEstado);
}

function rDetail(item,type){
  const rows=pairs=>pairs.filter(([,v])=>v).map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  let h=`<div class="detail-header"><div><div class="detail-type">${type}</div><div class="detail-title">${item.nombre||item.empresa||item.titulo||''}</div></div><button class="close-btn" id="btn-close-detail">×</button></div>`;

  if(type==='proyecto'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.estado)}</div>`;
    h+=rows([['Distribuidores',dNoms(item)],['Facility',item.facilityId?state.facilities.find(f=>f.id===item.facilityId)?.nombre||'—':''],['Modelo',item.modelo],['Valor est.',fv(item.valor)],['Prox. contacto',item.fecha]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    const tars=state.tareas.filter(t=>t.vinculoId===item.id);
    if(tars.length){h+=`<div class="detail-section">Tareas</div>`;h+=tars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${t.titulo}</div><div class="mini-card-sub">${t.fecha||''}</div></div>${bdg(t.estado)}</div>`).join('');}
  }
  if(type==='distribuidor'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Activo')}</div>`;
    h+=rows([['Provincia/Zona',item.provincia]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    const projs=state.proyectos.filter(p=>getDistIds(p).includes(item.id));
    if(projs.length){h+=`<div class="detail-section">Proyectos (${projs.length})</div>`;h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');}
  }
  if(type==='lead'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Nuevo')}</div>`;
    h+=rows([['Contacto',item.contacto],['Origen',item.origen]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
  }
  if(type==='facility'){
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    const conts=state.contactos.filter(c=>c.facilityId===item.id);
    h+=`<div class="detail-section">Contactos</div>`;
    if(conts.length)h+=conts.map(c=>`<div class="mini-card"><div class="mini-card-name">${c.nombre}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}</div></div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px">Sin contactos</div>`;
    h+=`<button class="btn-secondary" style="width:100%;margin-bottom:12px;font-size:11px" id="btn-add-contacto">+ Añadir contacto</button>`;
    const projs=state.proyectos.filter(p=>p.facilityId===item.id);
    h+=`<div class="detail-section">Proyectos</div>`;
    if(projs.length)h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px">Sin proyectos</div>`;
    h+=`<button class="btn-secondary" style="width:100%;margin-bottom:12px;font-size:11px" id="btn-add-proyecto-facility">+ Añadir proyecto</button>`;
  }
  if(type==='tarea'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.tipo||'')}${bdg(item.prioridad)}${bdg(item.estado)}</div>`;
    const vl=item.vinculoTipo==='proyecto'?state.proyectos.find(x=>x.id===item.vinculoId):item.vinculoTipo==='distribuidor'?state.distribuidores.find(x=>x.id===item.vinculoId):item.vinculoTipo==='facility'?state.facilities.find(x=>x.id===item.vinculoId):item.vinculoTipo==='lead'?state.leads.find(x=>x.id===item.vinculoId):null;
    if(vl)h+=`<div class="mini-card" style="margin-bottom:12px"><div class="mini-card-name">${vl.nombre||vl.empresa||''}</div><div class="mini-card-sub">${item.vinculoTipo}</div></div>`;
    h+=rows([['Fecha límite',item.fecha]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
  }
  h+=`<div class="detail-actions"><button class="btn-primary" id="btn-edit-detail">Editar</button><button class="btn-danger" id="btn-del-detail">Eliminar</button></div>`;
  return h;
}

// ── Modal ──
function openModal(type,item=null,presets={}){
  editingItem=item;
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=rModal(type,item,presets);
  document.body.appendChild(ov);
  bindML(type);
}
function closeModal(){document.getElementById('modal-overlay')?.remove();editingItem=null;}

function distCheckboxes(selected=[]){
  const sel=Array.isArray(selected)?selected:String(selected).split(',').map(s=>s.trim()).filter(Boolean);
  return`<div class="dist-checkboxes">${state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(d=>`<label class="dist-check-item${sel.includes(d.id)?' checked':''}"><input type="checkbox" name="distCheck" value="${d.id}"${sel.includes(d.id)?' checked':''}>${d.nombre}</label>`).join('')}</div>`;
}

function vOpts(cur=''){
  let o='<option value="">— Sin vincular —</option>';
  if(state.proyectos.length)o+=`<optgroup label="Proyectos">${state.proyectos.map(p=>`<option value="proyecto:${p.id}"${cur===`proyecto:${p.id}`?' selected':''}>${p.nombre}</option>`).join('')}</optgroup>`;
  if(state.distribuidores.length)o+=`<optgroup label="Distribuidores">${state.distribuidores.map(d=>`<option value="distribuidor:${d.id}"${cur===`distribuidor:${d.id}`?' selected':''}>${d.nombre}</option>`).join('')}</optgroup>`;
  if(state.facilities.length)o+=`<optgroup label="Facilities">${state.facilities.map(f=>`<option value="facility:${f.id}"${cur===`facility:${f.id}`?' selected':''}>${f.nombre}</option>`).join('')}</optgroup>`;
  if(state.leads.length)o+=`<optgroup label="Leads">${state.leads.map(l=>`<option value="lead:${l.id}"${cur===`lead:${l.id}`?' selected':''}>${l.empresa||l.id}</option>`).join('')}</optgroup>`;
  return o;
}

function rModal(type,item,presets={}){
  const v={...presets,...(item||{})};
  const titles={lead:'Lead',proyecto:'Proyecto',distribuidor:'Distribuidor',facility:'Facility',tarea:'Tarea',contacto:'Contacto'};
  const title=(item?'Editar ':'Nuevo ')+titles[type];
  let fields='';

  if(type==='lead') fields=`
    <div class="form-grid">
      <div class="form-full form-group"><label class="form-label">Empresa <span>*</span></label><input class="form-input" name="empresa" value="${v.empresa||''}"></div>
      <div class="form-group"><label class="form-label">Contacto</label><input class="form-input" name="contacto" value="${v.contacto||''}"></div>
      <div class="form-group"><label class="form-label">Origen</label><select class="form-input" name="origen"><option>—</option>${['Web','Feria','Proveedor','Referido','Otro'].map(o=>`<option${v.origen===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Nuevo','Contactado','Calificado','Convertido','Descartado'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Escribe aquí notas relevantes...">${v.notas||''}</textarea></div>
    </div>`;

  if(type==='proyecto'){
    const selDist=v.distribuidorIds?Array.isArray(v.distribuidorIds)?v.distribuidorIds:String(v.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean):[];
    const facilOpts=state.facilities.map(f=>`<option value="${f.id}"${v.facilityId===f.id?' selected':''}>${f.nombre}</option>`).join('');
    fields=`
    <div class="form-grid">
      <div class="form-half form-group"><label class="form-label">Cliente / Proyecto <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Activo','Pendiente','Inactivo','Ganado','Perdido'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Modelo / Robot</label><input class="form-input" name="modelo" value="${v.modelo||''}"></div>
      <div class="form-group"><label class="form-label">Valor est. (K€)</label><input class="form-input" name="valor" type="number" value="${v.valor||''}"></div>
      <div class="form-group"><label class="form-label">Prox. contacto</label><input class="form-input" name="fecha" type="date" value="${v.fecha||''}"></div>
      <div class="form-group"><label class="form-label">Facility</label><select class="form-input" name="facilityId"><option value="">— Sin facility —</option>${facilOpts}</select></div>
      <div class="form-full form-group"><label class="form-label">Distribuidores <span style="color:var(--textMuted);font-weight:400;text-transform:none">(selecciona uno o varios)</span></label>${distCheckboxes(selDist)}</div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Escribe aquí notas relevantes...">${v.notas||''}</textarea></div>
    </div>`;
  }

  if(type==='distribuidor') fields=`
    <div class="form-grid">
      <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Activo','Negociando','Empieza','Se raja','Inactivo'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-half form-group"><label class="form-label">Provincia / Zona</label><input class="form-input" name="provincia" value="${v.provincia||''}"></div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Escribe aquí notas relevantes...">${v.notas||''}</textarea></div>
    </div>`;

  if(type==='facility') fields=`
    <div class="form-grid">
      <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
      <div class="form-group"><label class="form-label">Ciudad</label><input class="form-input" name="ciudad" value="${v.ciudad||''}"></div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Escribe aquí notas relevantes...">${v.notas||''}</textarea></div>
    </div>`;

  if(type==='contacto') fields=`
    <div class="form-grid">
      <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
      <div class="form-group"><label class="form-label">Cargo</label><input class="form-input" name="cargo" value="${v.cargo||''}"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" value="${v.email||''}"></div>
      <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" name="tel" value="${v.tel||''}"></div>
      <input type="hidden" name="facilityId" value="${v.facilityId||''}">
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="3" placeholder="Notas...">${v.notas||''}</textarea></div>
    </div>`;

  if(type==='tarea'){
    const vc=v.vinculoTipo&&v.vinculoId?`${v.vinculoTipo}:${v.vinculoId}`:'';
    fields=`
    <div class="form-grid">
      <div class="form-full form-group"><label class="form-label">Tarea <span>*</span></label><input class="form-input" name="titulo" value="${v.titulo||''}"></div>
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-input" name="tipo">${['Llamada','Email','Reunión','Demo','Propuesta','Seguimiento','Otro'].map(o=>`<option${v.tipo===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Prioridad</label><select class="form-input" name="prioridad">${['Alta','Media','Baja'].map(o=>`<option${v.prioridad===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Pendiente','En curso','Hecha'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-full form-group"><label class="form-label">Vincular a</label><select class="form-input" name="vinculo">${vOpts(vc)}</select></div>
      <div class="form-half form-group"><label class="form-label">Fecha límite</label><input class="form-input" name="fecha" type="date" value="${v.fecha||''}"></div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Escribe aquí notas relevantes...">${v.notas||''}</textarea></div>
    </div>`;
  }

  return`<div class="modal">
    <div class="modal-header"><span class="modal-title">${title}</span><button class="close-btn" id="btn-close-modal">×</button></div>
    <form id="crm-form">${fields}
      <div class="form-actions"><button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form>
  </div>`;
}

// ── Bind listeners ──
function bindL(){
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';render();await saveE('tareas');}
    });
  });
  const bn=document.getElementById('btn-new');
  if(bn)bn.addEventListener('click',()=>{const tm={leads:'lead',proyectos:'proyecto',distribuidores:'distribuidor',facilities:'facility',tareas:'tarea'};openModal(tm[currentView]||'tarea');});
  const fs=document.getElementById('f-search');
  if(fs)fs.addEventListener('input',e=>{filters.search=e.target.value;render();});
  const fd=document.getElementById('f-dist');
  if(fd)fd.addEventListener('change',e=>{filters.distId=e.target.value;render();});
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:''};closeDetail();render();
    });
  });
  // dist checkbox styling
  document.querySelectorAll('.dist-check-item input').forEach(chk=>{
    chk.addEventListener('change',e=>{e.target.closest('.dist-check-item').classList.toggle('checked',e.target.checked);});
  });
}

function bindDL(){
  document.getElementById('btn-close-detail')?.addEventListener('click',()=>{closeDetail();render();});
  document.getElementById('btn-edit-detail')?.addEventListener('click',()=>openModal(selectedType,selectedItem));
  document.getElementById('btn-del-detail')?.addEventListener('click',async()=>{
    if(!confirm('¿Eliminar?'))return;
    const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[selectedType];
    if(key){state[key]=state[key].filter(x=>x.id!==selectedItem.id);closeDetail();render();await saveE(key);}
  });
  document.getElementById('btn-add-contacto')?.addEventListener('click',()=>{
    openModal('contacto',null,{facilityId:selectedItem.id});
  });
  document.getElementById('btn-add-proyecto-facility')?.addEventListener('click',()=>{
    openModal('proyecto',null,{facilityId:selectedItem.id});
  });
}

function bindML(type){
  document.getElementById('btn-close-modal')?.addEventListener('click',closeModal);
  document.getElementById('btn-cancel-modal')?.addEventListener('click',closeModal);
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const data={};
    new FormData(form).forEach((v,k)=>data[k]=v);

    // multi distribuidor
    if(type==='proyecto'){
      const checked=[...form.querySelectorAll('[name="distCheck"]:checked')].map(c=>c.value);
      data.distribuidorIds=checked.join(',');
      data.valor=Number(data.valor)||0;
      delete data.distCheck;
    }

    // vinculo
    if(data.vinculo){const p=data.vinculo.split(':');data.vinculoTipo=p[0]||'';data.vinculoId=p[1]||'';delete data.vinculo;}

    const km={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[type];if(!key)return;

    if(editingItem){
      Object.assign(editingItem,data);
      state[key]=state[key].map(x=>x.id===editingItem.id?editingItem:x);
      if(selectedItem?.id===editingItem.id)selectedItem=editingItem;
    } else {
      const px={lead:'L',proyecto:'P',distribuidor:'D',facility:'F',tarea:'T',contacto:'C'};
      data.id=genId(px[type]||'X');
      if(!data.fecha)data.fecha=today();
      state[key].push(data);
    }
    closeModal();
    // re-open detail if we added a contacto/proyecto to facility
    if((type==='contacto'||type==='proyecto')&&data.facilityId){
      const fac=state.facilities.find(f=>f.id===data.facilityId);
      if(fac){openDetail(fac,'facility');}
    }
    render();
    await saveE(key);
  });
}

loadAll();
</script>
</body>
</html>
