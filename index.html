<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Robots</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bgCard:#111;--bgSurface:#181818;--bgHover:#1e1e1e;
  --border:#242424;--borderHover:#333;
  --accent:#3b82f6;--accentSoft:#0f2040;
  --success:#22c55e;--successSoft:#0a2010;
  --warning:#f59e0b;
  --danger:#ef4444;
  --text:#f0f0f0;--textMuted:#4a4a4a;--textSub:#888;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
input,select,textarea,button{font-family:'DM Sans',sans-serif}

.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--bgCard);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100}
.main{flex:1;margin-left:200px;overflow:auto;transition:margin-right .2s}
.main.panel-open{margin-right:380px}
.content{max-width:1000px;margin:0 auto;padding:28px 24px}

.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--text);text-transform:uppercase}
.sidebar-sub{font-size:10px;color:var(--textMuted);margin-top:2px}
.sidebar-nav{padding:6px 0;flex:1}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 16px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--textMuted);font-size:12px;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bgSurface);color:var(--textSub)}
.nav-btn.active{background:var(--bgSurface);color:var(--text);border-left-color:var(--accent)}
.nav-icon{font-size:13px;width:16px;text-align:center}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:18px;font-weight:600}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn-primary{background:var(--accent);border:none;border-radius:5px;padding:7px 16px;color:#fff;cursor:pointer;font-size:12px;font-weight:500;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.btn-secondary:hover{border-color:var(--borderHover);color:var(--textSub)}
.btn-danger{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--danger);cursor:pointer;font-size:12px}
.btn-sm{padding:4px 10px;font-size:11px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.stat-card{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.stat-sub{font-size:10px;color:var(--textMuted);margin-top:4px}

.pills-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:8px}
.pill:hover{opacity:.8}
.pill-num{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.pill-label{font-size:11px;opacity:.8}

/* Filter bar */
.filter-bar{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--accent)}
.filter-search{flex:1 1 160px}

/* Multiselect dropdown */
.ms-wrap{position:relative;display:inline-block}
.ms-trigger{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 28px 6px 10px;color:var(--textSub);font-size:12px;cursor:pointer;white-space:nowrap;min-width:130px;position:relative;user-select:none;transition:border-color .15s}
.ms-trigger:hover{border-color:var(--borderHover)}
.ms-trigger.has-active{border-color:var(--accent);color:#93c5fd;background:var(--accentSoft)}
.ms-trigger::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--textMuted)}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:180px;background:var(--bgCard);border:1px solid var(--border);border-radius:7px;z-index:500;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.ms-dropdown.open{display:block}
.ms-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.ms-option:hover{background:var(--bgSurface);color:var(--text)}
.ms-option.selected{color:var(--text)}
.ms-check{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.ms-option.selected .ms-check{background:var(--accent);border-color:var(--accent);color:#fff}
.ms-clear{margin-top:4px;padding-top:6px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--textMuted);cursor:pointer;padding-bottom:2px}
.ms-clear:hover{color:var(--text)}

/* List */
.list{display:flex;flex-direction:column;gap:4px}
.list-item{background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.list-item:hover{border-color:var(--borderHover);background:var(--bgHover)}
.list-item.selected{background:var(--bgSurface);border-color:var(--accent)}
.item-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:11px;color:var(--textMuted);margin-top:2px}
.item-value{font-size:12px;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap}

.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}
.prio-group{margin-bottom:18px}
.prio-header{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bgCard);border-left:1px solid var(--border);z-index:200;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .2s}
.detail-panel.open{transform:translateX(0)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.detail-title{font-size:15px;font-weight:600;margin-top:3px;line-height:1.3}
.detail-type{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em}
.close-btn{background:none;border:none;color:var(--textMuted);cursor:pointer;font-size:20px;line-height:1;padding:0;flex-shrink:0}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.detail-key{font-size:11px;color:var(--textMuted);flex-shrink:0}
.detail-val{font-size:11px;color:var(--textSub);max-width:220px;text-align:right;word-break:break-word}
.detail-notes{font-size:12px;color:#c4b5fd;margin-top:10px;line-height:1.7;padding:12px;background:#1a0f30;border:1px solid #2e1065;border-radius:6px}
.detail-section{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-top:16px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.detail-actions{display:flex;gap:6px;margin-top:18px}
.detail-actions .btn-primary{flex:1;text-align:center}
.mini-card{padding:7px 9px;background:var(--bgSurface);border-radius:5px;margin-bottom:5px;cursor:default}
.mini-card.clickable{cursor:pointer;transition:border-color .15s;border:1px solid transparent}
.mini-card.clickable:hover{border-color:var(--accent);background:var(--bgHover)}
.mini-card-name{font-size:12px;font-weight:500}
.mini-card-sub{font-size:10px;color:var(--textMuted);margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.form-full{grid-column:1/-1}
.form-half{grid-column:span 2}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:10px;color:var(--textMuted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.form-label span{color:var(--danger)}
.form-input{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-notes{width:100%;background:#0d0820;border:1px solid #2e1065;border-radius:5px;padding:10px 12px;color:#c4b5fd;font-size:13px;outline:none;resize:vertical;line-height:1.6}
.form-notes:focus{border-color:#a78bfa}
.form-notes::placeholder{color:#4a3a70}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Dist search in modal */
.dist-search-wrap{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.dist-search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:7px 10px;color:var(--text);font-size:12px;outline:none}
.dist-options{max-height:140px;overflow-y:auto;padding:4px}
.dist-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.dist-opt:hover{background:var(--bgHover);color:var(--text)}
.dist-opt.checked{color:var(--text)}
.dist-opt .dc{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.dist-opt.checked .dc{background:var(--accent);border-color:var(--accent);color:#fff}

/* Dashboard */
.dash-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-panel{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px}
.dash-panel-title{font-size:10px;font-weight:500;color:var(--textMuted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--textMuted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:9px 18px;font-size:12px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px;color:var(--textMuted);font-size:12px}
.mark-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--textMuted);cursor:pointer;font-size:10px;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.mark-btn.done{background:var(--successSoft);border-color:var(--success);color:var(--success)}

@media(max-width:768px){
  .sidebar{width:52px}
  .sidebar-logo,.sidebar-sub,.nav-label,.sidebar-footer div{display:none}
  .nav-btn{padding:10px;justify-content:center}
  .main{margin-left:52px}
  .main.panel-open{margin-right:0}
  .detail-panel{width:100%;top:auto;height:75vh}
  .dash-panels{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .form-half{grid-column:1/-1}
}
</style>
</head>

// ── API ──
async function apiFetch(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u.toString());return r.json();}
async function apiPost(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(b),headers:{'Content-Type':'application/json'}});return r.json();}

async function loadAll(){
  setSyncStatus('⟳');
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas'];
    const res=await Promise.all(ents.map(e=>apiFetch({action:'read',entity:e})));
    let hasData=false;
    ents.forEach((e,i)=>{
      state[e]=res[i].data||[];
      if(e==='proyectos')state[e]=state[e].map(p=>({...p,valor:Number(p.valor)||0}));
      if(state[e].length>0)hasData=true;
    });
    if(!hasData){
      state=JSON.parse(JSON.stringify(SEED));
      await Promise.all(Object.keys(SEED).map(e=>apiPost({action:'write',entity:e,data:state[e]})));
      showToast('Datos cargados del Excel');
    }
    setSyncStatus('● Sync');render();
  }catch(err){
    state=JSON.parse(JSON.stringify(SEED));
    render();setSyncStatus('✕');showToast('Sin conexión — datos locales');
  }
}
async function saveE(e){setSyncStatus('⟳');try{await apiPost({action:'write',entity:e,data:state[e]});setSyncStatus('● Sync');showToast('Guardado');}catch(err){setSyncStatus('✕');}}

function setSyncStatus(m){document.getElementById('sync-status').textContent=m;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function genId(p){return p+Date.now().toString(36).toUpperCase().slice(-6);}
function today(){return new Date().toISOString().slice(0,10);}

function bdg(l){if(!l)return'';const[bg,c]=BM[l]||['#111','#666'];return`<span class="badge" style="background:${bg};color:${c}">${l}</span>`;}

function getDistIds(p){
  if(!p.distribuidorIds)return[];
  if(Array.isArray(p.distribuidorIds))return p.distribuidorIds.filter(Boolean);
  return String(p.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean);
}
function dNoms(p){return getDistIds(p).map(id=>{const d=state.distribuidores.find(x=>x.id===id);return d?d.nombre:id;}).join(', ')||'—';}
function fv(v){const n=Number(v)||0;return n>0?n.toLocaleString('es-ES')+'K€':'';}
function getFacilityName(id){const f=state.facilities.find(x=>x.id===id);return f?f.nombre:'';}

// ── Multiselect dropdown ──
function msDropdown(id, options, activeSet, placeholder){
  const active=activeSet.size>0;
  const label=active?[...activeSet].join(', '):placeholder;
  return`<div class="ms-wrap" id="ms-${id}">
    <div class="ms-trigger${active?' has-active':''}" onclick="toggleMs('${id}')">${label}</div>
    <div class="ms-dropdown" id="msd-${id}">
      ${options.map(o=>`<div class="ms-option${activeSet.has(o)?' selected':''}" onclick="toggleMsOpt('${id}','${o}')">
        <div class="ms-check">${activeSet.has(o)?'✓':''}</div>${o}
      </div>`).join('')}
      <div class="ms-clear" onclick="clearMs('${id}')">Limpiar filtro</div>
    </div>
  </div>`;
}
function toggleMs(id){
  // close others
  document.querySelectorAll('.ms-dropdown.open').forEach(d=>{if(d.id!=='msd-'+id)d.classList.remove('open');});
  document.getElementById('msd-'+id)?.classList.toggle('open');
}
function toggleMsOpt(id,val){
  if(filters.estados.has(val))filters.estados.delete(val);else filters.estados.add(val);
  render();
}
function clearMs(id){filters.estados.clear();render();}
// close dropdowns on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-dropdown.open').forEach(d=>d.classList.remove('open'));
});

function matchEstados(s){return filters.estados.size===0||filters.estados.has(s);}

// ── Dashboard ──

  const {proyectos,distribuidores,leads,facilities,tareas}=state;
  const total=proyectos.length;

  const ganados=proyectos.filter(p=>p.estado==='Ganado').length;
  const pctCerrado=total>0?Math.round(cerrados/total*100):0;
  const pctGanado=cerrados>0?Math.round(ganados/cerrados*100):0;
  const pip=proyectos.filter(p=>!['Ganado','Perdido'].includes(p.estado)).reduce((s,p)=>s+(Number(p.valor)||0),0);
  const gan=proyectos.filter(p=>p.estado==='Ganado').reduce((s,p)=>s+(Number(p.valor)||0),0);
  const pt=tareas.filter(t=>t.estado!=='Hecha').length;
  const at=tareas.filter(t=>t.prioridad==='Alta'&&t.estado!=='Hecha').length;

  const act=proyectos.filter(p=>p.estado==='Activo').sort((a,b)=>(Number(b.valor)||0)-(Number(a.valor)||0)).slice(0,8);
  return`
  <div class="topbar"><h1>Dashboard</h1><span style="font-size:10px;color:var(--textMuted)">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</span></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Pipeline</div><div class="stat-value" style="color:var(--accent)">${pip.toLocaleString('es-ES')}K€</div></div>
    <div class="stat-card"><div class="stat-label">Ganado</div><div class="stat-value" style="color:var(--success)">${gan.toLocaleString('es-ES')}K€</div></div>
    <div class="stat-card"><div class="stat-label">Proyectos</div><div class="stat-value">${total}</div><div class="stat-sub">${proyectos.filter(p=>p.estado==='Activo').length} activos</div></div>
    <div class="stat-card"><div class="stat-label">Distribuidores</div><div class="stat-value">${distribuidores.length}</div><div class="stat-sub">${distribuidores.filter(d=>d.estado==='Activo').length} activos</div></div>
    <div class="stat-card"><div class="stat-label">% Cerrado</div><div class="stat-value" style="color:var(--warning)">${pctCerrado}%</div><div class="stat-sub">${pctGanado}% de esos ganados</div></div>
    <div class="stat-card"><div class="stat-label">Tareas pend.</div><div class="stat-value" style="color:${at>0?'var(--warning)':'var(--text)'}">${pt}</div><div class="stat-sub">${at} urgentes</div></div>
  </div>
  <div class="pills-row">
    ${[['Leads',leads.length,'#1e3a6e','#93c5fd','leads'],['Proyectos',total,'#2e1065','#c4b5fd','proyectos'],['Distribuidores',distribuidores.length,'#042f2e','#5eead4','distribuidores'],['Facilities',facilities.length,'#451a03','#fbbf24','facilities']].map(([l,n,bg,c,v])=>`<button class="pill" style="background:${bg}" data-nav="${v}"><span class="pill-num" style="color:${c}">${n}</span><span class="pill-label" style="color:${c}">${l}</span></button>`).join('')}
  </div>
  <div class="dash-panels">
    <div class="dash-panel"><div class="dash-panel-title">Tareas urgentes</div>
      ${urg.length?urg.map(t=>{const vl=state.proyectos.find(x=>x.id===t.vinculoProjId);return`<div class="list-item" data-id="${t.id}" data-type="tarea" style="margin-bottom:3px"><div style="flex:1;min-width:0"><div class="item-name">${t.titulo}</div><div class="item-sub">${vl?vl.nombre+' · ':''}${t.fecha||''}</div></div>${bdg(t.estado)}</div>`;}).join(''):'<div class="empty" style="padding:16px">Sin tareas urgentes</div>'}
    </div>
    <div class="dash-panel"><div class="dash-panel-title">Proyectos activos — por valor</div>
      ${act.length?act.map(p=>`<div class="list-item" data-id="${p.id}" data-type="proyecto" style="margin-bottom:3px"><div style="flex:1;min-width:0"><div class="item-name">${p.nombre}</div><div class="item-sub">${p.facilityId?getFacilityName(p.facilityId):dNoms(p)}</div></div>${p.valor>0?`<span class="item-value">${fv(p.valor)}</span>`:''}</div>`).join(''):'<div class="empty" style="padding:16px">Sin proyectos activos</div>'}
    </div>
  </div>`;
}

// ── Proyectos ──
function rProyectos(){
  const opts=['Activo','Pendiente','Inactivo','Ganado','Perdido'];
  const f=state.proyectos.filter(p=>{
    if(!matchEstados(p.estado))return false;
    if(filters.distId&&!getDistIds(p).includes(filters.distId))return false;
    if(filters.search){const s=filters.search.toLowerCase();if(!p.nombre?.toLowerCase().includes(s)&&!dNoms(p).toLowerCase().includes(s))return false;}
    return true;
  });
  const tot=f.reduce((s,p)=>s+(Number(p.valor)||0),0);
  return`
  <div class="topbar"><h1>Proyectos</h1><div class="topbar-right">${tot>0?`<span style="font-size:11px;color:var(--textMuted);font-family:'DM Mono',monospace">${tot.toLocaleString('es-ES')}K€</span>`:''}<button class="btn-primary" id="btn-new">+ Nuevo</button></div></div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar proyecto o distribuidor..." value="${filters.search}">
    <select class="filter-input" id="f-dist" style="flex:0 1 200px">
      <option value="">Todos los distribuidores</option>
      ${state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(d=>`<option value="${d.id}"${filters.distId===d.id?' selected':''}>${d.nombre}</option>`).join('')}
    </select>
    ${msDropdown('proy-estado',opts,filters.estados,'Estado')}
  </div>
  <div class="list">${f.length?f.map(p=>{
    const sub=p.facilityId?getFacilityName(p.facilityId):dNoms(p);
    return`<div class="list-item${selectedItem?.id===p.id?' selected':''}" data-id="${p.id}" data-type="proyecto"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap"><span class="item-name">${p.nombre}</span>${bdg(p.estado)}</div><div class="item-sub">${sub}${p.modelo?' · '+p.modelo:''}</div></div>${p.valor>0?`<span class="item-value">${fv(p.valor)}</span>`:''}</div>`;
  }).join(''):'<div class="empty">No hay proyectos</div>'}</div>`;
}

// ── Tareas ──
function rTareas(){
  const opts=['Pendiente','En curso','Hecha'];
  const f=state.tareas.filter(t=>{
    if(!matchEstados(t.estado||'Pendiente'))return false;
    if(filters.search&&!t.titulo?.toLowerCase().includes(filters.search.toLowerCase()))return false;
    if(filters.distId&&t.vinculoDistId!==filters.distId)return false;
    return true;
  });
  const gs=['Alta','Media','Baja'].map(p=>({p,items:f.filter(t=>t.prioridad===p)})).filter(g=>g.items.length);
  return`

    }).join('')}
  </div></div>`).join('')}
  ${f.length===0?'<div class="empty">No hay tareas</div>':''}`;
}

function rDetail(item,type){
  const rows=pairs=>pairs.filter(([,v])=>v).map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  let h=`<div class="detail-header"><div><div class="detail-type">${type}</div><div class="detail-title">${item.nombre||item.empresa||item.titulo||''}</div></div><button class="close-btn" id="btn-close-detail">×</button></div>`;
  if(type==='proyecto'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.estado)}</div>`;
    h+=rows([['Distribuidores',dNoms(item)],['Facility',item.facilityId?getFacilityName(item.facilityId):''],['Modelo',item.modelo],['Valor est.',fv(item.valor)],['Prox. contacto',item.fecha]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    const tars=state.tareas.filter(t=>t.vinculoProjId===item.id);
    if(tars.length){h+=`<div class="detail-section"><span>Tareas</span></div>`;h+=tars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${t.titulo}</div><div class="mini-card-sub">${t.fecha||''}</div></div>${bdg(t.estado)}</div>`).join('');}
  }
  if(type==='distribuidor'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Activo')}</div>`;
    h+=rows([['Provincia/Zona',item.provincia]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    const projs=state.proyectos.filter(p=>getDistIds(p).includes(item.id));
    if(projs.length){h+=`<div class="detail-section"><span>Proyectos (${projs.length})</span></div>`;h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');}
  }
  if(type==='lead'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Nuevo')}</div>`;
    h+=rows([['Contacto',item.contacto],['Origen',item.origen]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
  }
  if(type==='facility'){
    h+=rows([['Zona/Provincia',item.zona]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
    // Contactos
    const conts=state.contactos.filter(c=>c.facilityId===item.id);
    h+=`<div class="detail-section"><span>Contactos</span><button class="btn-secondary btn-sm" id="btn-add-contacto">+ Añadir</button></div>`;
    if(conts.length)h+=conts.map(c=>`<div class="mini-card"><div class="mini-card-name">${c.nombre}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}</div></div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin contactos</div>`;
    // Proyectos
    const projs=state.proyectos.filter(p=>p.facilityId===item.id);
    h+=`<div class="detail-section"><span>Proyectos</span><button class="btn-secondary btn-sm" id="btn-add-proyecto-facility">+ Añadir</button></div>`;
    if(projs.length)h+=projs.map(p=>`<div class="mini-card clickable" data-proj-id="${p.id}" style="display:flex;justify-content:space-between;align-items:center" title="Doble clic para editar"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}${p.valor>0?' · '+fv(p.valor):''}</div></div>${bdg(p.estado)}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin proyectos</div>`;
  }
  if(type==='tarea'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.tipo||'')}${bdg(item.prioridad)}${bdg(item.estado)}</div>`;
    const vp=state.proyectos.find(x=>x.id===item.vinculoProjId);
    const vd=state.distribuidores.find(x=>x.id===item.vinculoDistId);
    if(vp)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vp.nombre}</div><div class="mini-card-sub">Proyecto</div></div>`;
    if(vd)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vd.nombre}</div><div class="mini-card-sub">Distribuidor</div></div>`;
    h+=rows([['Fecha límite',item.fecha]]);
    if(item.notas)h+=`<div class="detail-notes">${item.notas}</div>`;
  }
  h+=`<div class="detail-actions"><button class="btn-primary" id="btn-edit-detail">Editar</button><button class="btn-danger" id="btn-del-detail">Eliminar</button></div>`;
  return h;
}

// ── Modal ──
function openModal(type,item=null,presets={}){
  editingItem=item;
  const ov=document.createElement('div');ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=rModal(type,item,presets);
  document.body.appendChild(ov);
  bindML(type);
}
function closeModal(){document.getElementById('modal-overlay')?.remove();editingItem=null;}

function distSearchWidget(selected=[]){
  const sel=Array.isArray(selected)?selected:String(selected).split(',').map(s=>s.trim()).filter(Boolean);
  const opts=state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return`<div class="dist-search-wrap">
    <input class="dist-search-input" placeholder="Buscar distribuidor..." oninput="filterDistOpts(this.value)">
    <div class="dist-options" id="dist-opts-list">
      ${opts.map(d=>`<div class="dist-opt${sel.includes(d.id)?' checked':''}" data-dist-id="${d.id}" onclick="toggleDistOpt(this)"><div class="dc">${sel.includes(d.id)?'✓':''}</div>${d.nombre}</div>`).join('')}
    </div>
  </div>`;
}
function filterDistOpts(q){
  document.querySelectorAll('#dist-opts-list .dist-opt').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}
function toggleDistOpt(el){
  el.classList.toggle('checked');
  const dc=el.querySelector('.dc');
  dc.textContent=el.classList.contains('checked')?'✓':'';
}

function rModal(type,item,presets={}){
  const v={...presets,...(item||{})};
  const titles={lead:'Lead',proyecto:'Proyecto',distribuidor:'Distribuidor',facility:'Facility',tarea:'Tarea',contacto:'Contacto'};
  const title=(item?'Editar ':'Nuevo ')+titles[type];
  let fields='';

  if(type==='lead') fields=`<div class="form-grid">
    <div class="form-full form-group"><label class="form-label">Empresa <span>*</span></label><input class="form-input" name="empresa" value="${v.empresa||''}"></div>
    <div class="form-group"><label class="form-label">Contacto</label><input class="form-input" name="contacto" value="${v.contacto||''}"></div>
    <div class="form-group"><label class="form-label">Origen</label><select class="form-input" name="origen"><option>—</option>${['Web','Feria','Proveedor','Referido','Otro'].map(o=>`<option${v.origen===o?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Nuevo','Contactado','Calificado','Convertido','Descartado'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
  </div>`;

  if(type==='proyecto'){
    const selDist=v.distribuidorIds?Array.isArray(v.distribuidorIds)?v.distribuidorIds:String(v.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean):[];
    const facilOpts=state.facilities.map(f=>`<option value="${f.id}"${v.facilityId===f.id?' selected':''}>${f.nombre}</option>`).join('');
    fields=`<div class="form-grid">
      <div class="form-half form-group"><label class="form-label">Cliente / Proyecto <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Activo','Pendiente','Inactivo','Ganado','Perdido'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Modelo / Robot</label><input class="form-input" name="modelo" value="${v.modelo||''}"></div>
      <div class="form-group"><label class="form-label">Valor est. (K€)</label><input class="form-input" name="valor" type="number" value="${v.valor||''}"></div>
      <div class="form-group"><label class="form-label">Prox. contacto</label><input class="form-input" name="fecha" type="date" value="${v.fecha||''}"></div>
      <div class="form-group"><label class="form-label">Facility</label><select class="form-input" name="facilityId"><option value="">— Sin facility —</option>${facilOpts}</select></div>
      <div class="form-full form-group"><label class="form-label">Distribuidores <span style="color:var(--textMuted);font-weight:400;text-transform:none;font-size:10px">(busca y selecciona)</span></label>${distSearchWidget(selDist)}</div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
    </div>`;
  }

  if(type==='distribuidor') fields=`<div class="form-grid">
    <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
    <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Activo','Negociando','Empieza','Se raja','Inactivo'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-half form-group"><label class="form-label">Provincia / Zona</label><input class="form-input" name="provincia" value="${v.provincia||''}"></div>
    <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
  </div>`;

  if(type==='facility') fields=`<div class="form-grid">
    <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
    <div class="form-group"><label class="form-label">Provincia / Zona</label><input class="form-input" name="zona" value="${v.zona||''}"></div>
    <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
  </div>`;

  if(type==='contacto') fields=`<div class="form-grid">
    <div class="form-half form-group"><label class="form-label">Nombre <span>*</span></label><input class="form-input" name="nombre" value="${v.nombre||''}"></div>
    <div class="form-group"><label class="form-label">Cargo</label><input class="form-input" name="cargo" value="${v.cargo||''}"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" value="${v.email||''}"></div>
    <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" name="tel" value="${v.tel||''}"></div>
    <input type="hidden" name="facilityId" value="${v.facilityId||''}">
    <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="3" placeholder="Notas...">${v.notas||''}</textarea></div>
  </div>`;

  if(type==='tarea'){
    const distOpts=state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(d=>`<option value="${d.id}"${v.vinculoDistId===d.id?' selected':''}>${d.nombre}</option>`).join('');
    const projOpts=state.proyectos.map(p=>`<option value="${p.id}"${v.vinculoProjId===p.id?' selected':''}>${p.nombre}</option>`).join('');
    fields=`<div class="form-grid">
      <div class="form-full form-group"><label class="form-label">Tarea <span>*</span></label><input class="form-input" name="titulo" value="${v.titulo||''}"></div>
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-input" name="tipo">${['Llamada','Email','Reunión','Demo','Propuesta','Seguimiento','Otro'].map(o=>`<option${v.tipo===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Prioridad</label><select class="form-input" name="prioridad">${['Alta','Media','Baja'].map(o=>`<option${v.prioridad===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Pendiente','En curso','Hecha'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-half form-group"><label class="form-label">Distribuidor</label><select class="form-input" name="vinculoDistId"><option value="">— Sin vincular —</option>${distOpts}</select></div>
      <div class="form-half form-group"><label class="form-label">Proyecto</label><select class="form-input" name="vinculoProjId"><option value="">— Sin vincular —</option>${projOpts}</select></div>
      <div class="form-group"><label class="form-label">Fecha límite</label><input class="form-input" name="fecha" type="date" value="${v.fecha||''}"></div>
      <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
    </div>`;
  }

  return`<div class="modal"><div class="modal-header"><span class="modal-title">${title}</span><button class="close-btn" id="btn-close-modal">×</button></div>
    <form id="crm-form">${fields}
      <div class="form-actions"><button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form></div>`;
}

// ── Bind listeners ──
function bindL(){
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';render();await saveE('tareas');}
    });
  });
  const bn=document.getElementById('btn-new');
  if(bn)bn.addEventListener('click',()=>{const tm={leads:'lead',proyectos:'proyecto',distribuidores:'distribuidor',facilities:'facility',tareas:'tarea'};openModal(tm[currentView]||'tarea');});
  const fs=document.getElementById('f-search');
  if(fs)fs.addEventListener('input',e=>{filters.search=e.target.value;render();});
  const fd=document.getElementById('f-dist');
  if(fd)fd.addEventListener('change',e=>{filters.distId=e.target.value;render();});
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:''};closeDetail();render();
    });
  });
}

function bindDL(){
  document.getElementById('btn-close-detail')?.addEventListener('click',()=>{closeDetail();render();});
  document.getElementById('btn-edit-detail')?.addEventListener('click',()=>openModal(selectedType,selectedItem));
  document.getElementById('btn-del-detail')?.addEventListener('click',async()=>{
    if(!confirm('¿Eliminar?'))return;
    const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[selectedType];
    if(key){state[key]=state[key].filter(x=>x.id!==selectedItem.id);closeDetail();render();await saveE(key);}
  });
  document.getElementById('btn-add-contacto')?.addEventListener('click',()=>openModal('contacto',null,{facilityId:selectedItem?.id}));
  document.getElementById('btn-add-proyecto-facility')?.addEventListener('click',()=>openModal('proyecto',null,{facilityId:selectedItem?.id}));
  // Double-click on project mini-cards inside facility
  document.querySelectorAll('.mini-card.clickable[data-proj-id]').forEach(el=>{
    el.addEventListener('dblclick',()=>{
      const p=state.proyectos.find(x=>x.id===el.dataset.projId);
      if(p)openModal('proyecto',p);
    });
  });
}

function bindML(type){
  document.getElementById('btn-close-modal')?.addEventListener('click',closeModal);
  document.getElementById('btn-cancel-modal')?.addEventListener('click',closeModal);
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const data={};
    new FormData(form).forEach((v,k)=>data[k]=v);
    // multi distribuidor from search widget
    if(type==='proyecto'){
      const checked=[...form.querySelectorAll('.dist-opt.checked')].map(c=>c.dataset.distId);
      data.distribuidorIds=checked.join(',');
      data.valor=Number(data.valor)||0;
    }
    const km={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[type];if(!key)return;
    if(editingItem){
      Object.assign(editingItem,data);
      state[key]=state[key].map(x=>x.id===editingItem.id?editingItem:x);
      if(selectedItem?.id===editingItem.id)selectedItem=editingItem;
    } else {
      const px={lead:'L',proyecto:'P',distribuidor:'D',facility:'F',tarea:'T',contacto:'C'};
      data.id=genId(px[type]||'X');
      if(!data.fecha)data.fecha=today();
      state[key].push(data);
    }
    const facId=data.facilityId||editingItem?.facilityId;
    closeModal();
    if((type==='contacto'||type==='proyecto')&&facId){
      const fac=state.facilities.find(f=>f.id===facId);
      if(fac){openDetail(fac,'facility');}
    } else {
      closeDetail();
    }
    render();
    await saveE(key);
  });
}

loadAll();
</script>
