  <!-- KPIs -->
  <div class="stats-grid" style="margin-bottom:16px">
    <div class="stat-card"><div class="stat-label">Total robots</div><div class="stat-value" style="color:var(--accent)">${grandTotal}</div><div class="stat-sub">vs 243 en 2025</div></div>
    <div class="stat-card"><div class="stat-label">Importe ventas</div><div class="stat-value" style="color:var(--success)">${(importes.ventas/1000).toFixed(0)}K€</div></div>
    <div class="stat-card"><div class="stat-label">Importe compras</div><div class="stat-value" style="color:var(--warning)">${(importes.compras/1000).toFixed(0)}K€</div></div>
    <div class="stat-card"><div class="stat-label">Margen bruto</div><div class="stat-value" style="color:var(--success)">${importes.ventas>0?(((importes.ventas-importes.compras)/importes.ventas)*100).toFixed(0):0}%</div></div>
  </div>

  <!-- Gráfico mensual -->
  <div style="background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px">
    <div style="font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Robots vendidos por mes${fTrim?' — '+fTrim:''}</div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:110px">
      ${MESES_SHORT.map((m,i)=>{
        const v=monthFilt[i]||0;
        const max=Math.max(...monthFilt,1);
        const h=Math.max(v>0?6:2,Math.round((v/max)*95));
        const isQ=[2,5,8,11].includes(i);
        const dimmed=fTrim&&!mesIdxs.includes(i);
        return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;height:110px;justify-content:flex-end;${dimmed?'opacity:.3':''}">
          <span style="font-size:9px;color:${v>0?'var(--text)':'var(--textMuted)'};font-family:'DM Mono',monospace">${v||''}</span>
          <div style="width:100%;height:${h}px;background:${isQ?'#1e3a6e':'var(--accentSoft)'};border-radius:3px 3px 0 0;border-top:2px solid ${isQ?'#93c5fd':'var(--accent)'}"></div>
          <span style="font-size:9px;color:var(--textMuted)">${m}</span>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--textMuted)">
      ${['Q1','Q2','Q3','Q4'].map(q=>`<span style="cursor:pointer" onclick="toggleVFiltTrim('${q}')">${q}: <span style="color:${fTrim===q?'var(--accent)':'var(--text)'};font-family:'DM Mono',monospace">${qTotals[q]}</span></span>`).join('')}
    </div>
  </div>

  <!-- Tabla por distribuidor -->
  <div style="background:var(--bgCard);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em">Ventas por distribuidor${distFiltrada.length<dist.length?' ('+distFiltrada.length+' de '+dist.length+')':''}</span>
      <div style="display:flex;gap:6px">
        ${Object.entries(catColors).map(([cat,[bg,c]])=>`<span style="font-size:11px;background:${bg};color:${c};padding:3px 10px;border-radius:4px;font-weight:500">${cat}</span>`).join('')}
      </div>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:var(--bgSurface)">
            <th style="padding:10px 14px;text-align:left;color:var(--textMuted);font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--bgSurface)">#</th>
            <th style="padding:10px 14px;text-align:left;color:var(--textMuted);font-weight:500;white-space:nowrap;position:sticky;left:28px;background:var(--bgSurface)">Distribuidor</th>
            ${Object.entries(catColors).map(([cat,[bg,c]])=>
              MODELOS_CAT[cat].filter(m=>modsFiltrados.includes(m)).map(m=>`<th style="padding:8px 10px;text-align:center;color:${c};font-weight:600;background:${bg};white-space:nowrap;font-size:11px">${m}</th>`).join('')
            ).join('')}
            <th style="padding:10px 14px;text-align:center;color:var(--text);font-weight:600;background:var(--bgSurface)">TOTAL</th>
          </tr>
        </thead>
        <tbody>
          ${distConTotal.map((d,i)=>`
            <tr style="border-bottom:1px solid var(--border);${i%2===0?'':'background:var(--bgSurface)'}">
              <td style="padding:9px 14px;color:var(--textMuted);position:sticky;left:0;background:${i%2===0?'var(--bgCard)':'var(--bgSurface)'}">${i+1}</td>
              <td style="padding:9px 14px;color:var(--text);font-weight:500;white-space:nowrap;position:sticky;left:28px;background:${i%2===0?'var(--bgCard)':'var(--bgSurface)'}">
                <span onclick="openEditVentaDist(${dist.indexOf(dist.find(x=>x.dist===d.dist))})" style="cursor:pointer;border-bottom:1px dashed var(--border)" title="Editar">${d.dist}</span>
              </td>
              ${modsFiltrados.map(m=>{
                const v=fTrim?mesIdxs.reduce((s,idx)=>s+(Number((mensual[m]||[])[idx])||0),0):(Number(d[m])||0);
                return`<td style="padding:9px 10px;text-align:center;color:${v>0?'var(--text)':'var(--textMuted)'};font-family:'DM Mono',monospace">${v||'·'}</td>`;
              }).join('')}
              <td style="padding:9px 14px;text-align:center;font-weight:700;color:${d.total>0?'var(--accent)':'var(--textMuted)'};font-family:'DM Mono',monospace">${d.total}</td>
            </tr>`).join('')}
          <tr style="background:var(--bgSurface);border-top:2px solid var(--border)">
            <td colspan="2" style="padding:10px 14px;color:var(--text);font-weight:600;position:sticky;left:0;background:var(--bgSurface)">TOTAL</td>
            ${modsFiltrados.map(m=>`<td style="padding:10px;text-align:center;font-weight:600;color:${(modelTotals[m]||0)>0?'var(--accent)':'var(--textMuted)'};font-family:'DM Mono',monospace">${modelTotals[m]||'·'}</td>`).join('')}
            <td style="padding:10px 14px;text-align:center;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace">${grandTotal}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Stock -->
  <div style="background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:80px">
    <div style="font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between">
      <span>Stock actual</span>
      <button class="btn-secondary" style="font-size:10px;padding:3px 8px" onclick="openStockModal()">Editar stock</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${TODOS_MOD.filter(m=>modsFiltrados.includes(m)).map(m=>{
        const s=Number(stock[m])||0;
        return`<div style="background:${s>5?'var(--bgSurface)':s>0?'var(--warningSoft)':'var(--dangerSoft)'};border:1px solid ${s>5?'var(--border)':s>0?'var(--warning)':'var(--danger)'};border-radius:6px;padding:8px 12px;text-align:center;min-width:70px">
          <div style="font-size:18px;font-weight:700;font-family:'DM Mono',monospace;color:${s>5?'var(--text)':s>0?'var(--warning)':'var(--danger)'}">${s}</div>
          <div style="font-size:9px;color:var(--textMuted);margin-top:2px">${m}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderVentas(){
  if(currentView==='ventas'){
    document.getElementById('content').innerHTML=rVentas();
    bindL();
  }
}

function toggleVFiltCat(cat){
  if(!window._vFiltCat)window._vFiltCat=new Set();
  if(window._vFiltCat.has(cat))window._vFiltCat.delete(cat);
  else window._vFiltCat.add(cat);
  window._vFiltMod=new Set(); // reset model filter when cat changes
  renderVentas();
}
function toggleVFiltTrim(q){
  window._vFiltTrim=(window._vFiltTrim===q)?null:q;
  renderVentas();
}
function toggleVFiltDist(d){
  if(!window._vFiltDist)window._vFiltDist=new Set();
  if(window._vFiltDist.has(d))window._vFiltDist.delete(d);
  else window._vFiltDist.add(d);
  renderVentas();
}
function clearVFiltros(){
  window._vFiltDist=new Set();
  window._vFiltCat=new Set();
  window._vFiltMod=new Set();
  window._vFiltTrim=null;
  renderVentas();
}

function openVentasModal(){
  const dist = getVentasDist();
  const distOpts = dist.map((d,i)=>`<option value="${i}">${d.dist}</option>`).join('');
  const modelOpts = TODOS_MOD.map(m=>`<option value="${m}">${m}</option>`).join('');
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=`<div class="modal" style="max-width:420px">
    <div class="modal-header"><span class="modal-title">Añadir venta</span><button class="close-btn" id="btn-close-modal">×</button></div>
    <form id="crm-form">
      <div class="form-group"><label class="form-label">Distribuidor <span>*</span></label><select class="form-input" name="distIdx">${distOpts}</select></div>
      <div class="form-group"><label class="form-label">Modelo <span>*</span></label><select class="form-input" name="modelo">${modelOpts}</select></div>
      <div class="form-group"><label class="form-label">Mes</label><select class="form-input" name="mes">${MESES_SHORT.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Cantidad <span>*</span></label><input class="form-input" name="cantidad" type="number" min="1" value="1"></div>
      <div class="form-actions"><button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('btn-close-modal')?.addEventListener('click',()=>ov.remove());
  document.getElementById('btn-cancel-modal')?.addEventListener('click',()=>ov.remove());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const data=new FormData(e.target);
    const idx=Number(data.get('distIdx'));
    const modelo=data.get('modelo');
    const mes=Number(data.get('mes'));
    const cant=Number(data.get('cantidad'))||1;
    const dist=getVentasDist();
    dist[idx][modelo]=(Number(dist[idx][modelo])||0)+cant;
    if(!state.ventas)state.ventas={};
    state.ventas.dist=dist;
    // Also update monthly
    const mensual=getVentasMensual();
    if(!mensual[modelo])mensual[modelo]=Array(12).fill(0);
    mensual[modelo][mes]=(Number(mensual[modelo][mes])||0)+cant;
    state.ventas.mensual=mensual;
    ov.remove();
    render();
    await saveVentas();
  });
}

function openStockModal(){
  const stock=getStock();
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=`<div class="modal" style="max-width:500px">
    <div class="modal-header"><span class="modal-title">Editar stock</span><button class="close-btn" id="btn-close-modal">×</button></div>
    <form id="crm-form">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        ${TODOS_MOD.map(m=>`<div class="form-group"><label class="form-label" style="font-size:10px">${m}</label><input class="form-input" name="${m}" type="number" min="0" value="${Number(stock[m])||0}"></div>`).join('')}
      </div>
      <div class="form-actions"><button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('btn-close-modal')?.addEventListener('click',()=>ov.remove());
  document.getElementById('btn-cancel-modal')?.addEventListener('click',()=>ov.remove());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const data=new FormData(e.target);
    const newStock={};
    TODOS_MOD.forEach(m=>newStock[m]=Number(data.get(m))||0);
    if(!state.ventas)state.ventas={};
    state.ventas.stock=newStock;
    ov.remove();render();await saveVentas();
  });
}

function openEditVentaDist(idx){
  const dist=getVentasDist();
  const d=dist[idx];
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=`<div class="modal" style="max-width:600px">
    <div class="modal-header"><span class="modal-title">Editar — ${d.dist}</span><button class="close-btn" id="btn-close-modal">×</button></div>

let _importRows=[];
function previewImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const data=new Uint8Array(ev.target.result);
    if(typeof XLSX==='undefined'){
      document.getElementById('import-preview').innerHTML='<span style="color:var(--danger)">Error: librería XLSX no disponible</span>';return;
    }
    const wb=XLSX.read(data,{type:'array'});
    const rows=[];
    wb.SheetNames.forEach(sn=>{
      const ws=wb.Sheets[sn];
      const json=XLSX.utils.sheet_to_json(ws,{defval:''});
      rows.push(...json);
    });
    _importRows=rows;
    const empresaKey=Object.keys(rows[0]||{}).find(k=>k.toUpperCase().includes('EMPRESA'))||'EMPRESA';
    const valid=rows.filter(r=>r[empresaKey]||r['EMPRESA ']);
    document.getElementById('import-preview').innerHTML=`<span style="color:var(--success)">✓ ${valid.length} leads encontrados en ${wb.SheetNames.length} hoja(s)</span>`;
  };
  reader.readAsArrayBuffer(file);
}

function doImportLeads(){
  if(!_importRows.length){showToast('Primero selecciona un archivo');return;}
  const estado=document.getElementById('import-estado').value;
  const origen=document.getElementById('import-origen').value;
  const normalize=k=>k.trim().toUpperCase().replace(/[^A-Z]/g,'');
  let count=0;
  _importRows.forEach(row=>{
    const keys=Object.keys(row);
    const get=(...terms)=>{
      const k=keys.find(k=>terms.some(t=>normalize(k).includes(t)));
      return k?String(row[k]||'').trim():'';
    };
    const empresa=get('EMPRESA');
    if(!empresa)return;
    const lead={
      id:genId('L'),
      empresa,
      contacto:get('CONTACTO','NOMBRE'),
      tel:get('TELEFONO','TELEF','TEL','MOVIL'),
      email:get('EMAIL','MAIL','CORREO'),
      zona:get('ZONA','PROVINCIA','REGION'),
      notas:get('OBSERVACIONES','NOTAS','OBS','COMENTARIOS'),
      origen,
      estado,
      prioridad:'',tipo:'',fechaProxContacto:'',comercialId:'',distribuidorId:'',
      fecha:today()
    };
    state.leads.push(lead);
    count++;
  });
  saveE('leads');
  document.getElementById('modal-overlay').remove();
  showToast(count+' leads importados');
  render();
}

function getDriveToken(){
  return new Promise((resolve,reject)=>{
    if(driveToken){resolve(driveToken);return;}
    const client=google.accounts.oauth2.initTokenClient({
      client_id:DRIVE_CLIENT_ID,
      scope:DRIVE_SCOPE,
      callback:(resp)=>{
        if(resp.error){reject(new Error(resp.error));return;}
        driveToken=resp.access_token;
        resolve(driveToken);
      }
    });
    client.requestAccessToken();
  });
}

function globalSearch(q){
  const res=document.getElementById('gresults');
  const clr=document.getElementById('gs-clear');
  if(clr) clr.classList.toggle('visible', q&&q.length>0);
  if(!q||q.length<2){res.classList.remove('open');return;}
  const ql=q.toLowerCase();
  const sections=[
    {label:'Leads',items:state.leads,icon:'◎',getName:x=>x.empresa||'',getSub:x=>x.contacto||x.zona||'',type:'lead'},
    {label:'Proyectos',items:state.proyectos,icon:'◈',getName:x=>x.nombre||'',getSub:x=>x.estado||'',type:'proyecto'},
    {label:'Distribuidores',items:state.distribuidores,icon:'◉',getName:x=>x.nombre||'',getSub:x=>x.provincia||'',type:'distribuidor'},
    {label:'Facilities',items:state.facilities,icon:'⬡',getName:x=>x.nombre||'',getSub:x=>x.zona||'',type:'facility'},
    {label:'Tareas',items:state.tareas,icon:'✓',getName:x=>x.titulo||'',getSub:x=>x.estado||'',type:'tarea'},
    {label:'Contactos',items:state.contactos||[],icon:'·',getName:x=>x.nombre||'',getSub:x=>x.cargo||'',type:'contacto'},
  ];
  let html=''; let total=0;
  sections.forEach(s=>{
    const hits=(s.items||[]).filter(x=>(s.getName(x)+' '+(s.getSub(x)||'')+(x.notas||'')).toLowerCase().includes(ql)).slice(0,4);
    if(!hits.length)return;
    total+=hits.length;
    html+=`<div class="gr-section"><div class="gr-label">${s.label}</div>`;
    hits.forEach(x=>{
      html+=`<div class="gr-item" onmousedown="gotoItem('${s.type}','${x.id}')">
        <span class="gr-icon">${s.icon}</span>
        <span class="gr-item-name">${s.getName(x)}</span>
        <span class="gr-item-sub">${s.getSub(x)}</span>
      </div>`;
    });
    html+='</div>';
  });
  if(!total) html='<div class="gr-empty">Sin resultados para "${q}"</div>';
  res.innerHTML=html;
  res.classList.add('open');
}

function gotoItem(type,id){
  const map={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
  const viewMap={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
  const item=(state[map[type]]||[]).find(x=>x.id===id);
  if(!item)return;
  // Switch to the right view
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-view="'+viewMap[type]+'"]')?.classList.add('active');
  currentView=viewMap[type];filters=getDefaultFilters(currentView);
  selectedItem=item;selectedType=type;
  render();openDetail(item,type);
  document.getElementById('gsearch').value='';
  document.getElementById('gresults').classList.remove('open');
}

async function doBackup(){
  const btn=document.querySelector('button[onclick="doBackup()"]');
  if(btn){btn.textContent='⏳ Guardando...';btn.disabled=true;}
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas','ventas'];
    const backup={};
    ents.forEach(e=>{backup[e]=state[e]||[];});
    backup._fecha=new Date().toISOString();
    const jsonStr=JSON.stringify(backup,null,2);
    const token=await getDriveToken();
    const fecha=new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    const filename='CRM_Firebase_backup_'+fecha+'.json';
    const metadata={name:filename,mimeType:'application/json',parents:[BACKUP_FOLDER_ID]};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
    form.append('file',new Blob([jsonStr],{type:'application/json'}));
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{Authorization:'Bearer '+token},
      body:form
    });
    if(!res.ok)throw new Error('Drive error: '+res.status);
    showToast('✅ Backup guardado en Drive');
  }catch(e){
    driveToken=null;
    showToast('❌ Error: '+e.message);
  }finally{
    if(btn){btn.textContent='💾 Backup Drive';btn.disabled=false;}
  }
}
