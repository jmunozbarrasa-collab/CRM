<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Muzybar Robotics</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CRM Robots">
<link rel="manifest" href="/manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Barlow:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414;--bgCard:#1a1a1a;--bgSurface:#1e1e1e;--bgHover:#222222;
  --border:#282828;--borderHover:#383838;
  --accent:#b5c832;--accentSoft:#1a2200;
  --success:#b5c832;--successSoft:#1a2200;
  --warning:#f59e0b;
  --danger:#ef4444;
  --text:#efefef;--textMuted:#505050;--textSub:#686868;
  --mono:'Outfit',sans-serif;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
input,select,textarea,button{font-family:'DM Sans',sans-serif}

.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--bgCard);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100}
.main{flex:1;margin-left:200px;overflow:auto;transition:margin-right .2s}
.main.panel-open{margin-right:380px}
.content{padding:24px 28px}

.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--text);text-transform:uppercase}
.sidebar-sub{font-size:10px;color:var(--textMuted);margin-top:2px}
.sidebar-nav{padding:6px 0;flex:1}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 16px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--textMuted);font-size:13px;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bgSurface);color:var(--textSub)}
.nav-btn.active{background:var(--bgSurface);color:var(--text);border-left-color:#b5c832}
.nav-icon{font-size:13px;width:16px;text-align:center}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:800;font-family:'Barlow',sans-serif}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn-primary{background:var(--accent);border:none;border-radius:5px;padding:7px 16px;color:#fff;cursor:pointer;font-size:12px;font-weight:500;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.btn-secondary:hover{border-color:var(--borderHover);color:var(--textSub)}
.btn-danger{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:#ef4444;cursor:pointer;font-size:12px}
.btn-sm{padding:4px 10px;font-size:11px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.stat-card{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:600;font-family:'Barlow',sans-serif;line-height:1}
.stat-sub{font-size:10px;color:var(--textMuted);margin-top:4px}

.pills-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:8px}
.pill:hover{opacity:.8}
.pill-num{font-size:18px;font-weight:800;font-family:'Barlow',sans-serif}
.pill-label{font-size:11px;opacity:.8}

/* Filter bar */
.filter-bar{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:#b5c832}
.filter-search{flex:1 1 160px}

/* Multiselect dropdown */
.ms-wrap{position:relative;display:inline-block}
.ms-trigger{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 28px 6px 10px;color:var(--textSub);font-size:12px;cursor:pointer;white-space:nowrap;min-width:130px;position:relative;user-select:none;transition:border-color .15s}
.ms-trigger:hover{border-color:var(--borderHover)}
.ms-trigger.has-active{border-color:#b5c832;color:#93c5fd;background:var(--accentSoft)}
.ms-trigger::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--textMuted)}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:180px;background:var(--bgCard);border:1px solid var(--border);border-radius:7px;z-index:500;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.ms-dropdown.open{display:block}
.ms-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.ms-option:hover{background:var(--bgSurface);color:var(--text)}
.ms-option.selected{color:var(--text)}
.ms-check{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.ms-option.selected .ms-check{background:var(--accent);border-color:#b5c832;color:#fff}
.ms-clear{margin-top:4px;padding-top:6px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--textMuted);cursor:pointer;padding-bottom:2px}
.ms-clear:hover{color:var(--text)}

/* List */
.list{display:flex;flex-direction:column;gap:4px}
.list-item{background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.list-item:hover{border-color:var(--borderHover);background:var(--bgHover)}
.list-item.selected{background:var(--bgSurface);border-color:#b5c832}
.item-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:12px;color:var(--textMuted);margin-top:2px}
.item-value{font-size:12px;color:#b5c832;font-family:'Barlow',sans-serif;font-weight:700;white-space:nowrap}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}
.prio-group{margin-bottom:18px}
.prio-header{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bgCard);border-left:1px solid var(--border);z-index:200;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .2s}
.detail-panel.open{transform:translateX(0)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.detail-title{font-size:16px;font-weight:600;margin-top:3px;line-height:1.3}
.detail-type{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em}
.close-btn{background:none;border:none;color:var(--textMuted);cursor:pointer;font-size:20px;line-height:1;padding:0;flex-shrink:0}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.detail-key{font-size:11px;color:var(--textMuted);flex-shrink:0}
.detail-val{font-size:11px;color:var(--textSub);max-width:220px;text-align:right;word-break:break-word}
.detail-notes{font-size:12px;color:#c4b5fd;margin-top:10px;line-height:1.7;padding:12px;background:#1a0f30;border:1px solid #2e1065;border-radius:6px}
.detail-section{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-top:16px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.detail-actions{display:flex;gap:6px;margin-top:18px}
.detail-actions .btn-primary{flex:1;text-align:center}
.mini-card{padding:7px 9px;background:var(--bgSurface);border-radius:5px;margin-bottom:5px;cursor:default}
.mini-card.clickable{cursor:pointer;transition:border-color .15s;border:1px solid transparent}
.mini-card.clickable:hover{border-color:#b5c832;background:var(--bgHover)}
.mini-card-name{font-size:12px;font-weight:500}
.mini-card-sub{font-size:10px;color:var(--textMuted);margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.form-full{grid-column:1/-1}
.form-half{grid-column:span 2}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:10px;color:var(--textMuted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.form-label span{color:#ef4444}
.form-input{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:#b5c832}
.form-notes{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;resize:none;line-height:1.6;min-height:80px;transition:height .2s;overflow:hidden}
.form-notes:focus{border-color:var(--textMuted)}
.form-notes::placeholder{color:#4a3a70}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Dist search in modal */
.dist-search-wrap{background:var(--bgSurface);border:1px solid #4a4a4a;border-left:3px solid #b5c832;border-radius:5px;overflow:hidden}
.dist-search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:7px 10px;color:var(--text);font-size:12px;outline:none}
.ss-wrap{background:var(--bgSurface);border:1px solid #4a4a4a;border-left:3px solid #b5c832;border-radius:5px;overflow:hidden}
.ss-search{width:100%;background:transparent;border:none;padding:7px 10px;color:var(--text);font-size:12px;outline:none}
.ss-list{max-height:140px;overflow-y:auto;display:none}
.ss-list.open{display:block;border-top:1px solid var(--border)}
.ss-opt{padding:7px 10px;font-size:12px;cursor:pointer;color:var(--textMuted)}
.ss-opt:hover,.ss-opt.selected{background:var(--bgCard);color:var(--text)}
.ss-opt.selected{color:#b5c832}
.dist-options{max-height:140px;overflow-y:auto;padding:4px}
.dist-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.dist-opt:hover{background:var(--bgHover);color:var(--text)}
.dist-opt.checked{color:var(--text)}
.dist-opt .dc{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.dist-opt.checked .dc{background:var(--accent);border-color:#b5c832;color:#fff}

/* Dashboard */
.dash-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-panel{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px}
.dash-panel-title{font-size:10px;font-weight:500;color:var(--textMuted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--textMuted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:#b5c832;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:9px 18px;font-size:12px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px;color:var(--textMuted);font-size:12px}
.mark-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--textMuted);cursor:pointer;font-size:10px;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.mark-btn.done{background:var(--successSoft);border-color:#b5c832;color:#b5c832}
.demo-btn{border:1px solid var(--border);border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-weight:500;background:none;color:var(--textMuted)}
.demo-btn.active{background:#042f2e;border-color:#2dd4bf;color:#2dd4bf}
.demo-btn:hover{border-color:var(--borderHover)}
/* Calendar */
.cal-wrap{background:var(--bgCard);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.cal-title{font-size:14px;font-weight:600;color:var(--text)}
.cal-nav{display:flex;gap:6px}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--borderHover);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;padding:8px 4px;font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.cal-day{height:90px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;vertical-align:top;overflow:hidden}
.cal-day:nth-child(7n){border-right:none}
.cal-day.other-month .cal-day-num{color:var(--textMuted);opacity:.3}
.cal-day.today{background:var(--accentSoft)}
.cal-day.today .cal-day-num{color:#b5c832;font-weight:600}
.cal-day-num{font-size:11px;color:var(--textSub);margin-bottom:3px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:opacity .15s}
.cal-event:hover{opacity:.8}
.cal-event.demo{background:#042f2e;color:#2dd4bf;font-weight:600;border-left:2px solid #2dd4bf}
.cal-event.tarea{background:#1a1000;color:#fbbf24}
.cal-event.proyecto{background:#1e3a6e;color:#93c5fd}
.cal-event.lead{background:#2e1065;color:#c4b5fd}
/* Notes expand modal */
.notes-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.notes-modal{background:var(--bgCard);border:1px solid #2e1065;border-radius:12px;width:100%;max-width:700px;padding:24px;display:flex;flex-direction:column;gap:12px}
.notes-modal-header{display:flex;justify-content:space-between;align-items:center}
.notes-modal-title{font-size:13px;color:var(--textMuted);font-weight:500}
.notes-modal textarea{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:6px;padding:14px;color:var(--text);font-size:13px;outline:none;resize:none;line-height:1.7;height:320px;font-family:'DM Sans',sans-serif}
.notes-modal textarea:focus{border-color:var(--borderHover)}
.notes-expand-btn{background:none;border:none;color:var(--textMuted);cursor:pointer;font-size:11px;padding:0;opacity:.7;transition:opacity .15s}
.notes-expand-btn:hover{opacity:1}

@media(max-width:768px){
  .sidebar{width:52px}
  .sidebar-logo,.sidebar-sub,.nav-label,.sidebar-footer div{display:none}
  .nav-btn{padding:10px;justify-content:center}
  .main{margin-left:52px}
  .main.panel-open{margin-right:0}
  .detail-panel{width:100%;top:auto;height:75vh}
  .dash-panels{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .form-half{grid-column:1/-1}
}

/* ── Global Search ── */
.global-search-wrap{position:relative;flex:1;max-width:300px}
.global-search{width:100%;background:transparent;border:none;border-bottom:1.5px solid #2a2a2a;padding:5px 24px 5px 24px;color:var(--text);font-size:12px;outline:none;transition:border-color .2s;letter-spacing:.01em}
.global-search:focus{border-bottom-color:#b5c832}
.global-search::placeholder{color:#3a3a3a;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.global-search-icon{position:absolute;left:2px;top:50%;transform:translateY(-50%);color:#333;font-size:13px;pointer-events:none;transition:color .2s}
.global-search-wrap:focus-within .global-search-icon{color:#b5c832}
.gs-clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;color:#444;font-size:13px;cursor:pointer;padding:0 2px;display:none;line-height:1}
.gs-clear.visible{display:block}
.global-results{position:absolute;top:calc(100% + 12px);left:-16px;width:380px;background:#141414;border:1px solid #222;border-radius:10px;z-index:500;max-height:400px;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.7);display:none}
.global-results.open{display:block}
.gr-section{padding:4px 0}
.gr-section+.gr-section{border-top:1px solid #1a1a1a}
.gr-label{padding:8px 14px 4px;font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.gr-item{padding:7px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.gr-item:hover{background:#1e1e1e}
.gr-icon{font-size:11px;color:#444;flex-shrink:0;width:14px;text-align:center}
.gr-item-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}
.gr-item-sub{font-size:11px;color:#444;flex-shrink:0;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-empty{padding:24px 14px;font-size:12px;color:#333;text-align:center}

/* ── KANBAN TAREAS ── */
.kanban-wrap{display:flex;gap:12px;padding:12px 16px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 120px)}
.kanban-col{flex:0 0 280px;background:var(--bgCard);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.kanban-col-header{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.kanban-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--textMuted)}
.kanban-col-count{font-size:11px;color:var(--textMuted);background:var(--bgSurface);padding:1px 7px;border-radius:10px}
.kanban-col-body{padding:8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:60px}
.kanban-col-body.drag-over{background:rgba(249,115,22,.06);border-radius:6px}
.kanban-card{background:var(--bgSurface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;cursor:grab;transition:box-shadow .15s,opacity .15s;user-select:none}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.3);border-color:#333}
.kanban-card.dragging{opacity:.4;cursor:grabbing}
.kanban-card-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.4}
.kanban-card-sub{font-size:11px;color:var(--textMuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanban-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.kanban-card-done{text-decoration:line-through;opacity:.5}
.kanban-add-btn{width:100%;background:transparent;border:1px dashed #2a2a2a;color:var(--textMuted);padding:7px;border-radius:5px;font-size:11px;cursor:pointer;transition:all .15s;margin-top:4px;flex-shrink:0}
.kanban-add-btn:hover{border-color:#444;color:var(--text)}

/* ── Carbon: Monospace titles & badges ── */
.section-title,.view-title,h1{font-family:'Barlow',sans-serif !important;font-weight:800 !important;letter-spacing:-.01em !important}
h2,h3{font-family:'Barlow',sans-serif !important;font-weight:700}
.badge,.filter-pill{font-family:'Outfit',sans-serif;font-size:10px;font-weight:500}
.topbar{border-bottom:1px solid var(--border);background:var(--bgCard)}
.nav-btn.active{color:#b5c832;border-left:2px solid var(--accent)}
.list-item{border-bottom:1px solid var(--border)}
.list-item:hover{background:#0f0f0f}
.list-item.selected{background:#0f0f0f;border-left:2px solid var(--accent);padding-left:14px}
.item-name{font-size:13px;font-weight:500}
.item-sub{font-size:11px;color:var(--textMuted)}
.sidebar{border-right:1px solid var(--border)}
.nav-btn{border-radius:0;border-left:2px solid transparent;font-size:12px;letter-spacing:.01em}
.detail-panel{border-left:1px solid var(--border)}
.modal-card,.form-input,.form-notes{background:var(--bgSurface);border-color:var(--border)}
.form-label{font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--textMuted)}
.btn-primary{background:var(--accent);color:#000;font-family:'Outfit',sans-serif;font-weight:600;border:none}
.btn-primary:hover{background:#c8d838}
.btn-secondary{font-family:'Outfit',sans-serif;font-size:12px;border-color:var(--border);color:var(--textMuted)}
.kanban-col-title{font-family:'Barlow',sans-serif !important;font-weight:800 !important;font-size:11px !important;letter-spacing:-.01em !important;text-transform:uppercase !important}
.kanban-card-title{font-size:12px}
.kanban-card{border-color:var(--border);background:var(--bgSurface)}
.kanban-card:hover{border-color:#2a2a2a;background:#131313}
.stat-card{background:var(--bgCard);border:1px solid var(--border);border-radius:4px}
/* Section title prefix */
.content-header::before,.section-header-title::before{content:'// ';color:var(--textMuted);font-family:var(--mono)}


/* ── Rich Notes Editor ── */
.notes-toolbar{display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--bgSurface);border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0}
.notes-toolbar button{background:transparent;border:none;color:var(--textMuted);padding:3px 7px;border-radius:3px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;line-height:1.4;transition:all .1s}
.notes-toolbar button:hover{background:var(--bgHover);color:var(--text)}
.notes-sep{width:1px;height:14px;background:var(--border);margin:0 3px}
.form-notes-rich{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-top:none;border-radius:0 0 5px 5px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;line-height:1.7;min-height:80px;max-height:320px;overflow-y:auto;transition:min-height .2s;box-sizing:border-box}
.form-notes-rich:focus{border-color:var(--borderHover);min-height:160px}
.form-notes-rich:empty:before{content:attr(data-placeholder);color:var(--textMuted);pointer-events:none}
.app-topbar{height:44px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bgCard);flex-shrink:0}

/* ── Read-only mode ── */
body.readonly .btn-primary,
body.readonly .btn-secondary:not(#btn-logout),
body.readonly [id^="btn-new"],
body.readonly .kanban-add-btn,
body.readonly .mark-btn,
body.readonly [onclick*="openModal"],
body.readonly [onclick*="deleteItem"],
body.readonly [onclick*="toggleHot"],
body.readonly [onclick*="toggleFacilTag"],
body.readonly [onclick*="toggleDemo"],
body.readonly [onclick*="dropTask"],
body.readonly [onclick*="dropProyecto"],
body.readonly .gs-clear,
body.readonly #btn-backup
{ display:none !important }
body.readonly .kanban-card{ cursor:default !important }
body.readonly [onclick*='toggle'], body.readonly [onclick*='openModal']{pointer-events:none !important}
body.readonly .list-item{ cursor:default !important }
body.readonly .readonly-badge{display:flex !important}
.readonly-badge{display:none;background:#1a2200;border:1px solid #b5c832;color:#b5c832;font-size:10px;padding:3px 10px;border-radius:3px;font-family:'Outfit',sans-serif;align-items:center;gap:5px}

.pac-item:hover { background: var(--bgSurface) !important; }

function isDemo(p){return p.demo==='true'||p.demo===true||String(p.demo).toUpperCase()==='TRUE';}
function normalizeDate(d){
  if(!d||d==='')return '';
  const s=String(d).trim();
  // Already yyyy-MM-dd
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // Try parsing any date string
  const parsed=new Date(s);
  if(!isNaN(parsed.getTime())){
    const y=parsed.getFullYear();
    const mo=String(parsed.getMonth()+1).padStart(2,'0');
    const day=String(parsed.getDate()).padStart(2,'0');
    return y+'-'+mo+'-'+day;
  }
  return '';
}

async function loadAll(){
  setSyncStatus('⟳ Conectando...');
  document.getElementById('content').innerHTML='<div style="color:#888;padding:32px;font-size:13px">Conectando con Firebase...</div>';
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas','ventas','pedidos'];
    setSyncStatus('⟳ Cargando datos...');
    const results=await Promise.all(ents.map(e=>db.collection(e).doc('data').get()));
    ents.forEach((e,i)=>{
      const doc=results[i];
      state[e]=doc.exists?(doc.data().items||[]):[];
      if(e==='proyectos')state[e]=state[e].map(p=>({
        ...p,
        valor:Number(p.valor)||0,
        demo:isDemo(p)?'true':'false',
        fechaDemo:p.fechaDemo?normalizeDate(p.fechaDemo):''
      }));
    });
    if(state.distribuidores.length===0&&state.proyectos.length===0){
      state=JSON.parse(JSON.stringify(SEED));
      await Promise.all(Object.keys(SEED).map(e=>
        db.collection(e).doc('data').set({items:state[e]})
      ));
      showToast('Primera carga — datos iniciales');
    }
    // Auto-Frío: proyectos sin actualizar en 14+ días
    const now = Date.now();
    const DIAS_FRIO = 14 * 24 * 60 * 60 * 1000;
    let frio_changed = false;
    state.proyectos.forEach(p=>{
      if(['Ganado','Perdido','Frío'].includes(p.estado)) return;
      if(p.updatedAt){
        const diff = now - new Date(p.updatedAt).getTime();
        if(diff > DIAS_FRIO){ p.estado='Frío'; frio_changed=true; }
      }
    });
    // Migrate: Inactivo → Frío
    state.proyectos.forEach(p=>{ if(p.estado==='Inactivo'){p.estado='Frío';frio_changed=true;} });
    // Migrate: facilityId → facilityIds
    state.proyectos.forEach(p=>{ if(p.facilityId && !p.facilityIds){p.facilityIds=p.facilityId;} });
    if(frio_changed) saveE('proyectos');
    // ── Migración BG1 → BG1 Pro (una sola vez) ──
    await migrarBG1Pro();
    if(window.isReadOnly) document.body.classList.add('readonly');
    setSyncStatus('● Sync');render();
  }catch(err){
    setSyncStatus('✕ Error: '+err.message);
    document.getElementById('content').innerHTML='<div style="color:#ef4444;padding:32px;font-size:14px"><b>Error al cargar:</b> '+err.message+'<br><br><small style="color:#888">'+err.stack+'</small></div>';
  }
}

// Renombra la clave "BG1" a "BG1 Pro" en stock y ventas por distribuidor.
// El histórico de BG1 pasa a BG1 Pro; el nuevo "BG1" arranca vacío.
async function migrarBG1Pro(force){
  try{
    var cambiado=false;
    var habiaBG1=false;
    var ventasOk=(state.ventas&&typeof state.ventas==='object'&&!Array.isArray(state.ventas));
    // 1) Stock
    if(ventasOk && state.ventas.stock && typeof state.ventas.stock==='object'){
      if(state.ventas.stock['BG1']!==undefined){
        habiaBG1=true;
        var v=Number(state.ventas.stock['BG1'])||0;
        state.ventas.stock['BG1 Pro']=(Number(state.ventas.stock['BG1 Pro'])||0)+v;
        delete state.ventas.stock['BG1'];
        cambiado=true;
      }
    }
    // 2) Ventas por distribuidor
    if(ventasOk && Array.isArray(state.ventas.dist)){
      state.ventas.dist.forEach(function(row){
        if(row && row['BG1']!==undefined){
          habiaBG1=true;
          var vv=Number(row['BG1'])||0;
          row['BG1 Pro']=(Number(row['BG1 Pro'])||0)+vv;
          delete row['BG1'];
          cambiado=true;
        }
      });
    }
    // 3) Líneas de pedidos existentes: producto "BG1" → "BG1 Pro"
    var pedidosCambiados=false;
    if(Array.isArray(state.pedidos)){
      state.pedidos.forEach(function(p){
        if(Array.isArray(p.items)){
          p.items.forEach(function(it){
            if(it && (it.producto==='BG1'||it.producto==='bg1'||it.producto==='Bg1')){
              it.producto='BG1 Pro';
              pedidosCambiados=true;
            }
          });
        }
      });
    }
    if(pedidosCambiados && !window.isReadOnly){ await saveE('pedidos'); }

    // Solo marca como migrado y guarda si realmente hizo cambios.
    if(cambiado && ventasOk){
      state.ventas._bg1ProMigrado=true;
      if(!window.isReadOnly){ await saveE('ventas'); }
      console.log('Migración BG1 → BG1 Pro completada (stock y ventas)');
    }
    if(force){
      if(cambiado||pedidosCambiados) showToast('✓ BG1 migrado a BG1 Pro (stock, ventas y pedidos)');
      else showToast('No hay nada de BG1 antiguo que migrar');
    }
    return cambiado||pedidosCambiados;
  }catch(e){ console.warn('migrarBG1Pro',e); }
}
// Forzar migración manualmente desde consola: forzarMigracionBG1()
async function forzarMigracionBG1(){ return migrarBG1Pro(true); }

async function saveE(e){
  if(window.isReadOnly)return;
  setSyncStatus('⟳');
  const data=state[e]||[];
  try{
    await db.collection(e).doc('data').set({items:data});
    setSyncStatus('● Sync');
    showToast('✓ Guardado'+(Array.isArray(data)?' ('+data.length+')':''));
  }catch(err){
    setSyncStatus('✕ Error');
    console.error('saveE failed:',e,err);
  }
}

  'Llamada':['#111','#888'],'Email':['#111','#888'],'Reunión':['#2e1065','#c4b5fd'],
  'Demo':['#042f2e','#5eead4'],'Propuesta':['#1e3a6e','#93c5fd'],'Seguimiento':['#1a1000','#fbbf24'],
};
function bdg(l){if(!l)return'';const[bg,c]=BM[l]||['#111','#666'];return`<span class="badge" style="background:${bg};color:${c}">${l}</span>`;}

function getDistIds(p){
  if(!p.distribuidorIds)return[];
  if(Array.isArray(p.distribuidorIds))return p.distribuidorIds.filter(Boolean);
  return String(p.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean);
}
function getFacilityIds(p){
  if(p.facilityIds) return Array.isArray(p.facilityIds)?p.facilityIds:String(p.facilityIds).split(',').map(x=>x.trim()).filter(Boolean);
  if(p.facilityId) return [p.facilityId];
  return [];
}
function fNoms(p){ return getFacilityIds(p).map(id=>{const f=state.facilities.find(x=>x.id===id);return f?f.nombre:id;}).join(', ')||''; }
function dNoms(p){return getDistIds(p).map(id=>{const d=state.distribuidores.find(x=>x.id===id);return d?d.nombre:id;}).join(', ')||'—';}
function fv(v){const n=Number(v)||0;return n>0?n.toLocaleString('es-ES')+'K€':'';}
function getFacilityName(id){const f=state.facilities.find(x=>x.id===id);return f?f.nombre:'';}

// ── Multiselect dropdown ──
function msDropdown(id, options, activeSet, placeholder){
  const active=activeSet.size>0;
  const label=active?[...activeSet].join(', '):placeholder;
  return`<div class="ms-wrap" id="ms-${id}">
    <div class="ms-trigger${active?' has-active':''}" onclick="toggleMs('${id}')">${label}</div>
    <div class="ms-dropdown" id="msd-${id}">
      ${options.map(o=>`<div class="ms-option${activeSet.has(o)?' selected':''}" onclick="toggleMsOpt('${id}','${o}')">
        <div class="ms-check">${activeSet.has(o)?'✓':''}</div>${o}
      </div>`).join('')}
      <div class="ms-clear" onclick="clearMs('${id}')">Limpiar filtro</div>
    </div>
  </div>`;
}
function toggleMs(id){
  // close others
  document.querySelectorAll('.ms-dropdown.open').forEach(d=>{if(d.id!=='msd-'+id)d.classList.remove('open');});
  document.getElementById('msd-'+id)?.classList.toggle('open');
}
function toggleMsOpt(id,val){
  if(filters.estados.has(val))filters.estados.delete(val);else filters.estados.add(val);
  render();
}
function clearMs(id){filters.estados.clear();render();}
function toggleDistFilter(id){
  if(!filters.distIds)filters.distIds=new Set();
  if(filters.distIds.has(id))filters.distIds.delete(id);else filters.distIds.add(id);
  renderList();
}
// close dropdowns on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-dropdown.open').forEach(d=>d.classList.remove('open'));
});

function matchEstados(s){return filters.estados.size===0||filters.estados.has(s);}

// ── Nav ──
function getDefaultFilters(view){
  if(view==='leads') return {search:'',estados:new Set(['Nuevo','Contactado','Asociado']),distId:'',distIds:new Set()};
  if(view==='tareas') return {search:'',estados:new Set(['Pendiente','En curso']),distId:'',distIds:new Set()};
  return {search:'',estados:new Set(),distId:'',distIds:new Set()};
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentView=btn.dataset.view;selectedItem=null;selectedType=null;
    filters=getDefaultFilters(btn.dataset.view);
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');closeDetail();render();
  });
});

// ── Render ──
function render(){
  const c=document.getElementById('content');
  const views={dashboard:rDash,leads:rLeads,proyectos:rProyectos,distribuidores:rDist,facilities:rFacil,tareas:rTareas,calendario:rCalendario,bi:rBI};
  c.innerHTML=(views[currentView]||rDash)();
  bindL();
  if(currentView==='bi'){
    var _biCheck=setInterval(function(){
      var c=document.getElementById('red-bi-canvas');
      if(c&&!c._rb&&c.parentElement&&c.parentElement.clientWidth>0){
        clearInterval(_biCheck);
        initRedBI();
      }
    },50);
    setTimeout(function(){ clearInterval(_biCheck); },3000);
  }
}

function renderList(){
  // Re-render only the list, preserving search input focus and value
  const listEl=document.querySelector('#content .list');
  const statsEl=document.querySelector('#content .estado-stats');
  if(!listEl){render();return;}
  const frag=document.createElement('div');
  const views={leads:rLeads,proyectos:rProyectos,distribuidores:rDist,facilities:rFacil,tareas:rTareas,bi:rBI};
  frag.innerHTML=(views[currentView]||rDash)();
  const newList=frag.querySelector('.list');
  const newStats=frag.querySelector('.estado-stats');
  if(newList)listEl.innerHTML=newList.innerHTML;
  if(newStats&&statsEl)statsEl.innerHTML=newStats.innerHTML;
  // Re-bind list item clicks
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn')||e.target.closest('.demo-btn')||e.target.closest('[data-hot-id]')) return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';renderList();await saveE('tareas');}
    });
  });
  document.querySelectorAll('[data-demo-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const p=state.proyectos.find(x=>x.id===btn.dataset.demoToggle);
      if(p){p.demo=isDemo(p)?'false':'true';renderList();if(selectedItem?.id===p.id){openDetail(p,'proyecto');}await saveE('proyectos');}
    });
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      var rc=document.getElementById('red-bi-canvas');if(rc&&rc._cleanup)rc._cleanup();
    filters={search:'',estados:new Set(),distId:'',distIds:new Set(),statKey:''};closeDetail();render();
    });
  });
}

function rDashFacilities(){
  const hoy=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const hoyISO=new Date().toISOString().slice(0,10);
  const facs=state.facilities;

  // Facilities con proyecto vs sin proyecto
  const facConProy=new Set(state.proyectos.flatMap(p=>getFacilityIds(p)));

  const activosFac=projFac.filter(p=>p.estado==='Activo');
  const hotFac=projFac.filter(p=>p.hot&&!['Ganado','Perdido'].includes(p.estado));
  const totalContactos=state.contactos.filter(c=>c.facilityId&&facs.some(f=>f.id===c.facilityId)).length;

  function card(lbl,val,sub,col,nav){
    return `<div onclick="${nav?`currentView='${nav}';render()`:''}" style="background:#111;border:1px solid #1e1e1e;border-left:2px solid ${col};border-radius:8px;padding:15px 16px;${nav?'cursor:pointer':''}">

      <div style="font-size:26px;font-weight:800;font-family:Barlow,sans-serif;line-height:1;margin-bottom:5px;color:${col}">${val}</div>
      <div style="font-size:11px;color:#555">${sub}</div>
    </div>`;
  }

  let h=`<div class="topbar"><h1 style="font-size:22px;text-transform:uppercase">Panel Facilities</h1><span style="font-size:11px;color:var(--textMuted);font-family:Outfit,sans-serif;margin-left:auto">${hoy}</span></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0">
    ${card('Facilities',facs.length,nConProy+' con proyecto · '+nSinProy+' sin','#b5c832','facilities')}
    ${card('Pipeline facilities',pipFac.toLocaleString('es-ES')+'K€',hotFac.length+' HOT · '+activosFac.length+' activos','#5b9bff','proyectos')}
    ${card('Contactos',totalContactos,'en tus facilities','#e8e8e8','facilities')}
    ${card('Mis tareas',tareasPend.length,(tareasVenc.length?tareasVenc.length+' vencidas':'al día'),tareasVenc.length?'#ff5a5a':'#3ddc84','tareas')}
  </div>`;

  // Proyectos de facilities por estado
  const porEstado={};
  ['Frío','Activo','Pendiente','Ganado','Perdido'].forEach(e=>{porEstado[e]=projFac.filter(p=>p.estado===e).length;});
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div style="background:#111;border:1px solid #1e1e1e;border-radius:8px;overflow:hidden">
      <div style="padding:11px 14px;border-bottom:1px solid #1a1a1a"><span style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em">Proyectos de facilities por estado</span></div>
      <div style="padding:10px 14px;display:flex;flex-direction:column;gap:8px">
        ${[['Activo','#86efac'],['Pendiente','#facc15'],['Frío','#60a5fa'],['Ganado','#2dd4bf'],['Perdido','#f87171']].map(([e,col])=>`
        <div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:${col}"></span><span style="font-size:12px;color:#aaa;flex:1">${e}</span><span style="font-size:15px;font-weight:700;color:#e0e0e0;font-family:Barlow,sans-serif">${porEstado[e]}</span></div>`).join('')}
      </div>
    </div>
    <div style="background:#111;border:1px solid #1e1e1e;border-radius:8px;overflow:hidden">
      <div style="padding:11px 14px;border-bottom:1px solid #1a1a1a"><span style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em">Facilities sin proyecto aún</span></div>
      <div style="padding:6px 0">`;
  const sinProy=facs.filter(f=>!facConProy.has(f.id)).slice(0,6);
  if(sinProy.length){
    sinProy.forEach(f=>{h+=`<div onclick="openDetail(state.facilities.find(x=>x.id==='${f.id}'),'facility')" style="padding:8px 14px;border-top:1px solid #161616;cursor:pointer;font-size:13px;color:#e0e0e0">${f.nombre}<span style="color:#555;font-size:11px"> · ${f.zona||''}</span></div>`;});
  } else { h+=`<div class="empty" style="padding:20px;color:#555">Todas tienen proyecto ✓</div>`; }
  h+=`</div></div></div>`;
  return h;
}

// ── Filtrado por rol (Junior/facilities solo ve proyectos con facility) ──
function proyectoTieneFacility(p){
  var f=p.facilityIds||p.facilityId||'';
  return !!(f&&String(f).trim());
}
function visibleProyectos(){
  if(effRole()==='facilities') return state.proyectos.filter(proyectoTieneFacility);
  return state.proyectos;
}
function visibleTareas(){
  // El Junior solo ve las tareas que ha creado él
  if(effRole()==='facilities') return state.tareas.filter(function(t){return t.creadoPor==='junior@muzybar.es';});
  return state.tareas;
}
// ¿Puede el rol efectivo editar este tipo de entidad?
function canEditType(type){
  var r=effRole();
  if(r==='admin') return true;
  if(r==='lectura'||r==='stock') return false;
  if(r==='facilities'){
    // Junior edita facilities, proyectos, contactos y tareas; distribuidores NO
    return ['facility','proyecto','contacto','tarea'].indexOf(type)>=0;
  }
  return false;
}
function esDeJunior(item){
  return item && item.creadoPor==='junior@muzybar.es';
}
// Etiqueta de color para registros del Junior (se ve en admin y lectura)
function juniorTag(item){
  if(!esDeJunior(item)) return '';
  // Solo el admin/lectura ve las etiquetas de autor
  if(effRole()==='facilities') return '';
  return '<span style="display:inline-flex;align-items:center;gap:3px;background:rgba(91,155,255,.14);color:#5b9bff;font-size:9px;padding:1px 6px;border-radius:10px;margin-left:6px;font-family:Outfit,sans-serif;vertical-align:middle">● Junior</span>';
}
function esDeJack(item){ return item && item.creadoPor==='jack@muzybar.es'; }
function jackTag(item){
  if(!esDeJack(item)) return '';
  if(effRole()==='facilities'||effRole()==='stock') return '';
  return '<span style="display:inline-flex;align-items:center;gap:3px;background:rgba(249,115,22,.16);color:#f97316;font-size:9px;padding:1px 6px;border-radius:10px;margin-left:6px;font-family:Outfit,sans-serif;vertical-align:middle">● Jack</span>';
}
// Borde de color por autor para tarjetas
function autorBorde(item){
  if(esDeJunior(item)) return 'border-left:3px solid #5b9bff';
  if(esDeJack(item)) return 'border-left:3px solid #f97316';
  return '';
}
async function deleteContacto(id){
  if(window.isReadOnly) return;
  var c=state.contactos.find(function(x){return x.id===id;});
  if(!c) return;
  if(!confirm('¿Eliminar el contacto "'+(c.nombre||'')+'"?')) return;
  state.contactos=state.contactos.filter(function(x){return x.id!==id;});
  // Refrescar el detalle abierto
  render();
  if(selectedItem&&selectedType) openDetail(selectedItem,selectedType);
  await saveE('contactos');
}

  <div class="list">${f.length?f.map(x=>{

  }).join(''):'<div class="empty">No hay facilities. Añade clientes finales como ILUNION, OPTIMA, ACCIONA...</div>'}</div>`;
}

// ── Tareas ──
function rTareas(){
  // Ensure all tasks have a columna field + migrate Media→Baja
  state.tareas.forEach(t=>{
    if(!t.columna) t.columna = t.vinculoProjId ? 'proyectos' : 'proyectos';
    if(t.prioridad==='Media'){t.prioridad='Baja';}
  });

  // Priority order
  const PRIO = {Alta:0, Baja:1};
  const showHechas = filters.estados?.has('Hecha') || filters.estados?.has('all') || false;

  // Per-column priority filter
  if(!filters.colPrio) filters.colPrio = {};

  const cols = [
    {id:'deberes',    label:'Deberes',    color:'#d8b4fe'},
    {id:'ventas',     label:'Ventas',     color:'#86efac'},
    {id:'proyectos',  label:'Proyectos',  color:'#60a5fa'},
    {id:'seguimiento',label:'Seguimiento',color:'#facc15'},
  ];

  const q = filters.search?.toLowerCase()||'';

  const totalPend = visibleTareas().filter(t=>t.estado!=='Hecha').length;
  let html = `<div class="topbar">
    <h1 style="font-size:22px;text-transform:uppercase">Tareas <span style="font-size:13px;font-weight:400;color:var(--textMuted);margin-left:4px">${totalPend} sin cerrar</span></h1>
  </div>
  <div style="padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);margin-bottom:2px">
    <div style="position:relative;flex:0 0 280px">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--textMuted);font-size:13px;pointer-events:none">⌕</span>
      <input style="width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:6px;padding:7px 10px 7px 30px;color:var(--text);font-size:12px;outline:none;box-sizing:border-box" placeholder="Buscar tareas..." value="${filters.search||''}" oninput="(function(el){filters.search=el.value;var p=el.selectionStart;renderList();var ni=document.getElementById('kanban-search');if(ni){ni.focus();try{ni.setSelectionRange(p,p);}catch(e){}}})(this)" id="kanban-search">
    </div>
    <div style="display:flex;gap:5px;align-items:center">
      <span style="font-size:11px;color:var(--textMuted);margin-right:2px">Mostrar:</span>
      <button style="padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid ${!filters.estados?.size?'var(--accent)':'var(--border)'};background:${!filters.estados?.size?'rgba(249,115,22,.12)':'transparent'};color:${!filters.estados?.size?'var(--accent)':'var(--textMuted)'}" onclick="filters.estados=new Set();renderList()">Pendientes</button>
      <button style="padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid ${filters.estados?.has('Hecha')?'var(--accent)':'var(--border)'};background:${filters.estados?.has('Hecha')?'rgba(249,115,22,.12)':'transparent'};color:${filters.estados?.has('Hecha')?'var(--accent)':'var(--textMuted)'}" onclick="filters.estados=new Set(['Hecha']);renderList()">Hechas</button>
      <button style="padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid ${filters.estados?.has('all')?'var(--accent)':'var(--border)'};background:${filters.estados?.has('all')?'rgba(249,115,22,.12)':'transparent'};color:${filters.estados?.has('all')?'var(--accent)':'var(--textMuted)'}" onclick="filters.estados=new Set(['all']);renderList()">Todas</button>
    </div>
  </div><div class="kanban-wrap" id="kanban-wrap">`;

  cols.forEach(col=>{
    let tasks = visibleTareas().filter(t=>{
      const match = col.id==='proyectos' ? (t.columna==='proyectos'||(!t.columna&&t.vinculoProjId)) : t.columna===col.id;
      if(!match) return false;
      if(!showHechas && t.estado==='Hecha') return false;
      if(q){
        const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
        const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
        const hay=(t.titulo+' '+(vp?.nombre||'')+' '+(vd?.nombre||'')+' '+(t.notas||'')).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    // Apply per-column priority filter
    const cp2 = filters.colPrio?.[col.id] || '';
    if(cp2) tasks = tasks.filter(t => t.prioridad === cp2);
    // Sort by priority
    tasks.sort((a,b)=>(PRIO[a.prioridad]??3)-(PRIO[b.prioridad]??3));

    const cp = filters.colPrio?.[col.id] || '';
    html += `<div class="kanban-col" data-col="${col.id}">
      <div class="kanban-col-header" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="kanban-col-title" style="color:${col.color}">${col.label}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="kanban-col-count">${tasks.length}</span>
            <button style="background:transparent;border:1px solid #333;color:#888;width:22px;height:22px;border-radius:4px;font-size:14px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center" onclick="openModal('tarea',null,{columna:'${col.id}'})" title="Nueva tarea">+</button>
          </div>
        </div>
        <div style="display:flex;gap:4px">
          <button style="flex:1;padding:2px 0;border-radius:3px;font-size:10px;cursor:pointer;border:1px solid ${'${cp}'===''?'#f87171':'#2a2a2a'};background:${'${cp}'===''?'rgba(248,113,113,.15)':'transparent'};color:${'${cp}'===''?'#f87171':'#555'}" onclick="if(!filters.colPrio)filters.colPrio={};filters.colPrio['${col.id}']=filters.colPrio['${col.id}']==='Alta'?'':'Alta';renderList()">Alta</button>
          <button style="flex:1;padding:2px 0;border-radius:3px;font-size:10px;cursor:pointer;border:1px solid ${'${cp}'==='Baja'?'#86efac':'#2a2a2a'};background:${'${cp}'==='Baja'?'rgba(134,239,172,.1)':'transparent'};color:${'${cp}'==='Baja'?'#86efac':'#555'}" onclick="if(!filters.colPrio)filters.colPrio={};filters.colPrio['${col.id}']=filters.colPrio['${col.id}']==='Baja'?'':'Baja';renderList()">Baja</button>
        </div>
      </div>
      <div class="kanban-col-body" id="col-${col.id}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="dropTask(event,'${col.id}')">`;

    tasks.forEach(t=>{
      const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
      const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
      const vinculo=vp?vp.nombre:(vd?vd.nombre:'');
      const done=t.estado==='Hecha';
      html+=`<div class="kanban-card${done?' kanban-card-done':''}" draggable="true"
          data-id="${t.id}"
          ondragstart="dragTask(event,'${t.id}')"
          ondragend="this.classList.remove('dragging')"
          onclick="openKanbanDetail('${t.id}')">
        <div class="kanban-card-title">${t.titulo}</div>
        ${vinculo?`<div class="kanban-card-sub">${vinculo}</div>`:''}
        <div class="kanban-card-footer">
          ${t.prioridad?`<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:${t.prioridad==='Alta'?'#3b0d0d':'#0c1a0c'};color:${t.prioridad==='Alta'?'#f87171':'#86efac'}">${t.prioridad}</span>`:'<span></span>'}
          <button onclick="event.stopPropagation();toggleTareaHecha('${t.id}')" style="background:${done?'#052e16':'transparent'};border:1.5px solid ${done?'#22c55e':'#333'};color:${done?'#22c55e':'#555'};width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">${done?'✓':'○'}</button>
        </div>
      </div>`;
    });

    html+=`</div>
    </div>`;
  });

  html+='</div>';
  return html;
}


function openDetail(item,type){
  selectedItem=item;selectedType=type;
  document.getElementById('detail-panel').innerHTML=rDetail(item,type);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
  bindDL();
}
function closeDetail(){selectedItem=null;selectedType=null;document.getElementById('detail-panel').classList.remove('open');document.getElementById('main').classList.remove('panel-open');}

function rDetail(item,type){
  const rows=pairs=>pairs.filter(([,v])=>v).map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  let h=`<div class="detail-header"><div><div class="detail-type">${type}</div><div class="detail-title">${item.nombre||item.empresa||item.titulo||''}</div></div><button class="close-btn" id="btn-close-detail">×</button></div>`;
  if(type==='proyecto'){
    const _demo=isDemo(item);
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">${bdg(item.estado)}<button class="demo-btn${_demo?' active':''}" data-demo-toggle="${item.id}">${_demo?'🎯 Demo activa':'Demo'}</button></div>`;
    if(_demo&&item.fechaDemo)h+=`<div style="font-size:11px;color:#2dd4bf;margin-bottom:10px">📅 Demo: ${item.fechaDemo}</div>`;
    h+=rows([['Distribuidores',dNoms(item)],['Facilities',fNoms(item)||getFacilityName(item.facilityId)||''],['Modelo',item.modelo],['Valor est.',fv(item.valor)],['Prox. contacto',item.fecha]]);
    if(item.notas){const nid='notes-'+Math.random().toString(36).slice(2);window['_n'+nid]=item.notas;h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" onclick="openNotesModal(window['_n${nid}'])" title="Expandir notas">⤢</button></div>`;}
    const tars=state.tareas.filter(t=>t.vinculoProjId===item.id);
    h+=`<div class="detail-section"><span>Tareas (${tars.length})</span><button class="btn-secondary btn-sm" id="btn-add-tarea-proj">+ Nueva tarea</button></div>`;
    if(tars.length){h+=tars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${t.titulo}</div><div class="mini-card-sub">${t.fecha||''}</div></div>${bdg(t.estado)}</div>`).join('');}
    else{h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin tareas vinculadas</div>`;}
  }
  if(type==='distribuidor'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Activo')}</div>`;
    h+=rows([['Provincia/Zona',item.provincia]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    const allProjs=state.proyectos.filter(p=>getDistIds(p).includes(item.id));
    const projs=allProjs.filter(p=>['Frío','Activo','Pendiente'].includes(p.estado));
    const closedCount=allProjs.length-projs.length;
    if(projs.length){h+=`<div class="detail-section"><span>Proyectos activos (${projs.length}${closedCount>0?' · '+closedCount+' cerrados':''})</span></div>`;h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');}
    // Contactos del distribuidor
    const dConts=state.contactos.filter(c=>c.distribuidorId===item.id);
    h+=`<div class="detail-section"><span>Contactos</span><button class="btn-secondary btn-sm" id="btn-add-contacto-dist">+ Añadir</button></div>`;
    if(dConts.length)h+=dConts.map(c=>`<div class="mini-card clickable" data-contacto-id="${c.id}" title="Doble clic para editar" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="min-width:0"><div class="mini-card-name">${c.nombre}${juniorTag(c)}${jackTag(c)}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}${c.telefono?' · '+c.telefono:''}</div></div>${window.isReadOnly?'':`<button onclick="event.stopPropagation();deleteContacto('${c.id}')" title="Eliminar contacto" style="flex-shrink:0;background:transparent;border:1px solid #3a1a1a;color:#ef4444;width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center">×</button>`}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin contactos</div>`;
  }
  if(type==='lead'){
    h+=`<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap">${bdg(item.estado||'Nuevo')}${item.prioridad?bdg(item.prioridad):''}${item.tipo?bdg(item.tipo):''}</div>`;
    h+=rows([['Contacto',item.contacto],['Teléfono',item.tel],['Email',item.email],['Zona',item.zona],['Origen',item.origen],['Próx. contacto',item.fechaProxContacto],['Comercial',item.comercialId?(state.comerciales||[]).find(c=>c.id===item.comercialId)?.nombre||item.comercialId:''],['Distribuidor',item.distribuidorId?dNomById(item.distribuidorId):'']]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    const leadTars=state.tareas.filter(t=>t.vinculoLeadId===item.id);
    h+=`<div class="detail-section"><span>Tareas (${leadTars.length})</span><button class="btn-secondary btn-sm" id="btn-add-tarea-lead">+ Nueva</button></div>`;
    if(leadTars.length)h+=leadTars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div class="mini-card-name">${t.titulo}</div>${bdg(t.estado)}</div>`).join('');
    h+=`<div class="detail-section" style="margin-top:16px"><span>Convertir</span></div>`;
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn-secondary" onclick="convertLeadToDist('${item.id}')">→ Distribuidor</button>
      <button class="btn-primary" onclick="convertLeadToProyecto('${item.id}')">→ Proyecto</button>
    </div>`;
  }
  if(type==='facility'){
    h+=rows([['Zona/Provincia',item.zona]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    // Contactos
    const conts=state.contactos.filter(c=>c.facilityId===item.id);
    h+=`<div class="detail-section"><span>Contactos</span><button class="btn-secondary btn-sm" id="btn-add-contacto">+ Añadir</button></div>`;
    if(conts.length)h+=conts.map(c=>`<div class="mini-card clickable" data-contacto-id="${c.id}" title="Doble clic para editar" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="min-width:0"><div class="mini-card-name">${c.nombre}${juniorTag(c)}${jackTag(c)}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}${c.telefono?' · '+c.telefono:''}</div></div>${window.isReadOnly?'':`<button onclick="event.stopPropagation();deleteContacto('${c.id}')" title="Eliminar contacto" style="flex-shrink:0;background:transparent;border:1px solid #3a1a1a;color:#ef4444;width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center">×</button>`}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin contactos</div>`;
    // Proyectos
    const projs=state.proyectos.filter(p=>p.facilityId===item.id);
    h+=`<div class="detail-section"><span>Proyectos</span><button class="btn-secondary btn-sm" id="btn-add-proyecto-facility">+ Añadir</button></div>`;
    if(projs.length)h+=projs.map(p=>`<div class="mini-card clickable" data-proj-id="${p.id}" style="display:flex;justify-content:space-between;align-items:center" title="Doble clic para editar"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}${p.valor>0?' · '+fv(p.valor):''}</div></div>${bdg(p.estado)}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin proyectos</div>`;
  }
  if(type==='tarea'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.tipo||'')}${bdg(item.prioridad)}${bdg(item.estado)}</div>`;
    const vp=state.proyectos.find(x=>x.id===item.vinculoProjId);
    const vd=state.distribuidores.find(x=>x.id===item.vinculoDistId);
    if(vp)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vp.nombre}</div><div class="mini-card-sub">Proyecto</div></div>`;
    if(vd)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vd.nombre}</div><div class="mini-card-sub">Distribuidor</div></div>`;
    h+=rows([['Fecha límite',item.fecha]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
  }
  h+=`<div class="detail-actions">${canEditType(type)?`<button class="btn-primary" id="btn-edit-detail">Editar</button><button class="btn-danger" id="btn-del-detail">Eliminar</button>`:''}</div>`;
  return h;
}

function searchableSelect(items, fieldName, selectedId, placeholder){
  const uid='ss_'+fieldName;
  const selItem=items.find(x=>x.id===selectedId);
  return`<div class="ss-wrap">
    <input class="ss-search" placeholder="${placeholder}" oninput="filterSSOpts('${uid}',this.value)" value="${selItem?selItem._label:''}">
    <input type="hidden" name="${fieldName}" value="${selectedId||''}">
    <div class="ss-list" id="${uid}">
      <div class="ss-opt${!selectedId?' selected':''}" onclick="selectSSOpt('${uid}','${fieldName}','','— Sin vincular —',this)">— Sin vincular —</div>

    </div>
  </div>`;
}
function filterSSOpts(uid, q){
  const list=document.getElementById(uid);
  if(q.length>0){
    list.classList.add('open');
    list.querySelectorAll('.ss-opt').forEach(el=>{
      el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';
    });
  } else {
    list.classList.remove('open');
  }
}
function selectSSOpt(uid, fieldName, id, label, el){
  document.querySelector('[name="'+fieldName+'"]').value=id;
  const wrap=document.getElementById(uid).closest('.ss-wrap');
  wrap.querySelector('.ss-search').value=label==='— Sin vincular —'?'':label;

}

// ── Bind listeners ──
function bindL(){
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn')||e.target.closest('[data-hot-id]'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';render();await saveE('tareas');}
    });
  });
  const bn=document.getElementById('btn-new');
  if(bn)bn.addEventListener('click',()=>{const tm={leads:'lead',proyectos:'proyecto',distribuidores:'distribuidor',facilities:'facility',tareas:'tarea'};openModal(tm[currentView]||'tarea');});
  const fs=document.getElementById('f-search');
  if(fs){
    fs.addEventListener('input',e=>{
      filters.search=e.target.value;
      renderList(); // only re-render the list, not the whole page
    });
    // prevent cursor loss on re-render
    fs.addEventListener('keydown',e=>e.stopPropagation());
  }
  const fd=document.getElementById('f-dist');
  if(fd)fd.addEventListener('change',e=>{filters.distId=e.target.value;renderList();});
  // Demo toggle buttons (in list and detail)
  document.querySelectorAll('[data-demo-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const p=state.proyectos.find(x=>x.id===btn.dataset.demoToggle);
      if(p){
        p.demo=isDemo(p)?'false':'true';
        render();
        if(selectedItem?.id===p.id){openDetail(p,'proyecto');render();}
        await saveE('proyectos');
      }
    });
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:'',distIds:new Set()};closeDetail();render();
    });
  });
}

function bindDL(){
  document.getElementById('btn-close-detail')?.addEventListener('click',()=>{closeDetail();render();});
  document.getElementById('btn-edit-detail')?.addEventListener('click',()=>openModal(selectedType,selectedItem));
  document.getElementById('btn-del-detail')?.addEventListener('click',async()=>{
    if(window.isReadOnly)return;
    if(!confirm('¿Eliminar?'))return;
    const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[selectedType];
    if(key){state[key]=state[key].filter(x=>x.id!==selectedItem.id);closeDetail();render();await saveE(key);}
  });
  document.getElementById('btn-add-contacto')?.addEventListener('click',()=>openModal('contacto',null,{facilityId:selectedItem?.id}));
  document.getElementById('btn-add-contacto-dist')?.addEventListener('click',()=>openModal('contacto',null,{distribuidorId:selectedItem?.id}));
  document.querySelectorAll('.mini-card.clickable[data-contacto-id]').forEach(el=>{
    el.addEventListener('dblclick',()=>{
      const c=state.contactos.find(x=>x.id===el.dataset.contactoId);
      if(c)openModal('contacto',c);
    });
  });
  document.getElementById('btn-add-proyecto-facility')?.addEventListener('click',()=>openModal('proyecto',null,{facilityId:selectedItem?.id}));

  document.getElementById('btn-add-tarea-proj')?.addEventListener('click',()=>openModal('tarea',null,{vinculoProjId:selectedItem?.id}));
  document.getElementById('btn-add-tarea-lead')?.addEventListener('click',()=>openModal('tarea',null,{vinculoLeadId:selectedItem?.id}));
  // Close detail panel on click outside
  const mainEl=document.getElementById('main');
  if(mainEl&&!mainEl._closeDetailBound){
    mainEl._closeDetailBound=true;
    mainEl.addEventListener('click',e=>{
      const panel=document.getElementById('detail-panel');
      if(panel?.classList.contains('open')&&!panel.contains(e.target)&&!e.target.closest('.list-item')&&!e.target.closest('.kanban-card')&&!e.target.closest('[data-id]')){

  document.querySelectorAll('.form-notes').forEach(el=>{

    el.addEventListener('focus',function(){this.style.height=Math.max(160,this.scrollHeight)+'px';});
    el.addEventListener('input',expand);
    if(el.value) expand.call(el);
  });
  // Rich notes editor — init with existing content
  const richEd=document.getElementById('notes-editor');
  const richHid=document.getElementById('notas-hidden');
  if(richEd&&richHid){
    richEd.setAttribute('data-placeholder','Notas...');
    richEd.addEventListener('input',function(){richHid.value=this.innerHTML;});
    richEd.addEventListener('focus',function(){this.style.minHeight='180px';});
    richEd.addEventListener('blur',function(){if(!this.innerHTML.trim())this.style.minHeight='80px';});
  }

  // Double-click on project mini-cards inside facility
  document.querySelectorAll('.mini-card.clickable[data-proj-id]').forEach(el=>{
    el.addEventListener('dblclick',()=>{
      const p=state.proyectos.find(x=>x.id===el.dataset.projId);
      if(p)openModal('proyecto',p);
    });
  });
}

function bindML(type){
  document.getElementById('btn-close-modal')?.addEventListener('click',closeModal);
  document.getElementById('btn-cancel-modal')?.addEventListener('click',closeModal);
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const data={};
    new FormData(form).forEach((v,k)=>data[k]=v);
    // multi distribuidor from search widget
    if(type==='proyecto'){
      const checked=[...form.querySelectorAll('.dist-opt.checked')].map(c=>c.dataset.distId);
      data.distribuidorIds=checked.join(',');
      data.valor=Number(data.valor)||0;
      // handle demo checkbox
      const chkDemo=form.querySelector('[name="demo"]');
      data.demo=chkDemo?String(chkDemo.checked):'false';
    }
    const km={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[type];if(!key)return;
    if(editingItem){
      if(type==='tarea'&&data.columna_sel){data.columna=data.columna_sel;delete data.columna_sel;}
      if(type==='tarea'&&!data.columna) data.columna=editingItem?.columna||'deberes';
      if(type==='proyecto') data.updatedAt=new Date().toISOString();
      Object.assign(editingItem,data);
      state[key]=state[key].map(x=>x.id===editingItem.id?editingItem:x);
      if(selectedItem?.id===editingItem.id)selectedItem=editingItem;
    } else {
      const px={lead:'L',proyecto:'P',distribuidor:'D',facility:'F',tarea:'T',contacto:'C'};
      data.id=genId(px[type]||'X');
      data.creadoPor=window._userEmail||'';
      data.creadoEn=new Date().toISOString();
      if(!data.fecha)data.fecha=today();
      if(type==='tarea'){
        if(data.columna_sel) data.columna = data.columna_sel;
        else data.columna = editingItem?.columna || _pendingColumna || 'proyectos';
        if(data.vinculoProjId) data.columna='proyectos';
        delete data.columna_sel;
        if(!data.estado) data.estado = 'Pendiente';
      }
      if(type==='proyecto'){
        data.updatedAt=new Date().toISOString();
        if(!data.estado) data.estado='Activo';
      }
      state[key].push(data);
    }
    // Facilities múltiples SOLO para proyectos (checkboxes del form de proyecto)
    let facId='';
    if(type==='proyecto'){
      const facChecked=Array.from(document.querySelectorAll('#facil-opts-list .dist-opt.checked')).map(el=>el.dataset.distId).filter(Boolean);
      facId=facChecked.length?facChecked.join(','):(data.facilityId||editingItem?.facilityId||'');
      data.facilityIds=facId;
      data.facilityId=facChecked[0]||data.facilityId||'';
      // reflejar cambios en el objeto ya insertado
      if(editingItem){editingItem.facilityIds=data.facilityIds;editingItem.facilityId=data.facilityId;}
    } else if(type==='contacto'){
      // El contacto conserva su facilityId o distribuidorId (de los presets)
      facId=data.facilityId||editingItem?.facilityId||'';
      var distId=data.distribuidorId||editingItem?.distribuidorId||'';
      if(editingItem){editingItem.facilityId=facId;editingItem.distribuidorId=distId;}
      data.distribuidorId=distId;
    }
    closeModal();
    if(type==='contacto'){
      // Reabrir el detalle desde donde vino el contacto
      if(data.distribuidorId){
        const d=state.distribuidores.find(x=>x.id===data.distribuidorId);
        if(d){openDetail(d,'distribuidor');} else closeDetail();
      } else if(facId){
        const fac=state.facilities.find(f=>f.id===(facId.split(',')[0]));
        if(fac){openDetail(fac,'facility');} else closeDetail();
      } else closeDetail();
    } else if(type==='proyecto'&&facId){
      const fac=state.facilities.find(f=>f.id===(facId.split(',')[0]));
      if(fac){openDetail(fac,'facility');}
    } else {
      closeDetail();
    }
    render();
    await saveE(key);
  });
}


// ── Calendario ──
function rCalendario(){
  const now=new Date();
  const y=window._calYear||now.getFullYear();
  const m=window._calMonth!==undefined?window._calMonth:now.getMonth();
  window._calYear=y;window._calMonth=m;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  // Monday-based offset
  let startOffset=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  // Build events map: key = 'YYYY-MM-DD'
  const events={};
  const addEvent=(dateStr,label,type)=>{
    if(!dateStr)return;
    const d=dateStr.slice(0,10);
    if(!events[d])events[d]=[];
    events[d].push({label,type});
  };
  state.proyectos.forEach(p=>{
    const _demoFlag=isDemo(p);
    if(_demoFlag&&p.fechaDemo)addEvent(p.fechaDemo,'🎯 '+p.nombre,'demo');
    if(p.fecha)addEvent(p.fecha,'◈ '+p.nombre,'proyecto');
  });
  state.tareas.forEach(t=>{const tf=normalizeDate(t.fecha);if(tf&&t.estado!=='Hecha')addEvent(tf,'✓ '+t.titulo,'tarea');});
  state.leads.forEach(l=>{if(l.fechaProxContacto)addEvent(l.fechaProxContacto,'◎ '+l.empresa,'lead');});

  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    const isCurrentMonth=dayNum>=1&&dayNum<=lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateStr=date.toISOString().slice(0,10);
    const isToday=dateStr===new Date().toISOString().slice(0,10);
    const dayEvents=events[dateStr]||[];
    cells+=`<div class="cal-day${!isCurrentMonth?' other-month':''}${isToday?' today':''}">
      <div class="cal-day-num">${isCurrentMonth?dayNum:''}</div>
      ${dayEvents.slice(0,3).map(e=>`<div class="cal-event ${e.type}" title="${e.label}">${e.label}</div>`).join('')}
      ${dayEvents.length>3?`<div style="font-size:9px;color:var(--textMuted)">+${dayEvents.length-3} más</div>`:''}
    </div>`;
  }

  return`<div class="topbar"><h1 style="text-transform:uppercase">Calendario</h1></div>
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="cal-title">${monthNames[m]} ${y}</span>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
    <span style="font-size:11px;color:#2dd4bf">🎯 Demo</span>
    <span style="font-size:11px;color:#93c5fd">◈ Proyecto (próx. contacto)</span>
    <span style="font-size:11px;color:#fbbf24">✓ Tarea</span>
    <span style="font-size:11px;color:#c4b5fd">◎ Lead</span>
  </div>`;
}

function changeMonth(dir){
  let m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  let y=window._calYear||new Date().getFullYear();
  m+=dir;
  if(m<0){m=11;y--;}
  if(m>11){m=0;y++;}
  window._calMonth=m;window._calYear=y;
  render();
}

// ── Notes expand modal ──
function openNotesModal(text){
