<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Muzybar Robotics</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CRM Robots">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bgCard:#111;--bgSurface:#181818;--bgHover:#1e1e1e;
  --border:#242424;--borderHover:#333;
  --accent:#3b82f6;--accentSoft:#0f2040;
  --success:#22c55e;--successSoft:#0a2010;
  --warning:#f59e0b;
  --danger:#ef4444;
  --text:#f0f0f0;--textMuted:#4a4a4a;--textSub:#888;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
.login-overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:#111;border:1px solid #242424;border-radius:12px;padding:40px;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:20px}
.login-logo{width:180px;margin-bottom:8px}
.login-title{font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.1em}
.login-input{width:100%;background:#181818;border:1px solid #242424;border-radius:6px;padding:12px 14px;color:#f0f0f0;font-size:15px;outline:none;text-align:center;transition:border-color .2s}
.login-input:focus{border-color:#3b82f6}
.login-btn{width:100%;background:#3b82f6;border:none;border-radius:6px;padding:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-error{font-size:12px;color:#ef4444;min-height:16px}
input,select,textarea,button{font-family:'DM Sans',sans-serif}

.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--bgCard);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100}
.main{flex:1;margin-left:200px;overflow:auto;transition:margin-right .2s}
.main.panel-open{margin-right:380px}
.content{max-width:1000px;margin:0 auto;padding:28px 24px}

.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--text);text-transform:uppercase}
.sidebar-sub{font-size:10px;color:var(--textMuted);margin-top:2px}
.sidebar-nav{padding:6px 0;flex:1}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 16px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--textMuted);font-size:13px;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bgSurface);color:var(--textSub)}
.nav-btn.active{background:var(--bgSurface);color:var(--text);border-left-color:var(--accent)}
.nav-icon{font-size:13px;width:16px;text-align:center}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:18px;font-weight:600}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn-primary{background:var(--accent);border:none;border-radius:5px;padding:7px 16px;color:#fff;cursor:pointer;font-size:12px;font-weight:500;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.btn-secondary:hover{border-color:var(--borderHover);color:var(--textSub)}
.btn-danger{background:none;border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--danger);cursor:pointer;font-size:12px}
.btn-sm{padding:4px 10px;font-size:11px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.stat-card{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.stat-sub{font-size:10px;color:var(--textMuted);margin-top:4px}

.pills-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:8px}
.pill:hover{opacity:.8}
.pill-num{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.pill-label{font-size:11px;opacity:.8}

/* Filter bar */
.filter-bar{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--accent)}
.filter-search{flex:1 1 160px}

/* Multiselect dropdown */
.ms-wrap{position:relative;display:inline-block}
.ms-trigger{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:6px 28px 6px 10px;color:var(--textSub);font-size:12px;cursor:pointer;white-space:nowrap;min-width:130px;position:relative;user-select:none;transition:border-color .15s}
.ms-trigger:hover{border-color:var(--borderHover)}
.ms-trigger.has-active{border-color:var(--accent);color:#93c5fd;background:var(--accentSoft)}
.ms-trigger::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--textMuted)}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:180px;background:var(--bgCard);border:1px solid var(--border);border-radius:7px;z-index:500;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.ms-dropdown.open{display:block}
.ms-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.ms-option:hover{background:var(--bgSurface);color:var(--text)}
.ms-option.selected{color:var(--text)}
.ms-check{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.ms-option.selected .ms-check{background:var(--accent);border-color:var(--accent);color:#fff}
.ms-clear{margin-top:4px;padding-top:6px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--textMuted);cursor:pointer;padding-bottom:2px}
.ms-clear:hover{color:var(--text)}

/* List */
.list{display:flex;flex-direction:column;gap:4px}
.list-item{background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.list-item:hover{border-color:var(--borderHover);background:var(--bgHover)}
.list-item.selected{background:var(--bgSurface);border-color:var(--accent)}
.item-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:12px;color:var(--textMuted);margin-top:2px}
.item-value{font-size:12px;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}
.prio-group{margin-bottom:18px}
.prio-header{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bgCard);border-left:1px solid var(--border);z-index:200;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .2s}
.detail-panel.open{transform:translateX(0)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.detail-title{font-size:16px;font-weight:600;margin-top:3px;line-height:1.3}
.detail-type{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em}
.close-btn{background:none;border:none;color:var(--textMuted);cursor:pointer;font-size:20px;line-height:1;padding:0;flex-shrink:0}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.detail-key{font-size:11px;color:var(--textMuted);flex-shrink:0}
.detail-val{font-size:11px;color:var(--textSub);max-width:220px;text-align:right;word-break:break-word}
.detail-notes{font-size:12px;color:#c4b5fd;margin-top:10px;line-height:1.7;padding:12px;background:#1a0f30;border:1px solid #2e1065;border-radius:6px}
.detail-section{font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-top:16px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.detail-actions{display:flex;gap:6px;margin-top:18px}
.detail-actions .btn-primary{flex:1;text-align:center}
.mini-card{padding:7px 9px;background:var(--bgSurface);border-radius:5px;margin-bottom:5px;cursor:default}
.mini-card.clickable{cursor:pointer;transition:border-color .15s;border:1px solid transparent}
.mini-card.clickable:hover{border-color:var(--accent);background:var(--bgHover)}
.mini-card-name{font-size:12px;font-weight:500}
.mini-card-sub{font-size:10px;color:var(--textMuted);margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.form-full{grid-column:1/-1}
.form-half{grid-column:span 2}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:10px;color:var(--textMuted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.form-label span{color:var(--danger)}
.form-input{width:100%;background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-notes{width:100%;background:#0d0820;border:1px solid #2e1065;border-radius:5px;padding:10px 12px;color:#c4b5fd;font-size:13px;outline:none;resize:vertical;line-height:1.6}
.form-notes:focus{border-color:#a78bfa}
.form-notes::placeholder{color:#4a3a70}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Dist search in modal */
.dist-search-wrap{background:var(--bgSurface);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.dist-search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:7px 10px;color:var(--text);font-size:12px;outline:none}
.dist-options{max-height:140px;overflow-y:auto;padding:4px}
.dist-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--textSub);transition:all .15s;user-select:none}
.dist-opt:hover{background:var(--bgHover);color:var(--text)}
.dist-opt.checked{color:var(--text)}
.dist-opt .dc{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.dist-opt.checked .dc{background:var(--accent);border-color:var(--accent);color:#fff}

/* Dashboard */
.dash-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-panel{background:var(--bgCard);border:1px solid var(--border);border-radius:8px;padding:14px}
.dash-panel-title{font-size:10px;font-weight:500;color:var(--textMuted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--textMuted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bgCard);border:1px solid var(--border);border-radius:7px;padding:9px 18px;font-size:12px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px;color:var(--textMuted);font-size:12px}
.mark-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--textMuted);cursor:pointer;font-size:10px;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.mark-btn.done{background:var(--successSoft);border-color:var(--success);color:var(--success)}
.demo-btn{border:1px solid var(--border);border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-weight:500;background:none;color:var(--textMuted)}
.demo-btn.active{background:#042f2e;border-color:#2dd4bf;color:#2dd4bf}
.demo-btn:hover{border-color:var(--borderHover)}
/* Calendar */
.cal-wrap{background:var(--bgCard);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.cal-title{font-size:14px;font-weight:600;color:var(--text)}
.cal-nav{display:flex;gap:6px}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--textMuted);cursor:pointer;font-size:12px;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--borderHover);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;padding:8px 4px;font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.cal-day{height:90px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;vertical-align:top;overflow:hidden}
.cal-day:nth-child(7n){border-right:none}
.cal-day.other-month .cal-day-num{color:var(--textMuted);opacity:.3}
.cal-day.today{background:var(--accentSoft)}
.cal-day.today .cal-day-num{color:var(--accent);font-weight:600}
.cal-day-num{font-size:11px;color:var(--textSub);margin-bottom:3px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:opacity .15s}
.cal-event:hover{opacity:.8}
.cal-event.demo{background:#042f2e;color:#2dd4bf;font-weight:600;border-left:2px solid #2dd4bf}
.cal-event.tarea{background:#1a1000;color:#fbbf24}
.cal-event.proyecto{background:#1e3a6e;color:#93c5fd}
.cal-event.lead{background:#2e1065;color:#c4b5fd}
/* Notes expand modal */
.notes-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.notes-modal{background:var(--bgCard);border:1px solid #2e1065;border-radius:12px;width:100%;max-width:700px;padding:24px;display:flex;flex-direction:column;gap:12px}
.notes-modal-header{display:flex;justify-content:space-between;align-items:center}
.notes-modal-title{font-size:13px;color:#a78bfa;font-weight:500}
.notes-modal textarea{width:100%;background:#0d0820;border:1px solid #2e1065;border-radius:6px;padding:14px;color:#c4b5fd;font-size:13px;outline:none;resize:none;line-height:1.7;height:320px;font-family:'DM Sans',sans-serif}
.notes-modal textarea:focus{border-color:#a78bfa}
.notes-expand-btn{background:none;border:none;color:#a78bfa;cursor:pointer;font-size:11px;padding:0;opacity:.7;transition:opacity .15s}
.notes-expand-btn:hover{opacity:1}

@media(max-width:768px){
  .sidebar{width:52px}
  .sidebar-logo,.sidebar-sub,.nav-label,.sidebar-footer div{display:none}
  .nav-btn{padding:10px;justify-content:center}
  .main{margin-left:52px}
  .main.panel-open{margin-right:0}
  .detail-panel{width:100%;top:auto;height:75vh}
  .dash-panels{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .form-half{grid-column:1/-1}
}
</style>
</head>

// ── API ──
async function apiFetch(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u.toString());return r.json();}
async function apiPost(b){
  // Use GET with callback for CORS-safe writes
  const u=new URL(API);
  u.searchParams.set('action',b.action);
  if(b.entity)u.searchParams.set('entity',b.entity);
  if(b.data){
    // chunk large data if needed, otherwise pass directly
    u.searchParams.set('data',JSON.stringify(b.data));
  }
  try{
    const r=await fetch(u.toString(),{redirect:'follow'});
    return r.json();
  }catch(e){
    return {ok:false,error:e.message};
  }
}

async function loadAll(){
  setSyncStatus('⟳');
  try{
    const ents=['leads','proyectos','distribuidores','facilities','contactos','tareas','ventas'];
    const res=await Promise.all(ents.map(e=>apiFetch({action:'read',entity:e})));
    ents.forEach((e,i)=>{
      state[e]=res[i].data||[];
      if(e==='proyectos')state[e]=state[e].map(p=>({
        ...p,
        valor:Number(p.valor)||0,
        demo:p.demo==='true'||p.demo===true?'true':'false',
        fechaDemo:p.fechaDemo?String(p.fechaDemo).slice(0,10):''
      }));
    });
    // Solo seed si el sheet está completamente vacío (instalación nueva)
    if(state.distribuidores.length===0&&state.proyectos.length===0){
      state=JSON.parse(JSON.stringify(SEED));
      await Promise.all(Object.keys(SEED).map(e=>apiPost({action:'write',entity:e,data:state[e]})));
      showToast('Primera carga — datos iniciales');
    }
    setSyncStatus('● Sync');render();
  }catch(err){
    // Si falla conexión NO cargamos seed — reintentamos
    setSyncStatus('✕ Sin conexión');
    showToast('Error de conexión. Reintentando...');
    setTimeout(loadAll,4000);
  }
}

function msDropdown(id, options, activeSet, placeholder){
  const active=activeSet.size>0;
  const label=active?[...activeSet].join(', '):placeholder;
  return`<div class="ms-wrap" id="ms-${id}">
    <div class="ms-trigger${active?' has-active':''}" onclick="toggleMs('${id}')">${label}</div>
    <div class="ms-dropdown" id="msd-${id}">
      ${options.map(o=>`<div class="ms-option${activeSet.has(o)?' selected':''}" onclick="toggleMsOpt('${id}','${o}')">
        <div class="ms-check">${activeSet.has(o)?'✓':''}</div>${o}
      </div>`).join('')}
      <div class="ms-clear" onclick="clearMs('${id}')">Limpiar filtro</div>
    </div>
  </div>`;
}
function toggleMs(id){
  // close others
  document.querySelectorAll('.ms-dropdown.open').forEach(d=>{if(d.id!=='msd-'+id)d.classList.remove('open');});
  document.getElementById('msd-'+id)?.classList.toggle('open');
}
function toggleMsOpt(id,val){
  if(filters.estados.has(val))filters.estados.delete(val);else filters.estados.add(val);
  render();
}
function clearMs(id){filters.estados.clear();render();}
function toggleDistFilter(id){

}

function renderList(){
  // Re-render only the list, preserving search input focus and value
  const listEl=document.querySelector('#content .list');
  const statsEl=document.querySelector('#content .estado-stats');
  if(!listEl){render();return;}
  const frag=document.createElement('div');
  const views={leads:rLeads,proyectos:rProyectos,distribuidores:rDist,facilities:rFacil,tareas:rTareas};
  frag.innerHTML=(views[currentView]||rDash)();
  const newList=frag.querySelector('.list');
  const newStats=frag.querySelector('.estado-stats');
  if(newList)listEl.innerHTML=newList.innerHTML;
  if(newStats&&statsEl)statsEl.innerHTML=newStats.innerHTML;
  // Re-bind list item clicks
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn')||e.target.closest('.demo-btn'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';renderList();await saveE('tareas');}
    });
  });
  document.querySelectorAll('[data-demo-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const p=state.proyectos.find(x=>x.id===btn.dataset.demoToggle);

    });

  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:'',distIds:new Set()};closeDetail();render();
    });
  });
}

  </div>

    ${[['Leads',leads.length,'#1e3a6e','#93c5fd','leads'],['Proyectos',total,'#2e1065','#c4b5fd','proyectos'],['Distribuidores',distribuidores.length,'#042f2e','#5eead4','distribuidores'],['Facilities',facilities.length,'#451a03','#fbbf24','facilities']].map(([l,n,bg,c,v])=>`<button class="pill" style="background:${bg}" data-nav="${v}"><span class="pill-num" style="color:${c}">${n}</span><span class="pill-label" style="color:${c}">${l}</span></button>`).join('')}

function rLeads(){
  const opts=['Nuevo','Contactado','Calificado','Convertido','Descartado'];
  const f=state.leads.filter(l=>matchEstados(l.estado||'Nuevo')&&(!filters.search||l.empresa?.toLowerCase().includes(filters.search.toLowerCase())));
  const totalLeads=state.leads.length;
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Leads <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${totalLeads}</span></h1><button class="btn-primary" id="btn-new">+ Nuevo lead</button></div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar empresa..." value="${filters.search}">
    ${msDropdown('leads-estado',opts,filters.estados,'Estado')}
  </div>
  <div class="list">${f.length?f.map(l=>`<div class="list-item${selectedItem?.id===l.id?' selected':''}" data-id="${l.id}" data-type="lead"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span class="item-name">${l.empresa||'—'}</span>${bdg(l.estado||'Nuevo')}</div><div class="item-sub">${l.contacto||''}${l.origen?' · '+l.origen:''}</div></div></div>`).join(''):'<div class="empty">No hay leads.</div>'}</div>`;
}

// ── Proyectos ──
function rProyectos(){
  const opts=['Activo','Pendiente','Inactivo','Ganado','Perdido'];
  const f=state.proyectos.filter(p=>{
    if(!matchEstados(p.estado))return false;
    if(filters.distIds&&filters.distIds.size>0){const pIds=getDistIds(p);if(![...filters.distIds].some(id=>pIds.includes(id)))return false;}
    if(filters.search){const s=filters.search.toLowerCase();if(!p.nombre?.toLowerCase().includes(s)&&!dNoms(p).toLowerCase().includes(s))return false;}
    return true;
  });
  const tot=f.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const estadoCount={};
  ['Activo','Pendiente','Inactivo','Ganado','Perdido'].forEach(e=>{estadoCount[e]=state.proyectos.filter(p=>p.estado===e).length;});
  const statsColors={'Activo':'#86efac','Pendiente':'#fbbf24','Inactivo':'#666','Ganado':'#86efac','Perdido':'#fca5a5'};
  const statsBg={'Activo':'#0a2010','Pendiente':'#1a1000','Inactivo':'#1a1a1a','Ganado':'#0a2010','Perdido':'#200808'};
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Proyectos <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${state.proyectos.length}</span></h1><div class="topbar-right">${tot>0?`<span style="font-size:11px;color:var(--textMuted);font-family:'DM Mono',monospace">${tot.toLocaleString('es-ES')}K€</span>`:''}<button class="btn-primary" id="btn-new">+ Nuevo</button></div></div>
  <div class="estado-stats" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    ${['Activo','Pendiente','Inactivo','Ganado','Perdido'].map(e=>`<div style="background:${statsBg[e]};border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer" onclick="filters.estados.size===1&&filters.estados.has('${e}')?filters.estados.clear():(() =>{filters.estados.clear();filters.estados.add('${e}');})();renderList()">
      <span style="font-size:16px;font-weight:700;font-family:'DM Mono',monospace;color:${statsColors[e]}">${estadoCount[e]}</span>
      <span style="font-size:10px;color:${statsColors[e]};opacity:.8">${e}</span>
    </div>`).join('')}
  </div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar proyecto o distribuidor..." value="${filters.search}">
${(()=>{
  const activeDistIds=filters.distIds||new Set();
  const label=activeDistIds.size>0?[...activeDistIds].map(id=>{const d=state.distribuidores.find(x=>x.id===id);return d?d.nombre:id;}).join(', ').slice(0,30):'Distribuidor';
  const hasActive=activeDistIds.size>0;
  return `<div class="ms-wrap" id="ms-dist-wrap">
    <div class="ms-trigger${hasActive?' has-active':''}" onclick="toggleMs('dist-wrap')">${label}</div>
    <div class="ms-dropdown" id="msd-dist-wrap" style="max-height:220px;overflow-y:auto">
      ${state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(d=>`<div class="ms-option${activeDistIds.has(d.id)?' selected':''}" onclick="toggleDistFilter('${d.id}')">
        <div class="ms-check">${activeDistIds.has(d.id)?'✓':''}</div>${d.nombre}
      </div>`).join('')}
      <div class="ms-clear" onclick="filters.distIds=new Set();renderList()">Limpiar filtro</div>
    </div>
  </div>`;
})()}
    ${msDropdown('proy-estado',opts,filters.estados,'Estado')}
  </div>
  <div class="list">${f.length?f.map(p=>{
    const sub=p.facilityId?getFacilityName(p.facilityId):dNoms(p);
    return`<div class="list-item${selectedItem?.id===p.id?' selected':''}" data-id="${p.id}" data-type="proyecto"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap"><span class="item-name">${p.nombre}</span>${bdg(p.estado)}${p.demo==='true'||p.demo===true?`<span style="font-size:10px;background:#042f2e;color:#2dd4bf;padding:2px 6px;border-radius:3px;font-weight:600">DEMO</span>`:''}</div><div class="item-sub">${sub}${p.modelo?' · '+p.modelo:''}</div></div><div style="display:flex;align-items:center;gap:6px">${p.valor>0?`<span class="item-value">${fv(p.valor)}</span>`:''}<button class="demo-btn${p.demo==='true'||p.demo===true?' active':''}" data-demo-toggle="${p.id}">${p.demo==='true'||p.demo===true?'🎯 Demo':'Demo'}</button></div></div>`;
  }).join(''):'<div class="empty">No hay proyectos</div>'}</div>`;
}

// ── Distribuidores ──

  const opts=['Activo','Negociando','Empieza','Se raja','Inactivo'];
  const f=state.distribuidores.filter(d=>matchEstados(d.estado||'Activo')&&(!filters.search||d.nombre?.toLowerCase().includes(filters.search.toLowerCase())));
  const distEstadoCount={};
  ['Activo','Negociando','Empieza','Se raja','Inactivo'].forEach(e=>{distEstadoCount[e]=state.distribuidores.filter(d=>d.estado===e).length;});
  const dColors={'Activo':'#86efac','Negociando':'#93c5fd','Empieza':'#5eead4','Se raja':'#fca5a5','Inactivo':'#666'};
  const dBg={'Activo':'#0a2010','Negociando':'#1e3a6e','Empieza':'#042f2e','Se raja':'#200808','Inactivo':'#1a1a1a'};
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Distribuidores <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${state.distribuidores.length}</span></h1><button class="btn-primary" id="btn-new">+ Nuevo</button></div>
  <div class="estado-stats" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    ${['Activo','Negociando','Empieza','Se raja','Inactivo'].map(e=>`<div style="background:${dBg[e]};border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer" onclick="filters.estados.size===1&&filters.estados.has('${e}')?filters.estados.clear():(() =>{filters.estados.clear();filters.estados.add('${e}');})();renderList()">
      <span style="font-size:16px;font-weight:700;font-family:'DM Mono',monospace;color:${dColors[e]}">${distEstadoCount[e]}</span>
      <span style="font-size:10px;color:${dColors[e]};opacity:.8">${e}</span>
    </div>`).join('')}
  </div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar..." value="${filters.search}">
    ${msDropdown('dist-estado',opts,filters.estados,'Estado')}
  </div>
  <div class="list">${f.length?f.map(d=>{const np=state.proyectos.filter(p=>getDistIds(p).includes(d.id)).length;return`<div class="list-item${selectedItem?.id===d.id?' selected':''}" data-id="${d.id}" data-type="distribuidor"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span class="item-name">${d.nombre}</span>${bdg(d.estado||'Activo')}</div><div class="item-sub">${d.provincia||''}${np>0?' · '+np+' proyectos':''}</div></div></div>`;}).join(''):'<div class="empty">No hay distribuidores</div>'}</div>`;
}

// ── Facilities ──
function rFacil(){
  const f=state.facilities.filter(x=>!filters.search||x.nombre?.toLowerCase().includes(filters.search.toLowerCase()));
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Facilities <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${state.facilities.length}</span></h1><button class="btn-primary" id="btn-new">+ Nuevo</button></div>
  <div class="filter-bar"><input class="filter-input filter-search" id="f-search" placeholder="Buscar..." value="${filters.search}"></div>
  <div class="list">${f.length?f.map(x=>{
    const nc=state.contactos.filter(c=>c.facilityId===x.id).length;
    const np=state.proyectos.filter(p=>p.facilityId===x.id).length;
    return`<div class="list-item${selectedItem?.id===x.id?' selected':''}" data-id="${x.id}" data-type="facility"><div style="flex:1;min-width:0"><div class="item-name" style="margin-bottom:3px">${x.nombre}</div><div class="item-sub">${x.zona||''}${nc>0?' · '+nc+' contactos':''}${np>0?' · '+np+' proyectos':''}</div></div>${bdg(x.estado||'')}</div>`;
  }).join(''):'<div class="empty">No hay facilities. Añade clientes finales como ILUNION, OPTIMA, ACCIONA...</div>'}</div>`;
}

// ── Tareas ──
function rTareas(){
  const opts=['Pendiente','En curso','Hecha'];
  const f=state.tareas.filter(t=>{
    if(!matchEstados(t.estado||'Pendiente'))return false;
    if(filters.search&&!t.titulo?.toLowerCase().includes(filters.search.toLowerCase()))return false;
    if(filters.distId&&t.vinculoDistId!==filters.distId)return false;
    return true;
  });
  const gs=['Alta','Media','Baja'].map(p=>({p,items:f.filter(t=>t.prioridad===p)})).filter(g=>g.items.length);
  const tarPend=state.tareas.filter(t=>t.estado!=='Hecha').length;
  return`
  <div class="topbar"><h1 style="text-transform:uppercase">Tareas <span style="font-size:14px;font-weight:400;color:var(--textMuted);margin-left:6px">${tarPend} pend.</span></h1><button class="btn-primary" id="btn-new">+ Nueva tarea</button></div>
  <div class="filter-bar">
    <input class="filter-input filter-search" id="f-search" placeholder="Buscar..." value="${filters.search}">
    ${msDropdown('tar-estado',opts,filters.estados,'Estado')}
  </div>
  ${gs.map(g=>`<div class="prio-group"><div class="prio-header">${bdg(g.p)} <span>(${g.items.length})</span></div><div class="list">
    ${g.items.map(t=>{
      const vp=state.proyectos.find(x=>x.id===t.vinculoProjId);
      const vd=state.distribuidores.find(x=>x.id===t.vinculoDistId);
      const sub=[vp?vp.nombre:'',vd?vd.nombre:''].filter(Boolean).join(' · ');
      return`<div class="list-item${selectedItem?.id===t.id?' selected':''}" data-id="${t.id}" data-type="tarea"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;flex-wrap:wrap"><span class="item-name" style="${t.estado==='Hecha'?'text-decoration:line-through;color:var(--textMuted)':''}">${t.titulo}</span>${bdg(t.tipo||'')}${bdg(t.estado)}</div><div class="item-sub">${sub}${sub&&t.fecha?' · ':''}${t.fecha||''}</div></div><button class="mark-btn${t.estado==='Hecha'?' done':''}" data-toggle="${t.id}">${t.estado==='Hecha'?'✓ Hecha':'Marcar'}</button></div>`;
    }).join('')}
  </div></div>`).join('')}
  ${f.length===0?'<div class="empty">No hay tareas</div>':''}`;
}

// ── Detail panel ──
function openDetail(item,type){
  selectedItem=item;selectedType=type;
  document.getElementById('detail-panel').innerHTML=rDetail(item,type);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
  bindDL();
}
function closeDetail(){selectedItem=null;selectedType=null;document.getElementById('detail-panel').classList.remove('open');document.getElementById('main').classList.remove('panel-open');}

function rDetail(item,type){
  const rows=pairs=>pairs.filter(([,v])=>v).map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  let h=`<div class="detail-header"><div><div class="detail-type">${type}</div><div class="detail-title">${item.nombre||item.empresa||item.titulo||''}</div></div><button class="close-btn" id="btn-close-detail">×</button></div>`;
  if(type==='proyecto'){
    const isDemo=item.demo==='true'||item.demo===true;
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">${bdg(item.estado)}<button class="demo-btn${isDemo?' active':''}" data-demo-toggle="${item.id}">${isDemo?'🎯 Demo activa':'Demo'}</button></div>`;
    if(isDemo&&item.fechaDemo)h+=`<div style="font-size:11px;color:#2dd4bf;margin-bottom:10px">📅 Demo: ${item.fechaDemo}</div>`;
    h+=rows([['Distribuidores',dNoms(item)],['Facility',item.facilityId?getFacilityName(item.facilityId):''],['Modelo',item.modelo],['Valor est.',fv(item.valor)],['Prox. contacto',item.fecha]]);
    if(item.notas){const nid='notes-'+Math.random().toString(36).slice(2);window['_n'+nid]=item.notas;h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" onclick="openNotesModal(window['_n${nid}'])" title="Expandir notas">⤢</button></div>`;}
    const tars=state.tareas.filter(t=>t.vinculoProjId===item.id);
    if(tars.length){h+=`<div class="detail-section"><span>Tareas</span></div>`;h+=tars.map(t=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${t.titulo}</div><div class="mini-card-sub">${t.fecha||''}</div></div>${bdg(t.estado)}</div>`).join('');}
  }
  if(type==='distribuidor'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Activo')}</div>`;
    h+=rows([['Provincia/Zona',item.provincia]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    const projs=state.proyectos.filter(p=>getDistIds(p).includes(item.id));
    if(projs.length){h+=`<div class="detail-section"><span>Proyectos (${projs.length})</span></div>`;h+=projs.map(p=>`<div class="mini-card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}</div></div>${bdg(p.estado)}</div>`).join('');}
  }
  if(type==='lead'){
    h+=`<div style="margin-bottom:14px">${bdg(item.estado||'Nuevo')}</div>`;
    h+=rows([['Contacto',item.contacto],['Origen',item.origen]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
  }
  if(type==='facility'){
    h+=rows([['Zona/Provincia',item.zona]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
    // Contactos
    const conts=state.contactos.filter(c=>c.facilityId===item.id);
    h+=`<div class="detail-section"><span>Contactos</span><button class="btn-secondary btn-sm" id="btn-add-contacto">+ Añadir</button></div>`;
    if(conts.length)h+=conts.map(c=>`<div class="mini-card clickable" data-contacto-id="${c.id}" title="Doble clic para editar"><div class="mini-card-name">${c.nombre}</div><div class="mini-card-sub">${c.cargo||''}${c.email?' · '+c.email:''}</div></div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin contactos</div>`;
    // Proyectos
    const projs=state.proyectos.filter(p=>p.facilityId===item.id);
    h+=`<div class="detail-section"><span>Proyectos</span><button class="btn-secondary btn-sm" id="btn-add-proyecto-facility">+ Añadir</button></div>`;
    if(projs.length)h+=projs.map(p=>`<div class="mini-card clickable" data-proj-id="${p.id}" style="display:flex;justify-content:space-between;align-items:center" title="Doble clic para editar"><div><div class="mini-card-name">${p.nombre}</div><div class="mini-card-sub">${p.modelo||''}${p.valor>0?' · '+fv(p.valor):''}</div></div>${bdg(p.estado)}</div>`).join('');
    else h+=`<div style="font-size:11px;color:var(--textMuted);margin-bottom:8px;padding:6px 0">Sin proyectos</div>`;
  }
  if(type==='tarea'){
    h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${bdg(item.tipo||'')}${bdg(item.prioridad)}${bdg(item.estado)}</div>`;
    const vp=state.proyectos.find(x=>x.id===item.vinculoProjId);
    const vd=state.distribuidores.find(x=>x.id===item.vinculoDistId);
    if(vp)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vp.nombre}</div><div class="mini-card-sub">Proyecto</div></div>`;
    if(vd)h+=`<div class="mini-card" style="margin-bottom:6px"><div class="mini-card-name">${vd.nombre}</div><div class="mini-card-sub">Distribuidor</div></div>`;
    h+=rows([['Fecha límite',item.fecha]]);
    if(item.notas)h+=`<div style="position:relative"><div class="detail-notes" style="padding-right:30px">${item.notas}</div><button class="notes-expand-btn" style="position:absolute;top:8px;right:8px" data-expand-notes onclick="openNotesModal(this.closest('div').querySelector('.detail-notes').textContent)" title="Expandir notas">⤢</button></div>`;
  }
  h+=`<div class="detail-actions"><button class="btn-primary" id="btn-edit-detail">Editar</button><button class="btn-danger" id="btn-del-detail">Eliminar</button></div>`;
  return h;
}

// ── Modal ──
function openModal(type,item=null,presets={}){
  editingItem=item;
  const ov=document.createElement('div');ov.className='modal-overlay';ov.id='modal-overlay';
  ov.innerHTML=rModal(type,item,presets);
  document.body.appendChild(ov);
  bindML(type);
}
function closeModal(){document.getElementById('modal-overlay')?.remove();editingItem=null;}

function distSearchWidget(selected=[]){
  const sel=Array.isArray(selected)?selected:String(selected).split(',').map(s=>s.trim()).filter(Boolean);
  const opts=state.distribuidores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return`<div class="dist-search-wrap">
    <input class="dist-search-input" placeholder="Buscar distribuidor..." oninput="filterDistOpts(this.value)">
    <div class="dist-options" id="dist-opts-list">
      ${opts.map(d=>`<div class="dist-opt${sel.includes(d.id)?' checked':''}" data-dist-id="${d.id}" onclick="toggleDistOpt(this)"><div class="dc">${sel.includes(d.id)?'✓':''}</div>${d.nombre}</div>`).join('')}
    </div>
  </div>`;
}
function filterDistOpts(q){
  document.querySelectorAll('#dist-opts-list .dist-opt').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}
function toggleDistOpt(el){
  el.classList.toggle('checked');
  const dc=el.querySelector('.dc');
  dc.textContent=el.classList.contains('checked')?'✓':'';
}

function rModal(type,item,presets={}){
  const v={...presets,...(item||{})};
  const titles={lead:'Lead',proyecto:'Proyecto',distribuidor:'Distribuidor',facility:'Facility',tarea:'Tarea',contacto:'Contacto'};
  const title=(item?'Editar ':'Nuevo ')+titles[type];
  let fields='';

  if(type==='lead') fields=`<div class="form-grid">
    <div class="form-full form-group"><label class="form-label">Empresa <span>*</span></label><input class="form-input" name="empresa" value="${v.empresa||''}"></div>
    <div class="form-group"><label class="form-label">Contacto</label><input class="form-input" name="contacto" value="${v.contacto||''}"></div>
    <div class="form-group"><label class="form-label">Origen</label><select class="form-input" name="origen"><option>—</option>${['Web','Feria','Proveedor','Referido','Otro'].map(o=>`<option${v.origen===o?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Estado</label><select class="form-input" name="estado">${['Nuevo','Contactado','Calificado','Convertido','Descartado'].map(o=>`<option${v.estado===o?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-full form-group"><label class="form-label" style="color:#a78bfa">Notas</label><textarea class="form-notes" name="notas" rows="4" placeholder="Notas...">${v.notas||''}</textarea></div>
  </div>`;

  if(type==='proyecto'){
    const selDist=v.distribuidorIds?Array.isArray(v.distribuidorIds)?v.distribuidorIds:String(v.distribuidorIds).split(',').map(s=>s.trim()).filter(Boolean):[];

function bindL(){
  document.querySelectorAll('.list-item[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.mark-btn'))return;
      const id=el.dataset.id,type=el.dataset.type;
      const km={proyecto:'proyectos',distribuidor:'distribuidores',lead:'leads',facility:'facilities',tarea:'tareas'};
      const item=(state[km[type]]||[]).find(x=>x.id===id);
      if(item){openDetail(item,type);render();}
    });
  });
  document.querySelectorAll('.mark-btn[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const t=state.tareas.find(x=>x.id===btn.dataset.toggle);
      if(t){t.estado=t.estado==='Hecha'?'Pendiente':'Hecha';render();await saveE('tareas');}
    });
  });
  const bn=document.getElementById('btn-new');
  if(bn)bn.addEventListener('click',()=>{const tm={leads:'lead',proyectos:'proyecto',distribuidores:'distribuidor',facilities:'facility',tareas:'tarea'};openModal(tm[currentView]||'tarea');});
  const fs=document.getElementById('f-search');
  if(fs){
    fs.addEventListener('input',e=>{
      filters.search=e.target.value;
      renderList(); // only re-render the list, not the whole page
    });
    // prevent cursor loss on re-render
    fs.addEventListener('keydown',e=>e.stopPropagation());
  }
  const fd=document.getElementById('f-dist');
  if(fd)fd.addEventListener('change',e=>{filters.distId=e.target.value;renderList();});
  // Demo toggle buttons (in list and detail)
  document.querySelectorAll('[data-demo-toggle]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const p=state.proyectos.find(x=>x.id===btn.dataset.demoToggle);
      if(p){
        p.demo=p.demo==='true'||p.demo===true?'false':'true';
        render();
        if(selectedItem?.id===p.id){openDetail(p,'proyecto');render();}
        await saveE('proyectos');
      }
    });
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentView=btn.dataset.nav;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`[data-view="${currentView}"]`)?.classList.add('active');
      filters={search:'',estados:new Set(),distId:'',distIds:new Set()};closeDetail();render();
    });
  });
}

function bindML(type){
  document.getElementById('btn-close-modal')?.addEventListener('click',closeModal);
  document.getElementById('btn-cancel-modal')?.addEventListener('click',closeModal);
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const data={};
    new FormData(form).forEach((v,k)=>data[k]=v);
    // multi distribuidor from search widget
    if(type==='proyecto'){
      const checked=[...form.querySelectorAll('.dist-opt.checked')].map(c=>c.dataset.distId);
      data.distribuidorIds=checked.join(',');
      data.valor=Number(data.valor)||0;
      // handle demo checkbox
      const chkDemo=form.querySelector('[name="demo"]');
      data.demo=chkDemo?String(chkDemo.checked):'false';
    }
    const km={lead:'leads',proyecto:'proyectos',distribuidor:'distribuidores',facility:'facilities',tarea:'tareas',contacto:'contactos'};
    const key=km[type];if(!key)return;
    if(editingItem){
      Object.assign(editingItem,data);
      state[key]=state[key].map(x=>x.id===editingItem.id?editingItem:x);
      if(selectedItem?.id===editingItem.id)selectedItem=editingItem;
    } else {
      const px={lead:'L',proyecto:'P',distribuidor:'D',facility:'F',tarea:'T',contacto:'C'};
      data.id=genId(px[type]||'X');
      if(!data.fecha)data.fecha=today();
      state[key].push(data);
    }
    const facId=data.facilityId||editingItem?.facilityId;
    closeModal();
    if((type==='contacto'||type==='proyecto')&&facId){
      const fac=state.facilities.find(f=>f.id===facId);
      if(fac){openDetail(fac,'facility');}
    } else {
      closeDetail();
    }
    render();
    await saveE(key);
  });
}


// ── Calendario ──
function rCalendario(){
  const now=new Date();
  const y=window._calYear||now.getFullYear();
  const m=window._calMonth!==undefined?window._calMonth:now.getMonth();
  window._calYear=y;window._calMonth=m;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  // Monday-based offset
  let startOffset=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  // Build events map: key = 'YYYY-MM-DD'
  const events={};
  const addEvent=(dateStr,label,type)=>{
    if(!dateStr)return;
    const d=dateStr.slice(0,10);
    if(!events[d])events[d]=[];
    events[d].push({label,type});
  };
  state.proyectos.forEach(p=>{
    const isDemo=p.demo==='true'||p.demo===true;
    if(isDemo&&p.fechaDemo)addEvent(p.fechaDemo,'🎯 '+p.nombre,'demo');
    if(p.fecha)addEvent(p.fecha,'◈ '+p.nombre,'proyecto');
  });
  state.tareas.forEach(t=>{if(t.fecha&&t.estado!=='Hecha')addEvent(t.fecha,'✓ '+t.titulo,'tarea');});
  state.leads.forEach(l=>{if(l.fecha)addEvent(l.fecha,'◎ '+l.empresa,'lead');});

  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    const isCurrentMonth=dayNum>=1&&dayNum<=lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateStr=date.toISOString().slice(0,10);
    const isToday=dateStr===new Date().toISOString().slice(0,10);
    const dayEvents=events[dateStr]||[];
    cells+=`<div class="cal-day${!isCurrentMonth?' other-month':''}${isToday?' today':''}">
      <div class="cal-day-num">${isCurrentMonth?dayNum:''}</div>
      ${dayEvents.slice(0,3).map(e=>`<div class="cal-event ${e.type}" title="${e.label}">${e.label}</div>`).join('')}
      ${dayEvents.length>3?`<div style="font-size:9px;color:var(--textMuted)">+${dayEvents.length-3} más</div>`:''}
    </div>`;
  }

  return`<div class="topbar"><h1 style="text-transform:uppercase">Calendario</h1></div>
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="cal-title">${monthNames[m]} ${y}</span>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
    <span style="font-size:11px;color:#2dd4bf">🎯 Demo</span>
    <span style="font-size:11px;color:#93c5fd">◈ Proyecto (próx. contacto)</span>
    <span style="font-size:11px;color:#fbbf24">✓ Tarea</span>
    <span style="font-size:11px;color:#c4b5fd">◎ Lead</span>
  </div>`;
}

function changeMonth(dir){
  let m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  let y=window._calYear||new Date().getFullYear();
  m+=dir;
  if(m<0){m=11;y--;}
  if(m>11){m=0;y++;}
  window._calMonth=m;window._calYear=y;
  render();
}

// ── Mini calendar for dashboard ──
function rCalMini(){
  return buildCal(window._calYear||new Date().getFullYear(), window._calMonth!==undefined?window._calMonth:new Date().getMonth(), true);
}

function buildCal(y,m,mini=false){
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dows=['L','M','X','J','V','S','D'];
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startOffset=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  const events={};
  const addEvent=(dateStr,label,type)=>{
    if(!dateStr)return;
    const d=dateStr.slice(0,10);
    if(!events[d])events[d]=[];
    events[d].push({label,type});
  };
  state.proyectos.forEach(p=>{
    const isDemo=p.demo==='true'||p.demo===true;
    if(isDemo&&p.fechaDemo)addEvent(p.fechaDemo,'🎯 '+p.nombre,'demo');
    if(p.fecha)addEvent(p.fecha,'◈ '+p.nombre,'proyecto');
  });
  state.tareas.forEach(t=>{if(t.fecha&&t.estado!=='Hecha')addEvent(t.fecha,'✓ '+t.titulo,'tarea');});
  state.leads.forEach(l=>{if(l.fecha)addEvent(l.fecha,'◎ '+(l.empresa||'Lead'),'lead');});

  const cellH = mini ? '70px' : '90px';
  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    const isCurrentMonth=dayNum>=1&&dayNum<=lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateStr=date.toISOString().slice(0,10);
    const isToday=dateStr===new Date().toISOString().slice(0,10);
    const dayEvents=events[dateStr]||[];
    const maxShow = mini ? 2 : 3;
    cells+=`<div style="height:${cellH};padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;background:${isToday?'var(--accentSoft)':'transparent'}">
      <div style="font-size:10px;color:${isCurrentMonth?(isToday?'var(--accent)':'var(--textSub)'):'var(--textMuted)'};${isToday?'font-weight:600':''}margin-bottom:2px">${isCurrentMonth?dayNum:''}</div>
      ${dayEvents.slice(0,maxShow).map(e=>`<div class="cal-event ${e.type}" title="${e.label}">${e.label}</div>`).join('')}
      ${dayEvents.length>maxShow?`<div style="font-size:9px;color:var(--textMuted)">+${dayEvents.length-maxShow}</div>`:''}
    </div>`;
  }

  const navId = mini ? 'mini' : 'modal';
  return`<div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1,'${navId}')">‹</button>
      <span class="cal-title">${monthNames[m]} ${y}</span>
      <div style="display:flex;gap:6px">
        <button class="cal-nav-btn" onclick="goToday('${navId}')" style="font-size:10px;padding:4px 8px">Hoy</button>
        <button class="cal-nav-btn" onclick="changeMonth(1,'${navId}')">›</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border)">
      ${dows.map(d=>`<div style="text-align:center;padding:6px 2px;font-size:10px;color:var(--textMuted);text-transform:uppercase;border-right:1px solid var(--border);border-bottom:1px solid var(--border)">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="display:flex;gap:12px;padding:8px 12px;flex-wrap:wrap">
      <span style="font-size:10px;color:#2dd4bf">🎯 Demo</span>
      <span style="font-size:10px;color:#93c5fd">◈ Proyecto</span>
      <span style="font-size:10px;color:#fbbf24">✓ Tarea</span>
      <span style="font-size:10px;color:#c4b5fd">◎ Lead</span>
    </div>
  </div>`;
}

function goToday(ctx='mini'){
  window._calMonth=new Date().getMonth();
  window._calYear=new Date().getFullYear();
  if(ctx==='mini'){
    const el=document.getElementById('cal-mini');
    if(el)el.innerHTML=rCalMini();
  } else {
    const el=document.getElementById('cal-modal-content');
    if(el)el.innerHTML=buildCal(window._calYear,window._calMonth,false);
  }
}

function changeMonth(dir, ctx='mini'){
  let m=window._calMonth!==undefined?window._calMonth:new Date().getMonth();
  let y=window._calYear||new Date().getFullYear();
  m+=dir; if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  window._calMonth=m; window._calYear=y;
  if(ctx==='mini'){
    const el=document.getElementById('cal-mini');
    if(el)el.innerHTML=rCalMini();
  } else {
    const el=document.getElementById('cal-modal-content');
    if(el)el.innerHTML=buildCal(y,m,false);
  }
}

  const y=window._calYear||new Date().getFullYear();

}

      <span style="font-size:10px;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em">Ventas por distribuidor${distFiltrada.length<dist.length?' ('+distFiltrada.length+' de '+dist.length+')':''}</span>
      <div style="display:flex;gap:6px">
        ${Object.entries(catColors).map(([cat,[bg,c]])=>`<span style="font-size:11px;background:${bg};color:${c};padding:3px 10px;border-radius:4px;font-weight:500">${cat}</span>`).join('')}

      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:var(--bgSurface)">
            <th style="padding:10px 14px;text-align:left;color:var(--textMuted);font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--bgSurface)">#</th>

              MODELOS_CAT[cat].filter(m=>modsFiltrados.includes(m)).map(m=>`<th style="padding:8px 10px;text-align:center;color:${c};font-weight:600;background:${bg};white-space:nowrap;font-size:11px">${m}</th>`).join('')
            ).join('')}

          </tr>
        </thead>
        <tbody>
          ${distConTotal.map((d,i)=>`
            <tr style="border-bottom:1px solid var(--border);${i%2===0?'':'background:var(--bgSurface)'}">
              <td style="padding:9px 14px;color:var(--textMuted);position:sticky;left:0;background:${i%2===0?'var(--bgCard)':'var(--bgSurface)'}">${i+1}</td>

                const v=fTrim?mesIdxs.reduce((s,idx)=>s+(Number((mensual[m]||[])[idx])||0),0):(Number(d[m])||0);

function renderVentas(){
  if(currentView==='ventas'){
    document.getElementById('content').innerHTML=rVentas();
    bindL();
  }
}

function toggleVFiltCat(cat){
  if(!window._vFiltCat)window._vFiltCat=new Set();
  if(window._vFiltCat.has(cat))window._vFiltCat.delete(cat);
  else window._vFiltCat.add(cat);
  window._vFiltMod=new Set(); // reset model filter when cat changes
  renderVentas();
}
function toggleVFiltTrim(q){
  window._vFiltTrim=(window._vFiltTrim===q)?null:q;
  renderVentas();
}
function toggleVFiltDist(d){
  if(!window._vFiltDist)window._vFiltDist=new Set();
  if(window._vFiltDist.has(d))window._vFiltDist.delete(d);
  else window._vFiltDist.add(d);
  renderVentas();
}
function clearVFiltros(){
  window._vFiltDist=new Set();
  window._vFiltCat=new Set();
  window._vFiltMod=new Set();
  window._vFiltTrim=null;
  renderVentas();
}

    <form id="crm-form">
      <div class="form-group"><label class="form-label">Distribuidor <span>*</span></label><select class="form-input" name="distIdx">${distOpts}</select></div>
      <div class="form-group"><label class="form-label">Modelo <span>*</span></label><select class="form-input" name="modelo">${modelOpts}</select></div>
      <div class="form-group"><label class="form-label">Mes</label><select class="form-input" name="mes">${MESES_SHORT.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Cantidad <span>*</span></label><input class="form-input" name="cantidad" type="number" min="1" value="1"></div>
      <div class="form-actions"><button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('btn-close-modal')?.addEventListener('click',()=>ov.remove());
  document.getElementById('btn-cancel-modal')?.addEventListener('click',()=>ov.remove());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.getElementById('crm-form')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const data=new FormData(e.target);
    const idx=Number(data.get('distIdx'));
    const modelo=data.get('modelo');
    const mes=Number(data.get('mes'));
    const cant=Number(data.get('cantidad'))||1;
    const dist=getVentasDist();
    dist[idx][modelo]=(Number(dist[idx][modelo])||0)+cant;
    if(!state.ventas)state.ventas={};
    state.ventas.dist=dist;
    // Also update monthly
    const mensual=getVentasMensual();
    if(!mensual[modelo])mensual[modelo]=Array(12).fill(0);
    mensual[modelo][mes]=(Number(mensual[modelo][mes])||0)+cant;
    state.ventas.mensual=mensual;
    ov.remove();
    render();
    await saveVentas();
  });
}
